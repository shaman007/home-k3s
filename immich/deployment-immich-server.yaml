---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
  labels:
    app: immich-server
    app.kubernetes.io/name: immich-server
    app.kubernetes.io/instance: immich-server
    app.kubernetes.io/part-of: immich
    app.kubernetes.io/version: v2.6.3
    app.kubernetes.io/managed-by: argoCD
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      annotations:
        checksum/application-startup-gate: 1eec42040d69692dad4b3226b079da6781f9fe5edea62e2173293ea5d3439aad
      labels:
        app: immich-server
        app.kubernetes.io/name: immich-server
        app.kubernetes.io/part-of: immich
    spec:
      runtimeClassName: nvidia
      priorityClassName: homelab-essential
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/hostname: talos-d4h-k5m
      initContainers:
        - name: prepare-library
          image: harbor.andreybondarenko.com/dockerhub/busybox:1.38
          command:
            - sh
            - -c
            - find /data -path /data/lost+found -prune -o \( ! -user 1000 -o ! -group 1000 \) -exec chown 1000:1000 {}
              +
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: library
              mountPath: /data
        - name: wait-for-postgres
          image: harbor.andreybondarenko.com/github/immich-app/postgres:16-vectorchord0.4.3-pgvectors0.2.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - /startup-gate/wait_service.sh
            - postgres
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          env:
            - name: PGHOST
              value: immich-postgres
            - name: PGDATABASE
              value: immich
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-env
                  key: DB_PASSWORD
          volumeMounts:
            - name: startup-gate
              mountPath: /startup-gate
              readOnly: true
        - name: wait-for-valkey
          image: harbor.andreybondarenko.com/dockerhub/valkey/valkey:9
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - /startup-gate/wait_service.sh
            - valkey
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          env:
            - name: VALKEY_HOST
              value: immich-valkey
          volumeMounts:
            - name: startup-gate
              mountPath: /startup-gate
              readOnly: true
      containers:
        - name: immich-server
          image: harbor.andreybondarenko.com/github/immich-app/immich-server:v3.4.1
          imagePullPolicy: IfNotPresent
          env:
            - name: IMMICH_TELEMETRY_INCLUDE
              value: all
            - name: DB_HOSTNAME
              value: immich-postgres
            - name: DB_USERNAME
              value: postgres
            - name: DB_DATABASE_NAME
              value: immich
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-env
                  key: DB_PASSWORD
            - name: REDIS_HOSTNAME
              value: immich-valkey
            - name: IMMICH_MACHINE_LEARNING_URL
              value: http://immich-machine-learning:3003
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,video,utility
            - name: TZ
              value: Europe/Prague
            - name: HOME
              value: /tmp
          ports:
            - name: http
              containerPort: 2283
            - name: api-metrics
              containerPort: 8081
            - name: worker-metrics
              containerPort: 8082
          startupProbe:
            httpGet:
              path: /api/server/ping
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/server/ping
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: library
              mountPath: /data
            - name: stash-data
              mountPath: /external-libraries/stash-data
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 100m
              memory: 3584Mi
            limits:
              memory: 5120Mi
              nvidia.com/gpu: 1
      volumes:
        - name: library
          persistentVolumeClaim:
            claimName: immich-library-hdd
        - name: stash-data
          hostPath:
            path: /var/mnt/storage/k8s/stash-data
            type: Directory
        - name: tmp
          emptyDir: {}
        - name: startup-gate
          configMap:
            name: immich-startup-gate
