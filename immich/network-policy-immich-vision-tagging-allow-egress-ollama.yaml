---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: immich-vision-tagging-allow-egress-ollama
  namespace: immich
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: immich-vision-tagging
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ollama
          podSelector:
            matchLabels:
              app: ollama
      ports:
        - protocol: TCP
          port: 11434
    # Some CNIs evaluate egress policies before translating Service ClusterIPs.
    - to:
        - ipBlock:
            cidr: 10.43.0.0/16
      ports:
        - protocol: TCP
          port: 11434
