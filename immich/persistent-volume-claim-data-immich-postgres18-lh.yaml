apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-immich-postgres18-lh
  namespace: immich
  labels:
    app.kubernetes.io/name: immich-postgres
    app.kubernetes.io/instance: immich-postgres
    app.kubernetes.io/part-of: immich
    app.kubernetes.io/managed-by: argoCD
    recurring-job.longhorn.io/source: enabled
    recurring-job.longhorn.io/backup-daily-retain31-a: enabled
    recurring-job.longhorn.io/trim-daily-c: enabled
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
