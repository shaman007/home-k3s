apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loki-allow-egress-s3-internal
  namespace: loki
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: single-binary
      app.kubernetes.io/name: loki
      app.kubernetes.io/instance: loki
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: seaweedfs
      podSelector:
        matchLabels:
          app: seaweedfs-s3
    ports:
    - protocol: TCP
      port: 8333
