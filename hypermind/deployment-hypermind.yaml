apiVersion: apps/v1
kind: Deployment
metadata:
  name: hypermind
  namespace: hypermind
  labels:
    app.kubernetes.io/name: hypermind
    app.kubernetes.io/instance: hypermind
    app.kubernetes.io/version: "1.6.1"
    app.kubernetes.io/managed-by: argoCD
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hypermind
  template:
    metadata:
      labels:
        app: hypermind
        app.kubernetes.io/name: hypermind
        app.kubernetes.io/instance: hypermind
        app.kubernetes.io/version: "1.6.1"
    spec:
      automountServiceAccountToken: false
      priorityClassName: homelab-best-effort
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hypermind
          image: harbor.andreybondarenko.com/github/lklynet/hypermind-swarm:1.6.1@sha256:1c63e7f2b6425be6bceb747d5fd8e4f5894e0fda409f2de9073ffd518a80517f
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: DEVICE_PERSISTENCE
              value: "false"
            - name: MEGA_NODE
              value: "false"
            - name: STORAGE_PATH
              value: /app/storage
            - name: HOME
              value: /tmp
            - name: TMPDIR
              value: /tmp
          volumeMounts:
            - name: storage
              mountPath: /app/storage
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: storage
          emptyDir: {}
        - name: tmp
          emptyDir: {}
