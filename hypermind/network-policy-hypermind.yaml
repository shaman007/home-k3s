apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hypermind-default-deny
  namespace: hypermind
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hypermind-allow-ingress-from-traefik
  namespace: hypermind
spec:
  podSelector:
    matchLabels:
      app: hypermind
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hypermind-allow-p2p-egress
  namespace: hypermind
spec:
  podSelector:
    matchLabels:
      app: hypermind
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
        - ipBlock:
            cidr: ::/0
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hypermind-allow-dns-egress
  namespace: hypermind
spec:
  podSelector:
    matchLabels:
      app: hypermind
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
