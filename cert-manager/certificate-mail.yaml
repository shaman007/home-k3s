---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mail
  namespace: mail
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: letsencrypt-prod
    app.kubernetes.io/part-of: mail
    app.kubernetes.io/managed-by: argoCD
spec:
  secretName: letsencrypt-prod-cert-manager
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: letsencrypt-prod
  dnsNames:
    - andreybondarenko.com
