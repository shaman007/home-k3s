---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-harbor-dns01
spec:
  acme:
    email: me@andreybondarenko.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-harbor-dns01-account-key
    solvers:
      - selector:
          dnsNames: [harbor.andreybondarenko.com]
        dns01:
          cnameStrategy: Follow
          webhook:
            groupName: acme.int.andreybondarenko.com
            solverName: godaddy-v3
