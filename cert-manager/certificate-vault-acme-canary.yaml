---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-acme-canary
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  secretName: vault-acme-canary-tls
  duration: 720h
  renewBefore: 168h
  dnsNames:
    - vault.w386.k8s.my.lan
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: vault-acme
