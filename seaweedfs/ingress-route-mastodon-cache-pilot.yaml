# Production media cache; legacy resource names are retained for an in-place GitOps update.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mastodon-media-cache-pilot
  namespace: seaweedfs
  labels:
    app.kubernetes.io/name: mastodon-media-cache
spec:
  inFlightReq:
    amount: 64
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mastodon-media-cache-pilot
  namespace: seaweedfs
  annotations:
    kubernetes.io/ingress.class: traefik
    argocd.argoproj.io/sync-wave: '1'
  labels:
    app.kubernetes.io/name: mastodon-media-cache
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`s3.andreybondarenko.com`) && PathPrefix(`/mastodon/`) && (Method(`GET`)
      || Method(`HEAD`))
    priority: 220
    middlewares:
    - name: mastodon-media-cache-pilot
    services:
    - name: mastodon-media-cache
      port: 8080
  tls:
    secretName: seaweedfs-tls
