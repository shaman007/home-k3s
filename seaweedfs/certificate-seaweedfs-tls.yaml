  name: seaweedfs-tls
  namespace: seaweedfs
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: seaweedfs-tls
  dnsNames:
    - s3.andreybondarenko.com
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-prod
