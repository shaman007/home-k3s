apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ollama
  labels:
    app: ollama
    app.kubernetes.io/name: ollama
    app.kubernetes.io/instance: ollama
    app.kubernetes.io/part-of: ollama
    app.kubernetes.io/managed-by: argoCD
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
        app.kubernetes.io/name: ollama
        app.kubernetes.io/part-of: ollama
    spec:
      priorityClassName: homelab-best-effort
      runtimeClassName: nvidia
      enableServiceLinks: false
      nodeSelector:
        nvidia.com/gpu.present: "true"
      initContainers:
        - name: prepare-ollama-data
          image: harbor.andreybondarenko.com/dockerhub/busybox:1.38
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
            readOnlyRootFilesystem: true
            runAsUser: 0
            runAsGroup: 0
            seccompProfile:
              type: RuntimeDefault
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /ollama/models
              chmod 1777 /tmp
              find /ollama -path /ollama/lost+found -prune -o -exec chown 65532:65532 {} +
          volumeMounts:
            - name: ollama-data
              mountPath: /ollama
            - name: tmp
              mountPath: /tmp
      containers:
        - name: ollama
          image: harbor.andreybondarenko.com/dockerhub/ollama/ollama:0.32.9
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: HOME
              value: /ollama
            - name: OLLAMA_MODELS
              value: /ollama/models
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
            - name: OLLAMA_KEEP_ALIVE
              value: 30s
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
            - name: TZ
              value: Europe/Prague
          ports:
            - name: http
              containerPort: 11434
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 6400Mi
            limits:
              memory: 12Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - name: ollama-data
              mountPath: /ollama
            - name: tmp
              mountPath: /tmp
        - name: model-puller
          image: harbor.andreybondarenko.com/dockerhub/ollama/ollama:0.32.9
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          command:
            - /bin/sh
            - -c
            - |
              until ollama list >/dev/null 2>&1; do
                sleep 2
              done
              if ollama show gpt-oss:20b >/dev/null 2>&1; then
                echo "Model gpt-oss:20b is already present on persistent storage"
              else
                ollama pull gpt-oss:20b
              fi
              sleep infinity
          env:
            - name: HOME
              value: /tmp
            - name: TMPDIR
              value: /tmp
            - name: OLLAMA_HOST
              value: http://127.0.0.1:11434
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: ollama-data
          persistentVolumeClaim:
            claimName: ollama-data-lh
        - name: tmp
          emptyDir: {}
