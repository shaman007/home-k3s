apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
  name: ollama-vault-acme-tls
  namespace: ollama
spec:
  dnsNames:
  - ollama.w386.k8s.my.lan
  duration: 720h
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: vault-acme
  renewBefore: 168h
  secretName: ollama-vault-acme-tls
