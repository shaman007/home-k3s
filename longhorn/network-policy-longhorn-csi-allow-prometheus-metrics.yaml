apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-csi-allow-prometheus-metrics
  namespace: longhorn-system
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - csi-attacher
      - csi-provisioner
      - csi-resizer
      - csi-snapshotter
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app: prometheus-server
    ports:
    - protocol: TCP
      port: 8000
