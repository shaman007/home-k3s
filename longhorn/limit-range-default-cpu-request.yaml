# Kept aligned with the centrally deployed namespaces/limit-ranges.yaml policy.
# This file is excluded by the longhorn-custom Application directory filter.
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-resource-requests
  namespace: longhorn-system
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 10m
        memory: 1Gi
      default:
        memory: 8Gi
