apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-pki-renewer
  namespace: longhorn-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["longhorn-tls"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-pki-renewer
  namespace: longhorn-system
subjects:
  - kind: ServiceAccount
    name: vault-pki-renewer
    namespace: vault
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vault-pki-renewer
