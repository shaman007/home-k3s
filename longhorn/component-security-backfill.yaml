apiVersion: batch/v1
kind: Job
metadata:
  generateName: component-security-backfill-
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 2700
  template:
    metadata:
      labels:
        app: component-security-backfill
    spec:
      serviceAccountName: component-security-backfill
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: backfill
        image: harbor.andreybondarenko.com/dockerhub/library/python:3.15-alpine
        command:
        - python3
        - /config/backfill.py
        env:
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: component-security-backfill
