---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: longhorn-letsencrypt-internal-tls
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  secretName: longhorn-letsencrypt-internal-tls
  renewBefore: 720h
  dnsNames:
  - longhorn.int.andreybondarenko.com
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-internal-prod
