---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unifi-poller
  namespace: unifi
  labels:
    app.kubernetes.io/name: unifi-poller
    app.kubernetes.io/instance: unifi-poller
    app.kubernetes.io/managed-by: argoCD
  annotations:
    configmap.reloader.stakater.com/reload: unifi-bgp-exporter
spec:
  selector:
    matchLabels:
      app: unifi-poller
  template:
    metadata:
      labels:
        app: unifi-poller
    spec:
      hostAliases:
        - ip: "192.168.1.1"
          hostnames: [unifi.int.andreybondarenko.com]
      priorityClassName: homelab-standard
      automountServiceAccountToken: false
      containers:
        - name: bgp-exporter
          image: harbor.andreybondarenko.com/dockerhub/library/python:3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
          command: [python3, -B, /scripts/exporter.py]
          env:
            - name: UNIFI_METRICS_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: UNIFI_URL
              value: https://unifi.int.andreybondarenko.com
            - name: UNIFI_USERNAME
              value: shaman007
            - name: UNIFI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: unifi-password
                  key: password
          ports:
            - name: bgp-metrics
              containerPort: 9131
          readinessProbe:
            httpGet:
              path: /healthz
              port: bgp-metrics
          livenessProbe:
            httpGet:
              path: /healthz
              port: bgp-metrics
          volumeMounts:
            - name: bgp-exporter
              mountPath: /scripts
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 64Mi
        - name: unifi-poller
          image: harbor.andreybondarenko.com/github/unpoller/unpoller:v5.9.5
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: UP_UNIFI_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: unifi-password
                  key: password
            - name: UP_UNIFI_DEFAULT_VERIFY_SSL
              value: "true"
            - name: UP_UNIFI_DEFAULT_URL
              value: https://unifi.int.andreybondarenko.com:443
            - name: UP_UNIFI_DEFAULT_USER
              value: shaman007
            - name: UP_UNIFI_DEFAULT_SAVE_DPI
              value: "true"
            - name: UP_INFLUXDB_DISABLE
              value: "true"
            - name: UP_LOKI_DISABLE
              value: "false"
            - name: UP_LOKI_URI
              value: "http://loki-gateway.loki.svc.cluster.local"
            - name: UP_LOKI_VERIFY_SSL
              value: "false"
          readinessProbe:
            tcpSocket:
              port: 9130
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 9130
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
          ports:
            - containerPort: 9130
      volumes:
        - name: bgp-exporter
          configMap:
            name: unifi-bgp-exporter
