apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: synapse-allow-egress-tempo
  namespace: matrix
spec:
  podSelector:
    matchLabels:
      app: matrix
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app: tempo
    ports:
    - protocol: UDP
      port: 6831
