---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: matrix
  name: matrix
  labels:
    app: matrix
    tier: backend
    app.kubernetes.io/name: synapse
    app.kubernetes.io/instance: matrix
    app.kubernetes.io/managed-by: argo-cd
    app.kubernetes.io/part-of: matrix
    app.kubernetes.io/component: synapse
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: matrix
      tier: backend
  template:
    metadata:
      labels:
        app: matrix
        tier: backend
    spec:
      priorityClassName: homelab-standard
      automountServiceAccountToken: false
      volumes:
        - name: matrix-lh
          persistentVolumeClaim:
            claimName: matrix-lh
        - name: synapse-config
          secret:
            secretName: config-synapse
            items:
              - key: config.yaml
                path: config.yaml
        - name: tmp
          emptyDir: {}
      containers:
        - name: synapse
          image: harbor.andreybondarenko.com/dockerhub/matrixdotorg/synapse:v1.158.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 991
            runAsGroup: 991
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 6167
              name: federation
            - containerPort: 8008
              name: metrics
          startupProbe:
            tcpSocket:
              port: federation
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: federation
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: federation
            periodSeconds: 30
            timeoutSeconds: 1
            failureThreshold: 3
          volumeMounts:
            - name: matrix-lh
              mountPath: /data
            - name: synapse-config
              mountPath: /data/config.yaml
              subPath: config.yaml
            - name: tmp
              mountPath: /tmp
          env:
            - name: SYNAPSE_CONFIG_PATH
              value: /data/config.yaml
          resources:
            requests:
              cpu: "10m"
              memory: "208Mi"
            limits:
              memory: "288Mi"
      initContainers:
        - name: fix-permissions
          image: harbor.andreybondarenko.com/dockerhub/busybox:1.38
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
            readOnlyRootFilesystem: true
            runAsUser: 0
            runAsGroup: 0
            seccompProfile:
              type: RuntimeDefault
          command:
            - sh
            - -ec
            - |
              chmod 1777 /tmp
              find /data -path /data/lost+found -prune -o -exec chown 991:991 {} +
          volumeMounts:
            - name: matrix-lh
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 32Mi
