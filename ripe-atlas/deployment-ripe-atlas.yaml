apiVersion: apps/v1
kind: Deployment
metadata:
  name: ripe-atlas
  namespace: ripe-atlas
  labels:
    app.kubernetes.io/name: ripe-atlas
    app.kubernetes.io/instance: ripe-atlas
    app.kubernetes.io/managed-by: argoCD
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ripe-atlas
      app.kubernetes.io/instance: ripe-atlas
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ripe-atlas
        app.kubernetes.io/instance: ripe-atlas
    spec:
      priorityClassName: homelab-standard
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-atlas-runtime
          image: harbor.andreybondarenko.com/library/ripe-atlas:2026-08-26-091220
          imagePullPolicy: Always
          command:
            - /usr/bin/mkdir
            - -p
            - /run/ripe-atlas/status
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: run
              mountPath: /run/ripe-atlas
      containers:
        - name: ripe-atlas
          image: harbor.andreybondarenko.com/library/ripe-atlas:2026-08-26-091220
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: true
          env:
            - name: PATH
              value: /usr/libexec/ripe-atlas/measurement:/usr/libexec/ripe-atlas:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: RXTXRPT
              value: "yes"
            - name: TELNETD_PORT
              value: "2023"
            - name: HTTP_POST_PORT
              value: "8080"
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/ripe-atlas
            - name: spool
              mountPath: /var/spool/ripe-atlas
            - name: spool
              mountPath: /home/atlas/data
              subPath: data
            - name: run
              mountPath: /run/ripe-atlas
            - name: run
              mountPath: /home/atlas/status
              subPath: status
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: ripe-atlas-config
        - name: spool
          persistentVolumeClaim:
            claimName: ripe-atlas-spool
        - name: run
          emptyDir:
            sizeLimit: 64Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
