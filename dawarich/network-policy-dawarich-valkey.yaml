---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dawarich-valkey
  namespace: dawarich
spec:
  podSelector:
    matchLabels:
      app: valkey-dawarich
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: dawarich
      ports:
        - protocol: TCP
          port: 6379
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app: prometheus-server
      ports:
        - protocol: TCP
          port: 9121
  # The exporter uses localhost; Valkey has no outbound dependencies.
  egress: []
