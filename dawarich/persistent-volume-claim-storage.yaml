apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: dawarich
  name: storage
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job.longhorn.io/trim-daily-a: enabled
    recurring-job.longhorn.io/backup-daily-retain31-b: enabled
    storage.k8s.io/name: longhorn
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
