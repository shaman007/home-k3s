name: Validate Kubernetes

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-inputs:
    runs-on: ubuntu-26.04
    outputs:
      audit-shards: ${{ steps.audit-cases.outputs.shards }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.x"

      - name: Install hostname inventory dependency
        env:
          RIPGREP_VERSION: "15.2.0"
          RIPGREP_SHA256: "33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c"
        run: |
          download_dir=$(mktemp -d)
          trap 'rm -rf "$download_dir"' EXIT
          archive="ripgrep-${RIPGREP_VERSION}-x86_64-unknown-linux-musl"
          curl --fail --show-error --location --proto '=https' --proto-redir '=https' \
            --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 \
            --output "$download_dir/ripgrep.tar.gz" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/${archive}.tar.gz"
          printf '%s  %s\n' "$RIPGREP_SHA256" "$download_dir/ripgrep.tar.gz" | sha256sum --check --strict
          tar -xzf "$download_dir/ripgrep.tar.gz" -C "$download_dir" --no-same-owner "$archive/rg"
          sudo install -m 0755 "$download_dir/$archive/rg" /usr/local/bin/rg
          rg --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema regex -r tools/security/requirements.txt

      - name: Install startup gate test runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ruby php-cli nodejs
          /usr/bin/ruby --version
          /usr/bin/php --version
          /usr/bin/node --version
          /usr/bin/php -l tools/bootstrap/probe_data.php
          /usr/bin/php -l tools/bootstrap/nextcloud_job_ready.php
          /usr/bin/node --check tools/bootstrap/probe_http.cjs
          /usr/bin/node --check tools/bootstrap/karakeep_worker_gate.cjs
          /bin/sh -n tools/bootstrap/wait_service.sh
          /bin/sh -n tools/bootstrap/wait_mysql.sh
          /bin/sh -n tools/bootstrap/mail_valkey_gate.sh
          /bin/sh -n tools/bootstrap/mail_training_gate.sh
          /bin/sh -n tools/bootstrap/nextcloud_job_gate.sh

      - name: Validate Ruby syntax
        shell: bash
        run: |
          while IFS= read -r -d '' source; do
            /usr/bin/ruby -c "$source"
          done < <(git ls-files --cached --others --exclude-standard -z -- '*.rb')

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.7.0
        run: |
          curl -fsSL -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3  kubeconform.tar.gz" | sha256sum --check --strict
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform
          rm -f kubeconform.tar.gz

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.2

      - name: Set up kubectl for Kustomize
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5
        with:
          version: v1.37.2

      - name: Install pinned Kyverno CLI
        uses: ./.github/actions/setup-kyverno

      - name: Validate runtime contracts
        run: |
          python tools/ci/validate_runtime_contracts.py

      - name: Run repository unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest discover -s tests -v

      - name: Check generated NetworkPolicy bundles
        run: |
          python tools/networkpolicy/generate_common_networkpolicies.py --check tools/networkpolicy/common-policies
          python tools/monitoring/generate_queue_exporters.py --check
          python tools/bootstrap/prepare_custom_crons.py
          sh -n tools/bootstrap/bookmarked_job_gate.sh
          sh -n tools/bootstrap/mastodon_spam_job_gate.sh
          node --check tools/bootstrap/bookmarked_upload_probe.cjs
          python tools/bootstrap/prepare_startup_gate.py --check
          python tools/bootstrap/prepare_application_gates.py --check

      - name: Validate inactive CronJob dependency candidate
        run: |
          python tools/bootstrap/prepare_cron_gate.py --job all > "${RUNNER_TEMP}/logs-check-dependency-candidate.yaml"
          kubeconform -strict -summary -kubernetes-version 1.37.1 "${RUNNER_TEMP}/logs-check-dependency-candidate.yaml"
          python tools/bootstrap/prepare_dependency_batch.py --output "${RUNNER_TEMP}/dependency-candidates"
          # CRD proposals retain source schemas; their semantic contracts have unit tests.
          # Exact ESO reconciliation remains a separately authorized runtime acceptance gate.
          kubeconform -strict -summary -kubernetes-version 1.37.1 -skip Application,ExternalSecret -ignore-filename-pattern 'index[.]json$' "${RUNNER_TEMP}/dependency-candidates"

      - name: Render Argo CD applications
        run: |
          python tools/ci/render_applications.py --output "${RUNNER_TEMP}/rendered-applications"

      - name: Validate native Mastodon manifests
        run: |
          python tools/bootstrap/prepare_mastodon_native.py --check
          python tools/bootstrap/prepare_mastodon_native.py --output "${RUNNER_TEMP}/native-mastodon"
          python tools/ci/check_container_resources.py --rendered "${RUNNER_TEMP}/native-mastodon"
          python tools/ci/check_restricted_contexts.py --rendered "${RUNNER_TEMP}/native-mastodon"
          kubeconform -strict -summary -kubernetes-version 1.37.1 "${RUNNER_TEMP}/native-mastodon/mastodon.yaml"

      - name: Prepare generated Kyverno exceptions and real CEL cases
        id: audit-cases
        run: |
          python tools/kyverno/generate_exceptions.py --check
          python tools/kyverno/test_audit_policies.py --rendered "${RUNNER_TEMP}/rendered-applications" --output "${RUNNER_TEMP}/kyverno-audit-cases"
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          counts = json.loads((Path(os.environ['RUNNER_TEMP']) / 'kyverno-audit-cases/counts.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('shards=' + json.dumps(sorted(counts)) + '\n')
          PYTHON

      # Only sanitized test fixtures are shared; rendered charts can contain Secrets.
      - name: Share policy-sharded CEL cases
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kyverno-audit-cases
          path: ${{ runner.temp }}/kyverno-audit-cases
          if-no-files-found: error
          retention-days: 1

      - name: Check Longhorn manager admission and audit
        run: |
          python tools/longhorn/test_manager_admission_audit.py --rendered "${RUNNER_TEMP}/rendered-applications"

      - name: Check Longhorn recurring-job CEL mutation and scope
        run: |
          python tools/longhorn/test_recurring_security_policy.py

      - name: Check Longhorn component CEL mutation and scope
        run: |
          python tools/longhorn/generate_component_security.py --check
          python tools/longhorn/test_component_security_policy.py

      - name: Check infrastructure guard CEL mutation and scope
        run: |
          python tools/security/generate_infra_guards.py --check
          python tools/security/test_infra_guard_policy.py

      - name: Check CrowdSec rootless mount contracts
        run: |
          python tools/ci/check_crowdsec_rootless.py --rendered "${RUNNER_TEMP}/rendered-applications"

      - name: Check container memory budgets and absence of CPU limits
        run: |
          python tools/ci/check_container_resources.py --rendered "${RUNNER_TEMP}/rendered-applications"

      - name: Check Restricted namespace pod security contexts
        run: |
          python tools/ci/check_restricted_contexts.py --rendered "${RUNNER_TEMP}/rendered-applications"

      - name: Validate rendered and tracked manifests
        run: |
          python tools/ci/validate_rendered.py --rendered "${RUNNER_TEMP}/rendered-applications"

  audit-cel:
    name: Audit CEL (${{ matrix.shard }})
    needs: validate-inputs
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.validate-inputs.outputs.audit-shards) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Kyverno CLI
        uses: ./.github/actions/setup-kyverno

      - name: Download sanitized CEL cases
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kyverno-audit-cases
          path: ${{ runner.temp }}/kyverno-audit-cases

      - name: Run real CEL policy assertions
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          time kyverno test "${RUNNER_TEMP}/kyverno-audit-cases/${SHARD}" --fail-only --remove-color --require-tests

  # Preserve the existing required check: it must include every CEL matrix job.
  validate-manifests:
    if: always()
    needs: [validate-inputs, audit-cel]
    runs-on: ubuntu-26.04
    steps:
      - name: Require every validation job to succeed
        env:
          INPUT_RESULT: ${{ needs.validate-inputs.result }}
          AUDIT_RESULT: ${{ needs.audit-cel.result }}
        run: |
          test "$INPUT_RESULT" = success
          test "$AUDIT_RESULT" = success
