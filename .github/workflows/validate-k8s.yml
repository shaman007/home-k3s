name: Validate Kubernetes

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-manifests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml jsonschema regex

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.7.0
        run: |
          curl -fsSL -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3  kubeconform.tar.gz" | sha256sum --check --strict
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform
          rm -f kubeconform.tar.gz

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - name: Set up kubectl for Kustomize
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5
        with:
          version: v1.37.2

      - name: Install pinned Kyverno CLI
        env:
          KYVERNO_CLI_VERSION: v1.19.2
        run: |
          install_dir="$(mktemp -d)"
          trap 'rm -rf "$install_dir"' EXIT
          curl -fsSL -o kyverno-cli.tar.gz \
            "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_CLI_VERSION}/kyverno-cli_${KYVERNO_CLI_VERSION}_linux_x86_64.tar.gz"
          echo "357eaf1df8bc24ddd5a73979fadeaae6a032e8710f11af264229756e4956bf4a  kyverno-cli.tar.gz" | sha256sum --check --strict
          tar -xzf kyverno-cli.tar.gz -C "$install_dir" kyverno
          sudo mv "$install_dir/kyverno" /usr/local/bin/kyverno
          rm -f kyverno-cli.tar.gz

      - name: Validate runtime contracts
        run: |
          python tools/ci/validate-runtime-contracts.py

      - name: Run repository unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest discover -s tests -v

      - name: Check generated NetworkPolicy bundles
        run: |
          python tools/networkpolicy/generate_common_networkpolicies.py --check tools/networkpolicy/common-policies

      - name: Render Argo CD applications
        run: |
          python tools/ci/render-applications.py --output "${RUNNER_TEMP}/rendered-applications"

      - name: Check generated Kyverno exceptions and real CEL cases
        run: |
          python tools/kyverno/generate-exceptions.py --check
          python tools/longhorn/test-manager-admission-audit.py --rendered "${RUNNER_TEMP}/rendered-applications"
          python tools/kyverno/test-audit-policies.py --rendered "${RUNNER_TEMP}/rendered-applications"
          python tools/longhorn/test-recurring-security-policy.py
          python tools/longhorn/generate-component-security.py --check
          python tools/longhorn/test-component-security-policy.py
          python tools/security/generate-infra-guards.py --check
          python tools/security/test-infra-guard-policy.py

      - name: Check CrowdSec rootless mount contracts
        run: |
          python tools/ci/check-crowdsec-rootless.py --rendered "${RUNNER_TEMP}/rendered-applications"

      - name: Check container memory budgets and absence of CPU limits
        run: |
          python tools/ci/check-container-resources.py --rendered "${RUNNER_TEMP}/rendered-applications"

      - name: Check Restricted namespace pod security contexts
        run: |
          python tools/ci/check-restricted-contexts.py --rendered "${RUNNER_TEMP}/rendered-applications"

      - name: Validate rendered and tracked manifests
        run: |
          python tools/ci/validate-rendered.py --rendered "${RUNNER_TEMP}/rendered-applications"
