# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow checks out code, performs a Codacy security scan
# and integrates the results with the
# GitHub Advanced Security code scanning feature.  For more information on
# the Codacy security scan action usage and parameters, see
# https://github.com/codacy/codacy-analysis-cli-action.
# For more information on Codacy Analysis CLI in general, see
# https://github.com/codacy/codacy-analysis-cli.

name: Codacy Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '41 10 * * 1'
  workflow_dispatch:
    inputs:
      legacy_tool:
        description: Historical linter to rescan; none runs normal security and Python lint scans
        type: choice
        default: none
        options:
          - none
          - pylintpython3
          - prospector
          - remark-lint
          - psscriptanalyzer

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Codacy Security Scan (${{ matrix.tool }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Run supported source scanners explicitly, rather than the entire catalog.
        # Map choices to fixed arrays; never interpolate an input into a shell command.
        tool: >-
          ${{ fromJSON(
            inputs.legacy_tool == 'pylintpython3' && '["pylintpython3"]' ||
            inputs.legacy_tool == 'prospector' && '["prospector"]' ||
            inputs.legacy_tool == 'remark-lint' && '["remark-lint"]' ||
            inputs.legacy_tool == 'psscriptanalyzer' && '["psscriptanalyzer"]' ||
            '["bandit","opengrep","shellcheck","pylintpython3"]'
          ) }}
    env:
      SARIF_FILE: results-${{ matrix.tool }}.sarif
      PREPARED_SARIF_FILE: prepared-${{ matrix.tool }}.sarif
    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Execute Codacy Analysis CLI and generate a SARIF output with the security issues identified during the analysis
      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08 # v4.4.7
        with:
          # Use default rules consistently on pushes and fork pull requests.
          # See docs/codacy-security-scan.md for scanner scope and limitations.
          tool: ${{ matrix.tool }}
          # Tool failures must not appear as a successful scan with empty SARIF.
          fail-if-incomplete: true
          output: ${{ env.SARIF_FILE }}
          format: sarif
          # Adjust severity of non-security issues
          gh-code-scanning-compat: true
          # Findings are uploaded for GitHub code scanning; execution failures
          # still fail the job through fail-if-incomplete.
          max-allowed-issues: 2147483647

      - name: Prepare SARIF for GitHub code scanning
        env:
          LEGACY_SCAN: ${{ !contains(fromJSON('["bandit","opengrep","shellcheck"]'), matrix.tool) }}
        run: |
          options=()
          if [[ "$LEGACY_SCAN" == true ]]; then
            options+=(--reject-parser-errors)
          fi
          python3 tools/ci/prepare-codacy-sarif.py "$SARIF_FILE" "$PREPARED_SARIF_FILE" "${options[@]}"

      # Upload the SARIF file generated in the previous step
      - name: Upload SARIF results file
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: ${{ env.PREPARED_SARIF_FILE }}
          # Legacy reports must supersede their original category, not add duplicates.
          category: >-
            ${{ contains(fromJSON('["bandit","opengrep","shellcheck"]'), matrix.tool)
              && format('codacy-{0}', matrix.tool)
              || '.github/workflows/codacy.yml:codacy-security-scan' }}
