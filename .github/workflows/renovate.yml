name: Renovate

on:
  workflow_dispatch:
    inputs:
      migrate_legacy_prs:
        description: Recreate the five legacy Renovate PR branches with App-signed commits
        type: boolean
        default: false
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Check GitHub App configuration
        env:
          APP_ID: ${{ vars.RENOVATE_CLIENT_ID || vars.RENOVATE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::error::Configure RENOVATE_CLIENT_ID (or RENOVATE_APP_ID) and RENOVATE_APP_PRIVATE_KEY as described in docs/renovate.md."
            exit 1
          fi
      - name: Create Renovate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_CLIENT_ID || vars.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          # With no owner/repositories override, scope the token to this repository.
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Run Renovate
        uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          # File-update failures only include their underlying cause at debug level.
          LOG_LEVEL: debug
          # Immich's release tags are beyond GHCR's first 20 pages.
          RENOVATE_DOCKER_MAX_PAGES: "100"
          RENOVATE_PLATFORM_COMMIT: "enabled"
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # One-off migration from the old PAT account; disabled for scheduled runs.
          RENOVATE_IGNORE_PR_AUTHOR: ${{ inputs.migrate_legacy_prs && 'true' || 'false' }}
          RENOVATE_CHECKED_BRANCHES: ${{ inputs.migrate_legacy_prs && 'renovate/renovatebot-github-action-46.x,renovate/harbor.andreybondarenko.com-library-sync-2026.x,renovate/harbor.andreybondarenko.com-library-ripe-atlas-2026.x,renovate/harbor.andreybondarenko.com-library-php-2026.x,renovate/harbor.andreybondarenko.com-library-ooniprobe-2026.x' || '' }}
