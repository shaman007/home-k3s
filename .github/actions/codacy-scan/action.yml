name: Codacy scan attempt
description: Run one bounded UTF-8 Codacy invocation without accepting incomplete results
inputs:
  tool:
    description: Fixed scanner selected by the workflow matrix
    required: true
  output:
    description: Scanner SARIF basename in the checkout
    required: true
runs:
  using: composite
  steps:
    - name: Run Codacy scanner with UTF-8 JVM encoding
      shell: bash
      env:
        CODACY_TOOL: ${{ inputs.tool }}
        CODACY_OUTPUT: ${{ inputs.output }}
      run: bash "$GITHUB_ACTION_PATH/run.sh"
