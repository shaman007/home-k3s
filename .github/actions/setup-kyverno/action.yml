name: Set up pinned Kyverno CLI
description: Install the checksum-verified Kyverno CLI used by real CEL tests
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        pin="$(python3 "$GITHUB_WORKSPACE/tools/ci/tool_pins.py" kyverno)"
        read -r KYVERNO_CLI_VERSION KYVERNO_CLI_SHA256 <<< "$pin"
        install_dir="$(mktemp -d)"
        trap 'rm -rf "$install_dir"' EXIT
        curl -fsSL --retry 4 --retry-all-errors --retry-delay 3 \
          --connect-timeout 15 --max-time 120 -o "$install_dir/kyverno-cli.tar.gz" \
          "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_CLI_VERSION}/kyverno-cli_${KYVERNO_CLI_VERSION}_linux_x86_64.tar.gz"
        echo "$KYVERNO_CLI_SHA256  $install_dir/kyverno-cli.tar.gz" | sha256sum --check --strict
        tar -xzf "$install_dir/kyverno-cli.tar.gz" -C "$install_dir" kyverno
        sudo mv "$install_dir/kyverno" /usr/local/bin/kyverno
