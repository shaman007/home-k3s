---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: spotify
  labels:
    app: server
    tier: backend
    app.kubernetes.io/name: your-spotify
    app.kubernetes.io/instance: your-spotify
    app.kubernetes.io/version: "1.19.0"
    app.kubernetes.io/managed-by: argoCD
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server
      tier: backend
  template:
    metadata:
      annotations:
        checksum/application-startup-gate: 03554aa36669116e354d55a28174e6103f782628e8b1dfdefb99de5fabd4207d
      labels:
        app: server
        tier: backend
    spec:
      initContainers:
        - name: wait-for-ferretdb
          image: harbor.andreybondarenko.com/dockerhub/yooooomi/your_spotify_server:1.20.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - /startup-gate/wait_service.sh
            - ferretdb
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          env: []
          volumeMounts:
            - name: startup-gate
              mountPath: /startup-gate
              readOnly: true
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      priorityClassName: homelab-standard
      containers:
        - env:
            - name: PROMETHEUS_USERNAME
              value: prometheus
            - name: PROMETHEUS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spotify
                  key: PROMETHEUS_PASSWORD
            - name: API_ENDPOINT
              value: https://spt-server.andreybondarenko.com
            - name: CLIENT_ENDPOINT
              value: https://spt.andreybondarenko.com
            - name: SPOTIFY_PUBLIC
              valueFrom:
                secretKeyRef:
                  name: spotify
                  key: SPOTIFY_PUBLIC
            - name: SPOTIFY_SECRET
              valueFrom:
                secretKeyRef:
                  name: spotify
                  key: SPOTIFY_SECRET
            - name: MONGO_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: ferretdb-credentials
                  key: mongodb-url
            - name: CORS
              value: "https://spt.andreybondarenko.com, https://spt-server.andreybondarenko.com"
          image: harbor.andreybondarenko.com/dockerhub/yooooomi/your_spotify_server:1.20.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "20m"
              memory: "96Mi"
            limits:
              memory: "144Mi"
          name: server
          ports:
            - containerPort: 8080
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 1
            failureThreshold: 3
          volumeMounts:
            - name: home
              mountPath: /home/node
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: startup-gate
          configMap:
            name: spotify-startup-gate
