---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: spotify-tls
  namespace: spotify
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: spotify-tls
  dnsNames:
    - spt.andreybondarenko.com
    - spt-server.andreybondarenko.com
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-prod
