---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-mongodb-to-ferretdb
  namespace: spotify
  annotations:
    # Run manually during the documented maintenance window.
    argocd.argoproj.io/hook: Skip
  labels:
    app: migrate-mongodb-to-ferretdb
    app.kubernetes.io/name: migrate-mongodb-to-ferretdb
    app.kubernetes.io/instance: your-spotify
    app.kubernetes.io/managed-by: argoCD
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: migrate-mongodb-to-ferretdb
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: migrate
          image: harbor.andreybondarenko.com/dockerhub/mongo:7
          imagePullPolicy: IfNotPresent
          env:
            - name: TARGET_URI
              valueFrom:
                secretKeyRef:
                  name: ferretdb-credentials
                  key: mongodb-url
          command:
            - sh
            - -c
          args:
            - |
              set -eu

              source_uri="mongodb://mongodb.spotify.svc.cluster.local:27017/your_spotify"
              dump_dir="/tmp/dump"

              echo "Checking source and target..."
              mongosh --quiet "$source_uri" --eval 'quit(db.adminCommand({ping: 1}).ok ? 0 : 1)'
              mongosh --quiet "$TARGET_URI" --eval 'quit(db.adminCommand({ping: 1}).ok ? 0 : 1)'

              echo "Dumping your_spotify from MongoDB..."
              mongodump --uri="$source_uri" --out="$dump_dir"

              echo "Restoring into FerretDB..."
              mongorestore --uri="$TARGET_URI" --drop "$dump_dir/your_spotify"

              echo "Comparing collection document counts..."
              source_counts="$(mongosh --quiet "$source_uri" --eval \
                'db.getCollectionNames().sort().forEach(n => print(n + "=" + db[n].countDocuments({})))')"
              target_counts="$(mongosh --quiet "$TARGET_URI" --eval \
                'db.getCollectionNames().sort().forEach(n => print(n + "=" + db[n].countDocuments({})))')"
              printf '%s\n' "$source_counts"
              test "$source_counts" = "$target_counts"

              echo "Migration and count validation completed."
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
