---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ferretdb
  namespace: spotify
  labels:
    app: ferretdb
    app.kubernetes.io/name: ferretdb
    app.kubernetes.io/instance: your-spotify
    app.kubernetes.io/version: "2.7.0"
    app.kubernetes.io/managed-by: argoCD
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ferretdb
  template:
    metadata:
      annotations:
        checksum/application-startup-gate: 03554aa36669116e354d55a28174e6103f782628e8b1dfdefb99de5fabd4207d
      labels:
        app: ferretdb
    spec:
      initContainers:
        - name: wait-for-postgres
          image: harbor.andreybondarenko.com/github/ferretdb/postgres-documentdb:17-0.107.0-ferretdb-2.7.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - /startup-gate/wait_service.sh
            - postgres
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: ferretdb-credentials
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: ferretdb-credentials
                  key: password
            - name: PGDATABASE
              value: postgres
            - name: PGHOST
              value: ferretdb-postgres.spotify.svc.cluster.local
          volumeMounts:
            - name: startup-gate
              mountPath: /startup-gate
              readOnly: true
      priorityClassName: homelab-standard
      automountServiceAccountToken: false
      containers:
        - name: ferretdb
          image: harbor.andreybondarenko.com/github/ferretdb/ferretdb:2.7.0
          imagePullPolicy: IfNotPresent
          env:
            - name: FERRETDB_POSTGRESQL_URL
              valueFrom:
                secretKeyRef:
                  name: ferretdb-credentials
                  key: postgresql-url
            - name: FERRETDB_TELEMETRY
              value: disable
          ports:
            - name: mongodb
              containerPort: 27017
            - name: debug
              containerPort: 8088
          startupProbe:
            tcpSocket:
              port: mongodb
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /debug/readyz
              port: debug
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: mongodb
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: state
              mountPath: /state
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: startup-gate
          configMap:
            name: spotify-startup-gate
