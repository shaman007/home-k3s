---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: spotify
  labels:
    name: mongodb
    app: ferretdb
    app.kubernetes.io/name: ferretdb
    app.kubernetes.io/instance: your-spotify
    app.kubernetes.io/version: "2.7.0"
    app.kubernetes.io/managed-by: argoCD
spec:
  ports:
    - name: mongodb
      port: 27017
      protocol: TCP
  selector:
    app: ferretdb
