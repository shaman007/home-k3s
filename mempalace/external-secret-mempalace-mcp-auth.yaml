apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mempalace-mcp-auth
  namespace: mempalace
  labels:
    app.kubernetes.io/name: mempalace
    app.kubernetes.io/instance: mempalace
    app.kubernetes.io/part-of: mempalace
    app.kubernetes.io/managed-by: argo-cd
spec:
  refreshInterval: "15m"
  secretStoreRef:
    name: vault-secret-store
    kind: SecretStore
  target:
    name: mempalace-mcp-auth
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: mempalace
        property: mcp_http_token
