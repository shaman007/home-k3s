apiVersion: apps/v1
kind: Deployment
metadata:
  name: mempalace
  namespace: mempalace
  labels:
    app: mempalace
    app.kubernetes.io/name: mempalace
    app.kubernetes.io/instance: mempalace
    app.kubernetes.io/managed-by: argoCD
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mempalace
  template:
    metadata:
      labels:
        app: mempalace
    spec:
      automountServiceAccountToken: false
      priorityClassName: homelab-standard
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: mempalace
          image: harbor.andreybondarenko.com/github/mempalace/mempalace:3.9.0
          imagePullPolicy: IfNotPresent
          args:
            - mcp
            - --palace
            - /data/.mempalace
            - --transport
            - http
            - --host
            - 0.0.0.0
            - --port
            - "8765"
          env:
            - name: MEMPALACE_MCP_HTTP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mempalace-mcp-auth
                  key: token
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 25m
              memory: 2560Mi
            limits:
              memory: 3328Mi
          ports:
            - name: http
              containerPort: 8765
          volumeMounts:
            - name: mempalace-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
      volumes:
        - name: mempalace-data
          persistentVolumeClaim:
            claimName: mempalace-data
