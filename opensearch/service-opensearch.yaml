apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: opensearch
  labels:
    app: opensearch
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/instance: opensearch
spec:
  ports:
    - name: http
      port: 9200
      targetPort: http
      protocol: TCP
  selector:
    app: opensearch
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch-headless
  namespace: opensearch
  labels:
    app: opensearch
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/instance: opensearch
spec:
  clusterIP: None
  ports:
    - name: transport
      port: 9300
      targetPort: transport
      protocol: TCP
  selector:
    app: opensearch
