apiVersion: apps/v1
kind: Deployment
metadata:
  name: hypermind
  namespace: hypermind
  annotations:
    configmap.reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: hypermind
    app.kubernetes.io/instance: hypermind
    app.kubernetes.io/version: "1.6.1"
    app.kubernetes.io/managed-by: argoCD
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hypermind
  template:
    metadata:
      labels:
        app: hypermind
        app.kubernetes.io/name: hypermind
        app.kubernetes.io/instance: hypermind
        app.kubernetes.io/version: "1.6.1"
    spec:
      automountServiceAccountToken: false
      priorityClassName: homelab-best-effort
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hypermind
          image: harbor.andreybondarenko.com/github/lklynet/hypermind-swarm:1.6.1@sha256:1c63e7f2b6425be6bceb747d5fd8e4f5894e0fda409f2de9073ffd518a80517f
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: DEVICE_PERSISTENCE
              value: "false"
            - name: MEGA_NODE
              value: "true"
            - name: STORAGE_PATH
              value: /app/storage
            - name: HOME
              value: /tmp
            - name: TMPDIR
              value: /tmp
          volumeMounts:
            - name: storage
              mountPath: /app/storage
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
        - name: access-proxy
          image: harbor.andreybondarenko.com/dockerhub/nginx:1.31.6
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ceu
            - |
              mkdir -p /app/storage/http-logs
              exec nginx -c /etc/nginx/nginx.conf -g 'daemon off;'
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: proxy-http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: storage
              mountPath: /app/storage
            - name: access-proxy-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: proxy-http
          livenessProbe:
            httpGet:
              path: /health
              port: proxy-http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: access-proxy-config
          configMap:
            name: hypermind-access-proxy
        - name: storage
          persistentVolumeClaim:
            claimName: hypermind-storage
        - name: tmp
          emptyDir: {}
