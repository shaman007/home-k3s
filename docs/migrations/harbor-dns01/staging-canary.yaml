---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-harbor-dns01-staging
spec:
  acme:
    email: me@andreybondarenko.com
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-harbor-dns01-staging-account-key
    solvers:
      - selector:
          dnsNames: [harbor.andreybondarenko.com]
        dns01:
          cnameStrategy: Follow
          webhook:
            groupName: acme.int.andreybondarenko.com
            solverName: godaddy-v3
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: harbor-dns01-staging-canary
  namespace: harbor
spec:
  secretName: harbor-dns01-staging-canary
  dnsNames: [harbor.andreybondarenko.com]
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-harbor-dns01-staging
