apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: syncserver-mariadb
  namespace: firefox-sync
spec:
  podSelector:
    matchLabels:
      app: firefox-sync
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: mariadb
    ports:
    - protocol: TCP
      port: 3306
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mariadb
  namespace: firefox-sync
spec:
  podSelector:
    matchLabels:
      app: mariadb
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: firefox-sync
    ports:
    - protocol: TCP
      port: 3306
