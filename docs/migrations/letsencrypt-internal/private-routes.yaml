---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-ingress-letsencrypt
  namespace: argocd
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
    traefik.ingress.kubernetes.io/router.middlewares: traefik-internal-clients-only@kubernetescrd
spec:
  ingressClassName: traefik-private
  tls:
  - hosts:
    - argocd.int.andreybondarenko.com
    secretName: argocd-letsencrypt-internal-tls
  rules:
  - host: argocd.int.andreybondarenko.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: argocd-server
            port:
              number: 80
---
