---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-server-letsencrypt-tls
  namespace: openbao
spec:
  secretName: openbao-server-letsencrypt-tls
  dnsNames:
  - openbao-api.int.andreybondarenko.com
  renewBefore: 720h
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-internal-prod
---
apiVersion: v1
kind: Service
metadata:
  name: openbao-public-tls
  namespace: openbao
spec:
  selector:
    app.kubernetes.io/instance: openbao
    app.kubernetes.io/name: openbao
    component: server
    openbao-active: 'true'
  ports:
  - name: https
    port: 8200
    targetPort: 8202
    protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbao-public-tls-allow-ingress
  namespace: openbao
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: openbao
      app.kubernetes.io/name: openbao
      component: server
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: external-secrets
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
    ports:
    - protocol: TCP
      port: 8202
