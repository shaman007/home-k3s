router bgp 65030
 bgp router-id 192.168.30.1
 neighbor K8S-TRIAL peer-group
 neighbor K8S-TRIAL remote-as 65040
 neighbor K8S-TRIAL timers 3 9
 neighbor 192.168.30.100 peer-group K8S-TRIAL
 neighbor 192.168.30.209 peer-group K8S-TRIAL
 neighbor 192.168.30.242 peer-group K8S-TRIAL
 address-family ipv4 unicast
  neighbor K8S-TRIAL activate
  neighbor K8S-TRIAL route-map K8S-TRIAL-IN in
  neighbor K8S-TRIAL route-map K8S-TRIAL-OUT out
  neighbor K8S-TRIAL maximum-prefix 4
  maximum-paths 3
 exit-address-family
exit
ip prefix-list K8S-TRIAL-ONLY seq 20 permit 192.168.30.210/32
ip prefix-list K8S-TRIAL-ONLY seq 30 permit 192.168.30.211/32
ip prefix-list K8S-TRIAL-ONLY seq 35 permit 192.168.30.212/32
ip prefix-list K8S-TRIAL-ONLY seq 40 permit 192.168.30.213/32
route-map K8S-TRIAL-IN permit 10
 match ip address prefix-list K8S-TRIAL-ONLY
exit
route-map K8S-TRIAL-IN deny 100
exit
route-map K8S-TRIAL-OUT deny 10
exit
