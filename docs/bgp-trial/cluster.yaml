# Manual trial only: outside all Argo application source paths.
apiVersion: v1
kind: Namespace
metadata:
  name: bgp-trial
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: bgp-trial
  namespace: metallb-system
spec:
  addresses:
    - 192.168.40.240/32
  autoAssign: false
  serviceAllocation:
    namespaces:
      - bgp-trial
    serviceSelectors:
      - matchLabels:
          app: bgp-trial
---
apiVersion: metallb.io/v1beta2
kind: BGPPeer
metadata:
  name: udm-bgp-trial
  namespace: metallb-system
spec:
  myASN: 65040
  peerASN: 65030
  peerAddress: 192.168.30.1
  holdTime: 9s
  # Native MetalLB derives keepalive from holdTime; explicit keepalive is rejected.
  nodeSelectors:
    - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
            - talos-qlw-pbh
            - talos-d4h-k5m
            - w386
---
apiVersion: metallb.io/v1beta1
kind: BGPAdvertisement
metadata:
  name: bgp-trial
  namespace: metallb-system
spec:
  ipAddressPools:
    - bgp-trial
  peers:
    - udm-bgp-trial
  aggregationLength: 32
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: bgp-trial
  namespace: bgp-trial
spec:
  selector:
    matchLabels:
      app: bgp-trial
  template:
    metadata:
      labels:
        app: bgp-trial
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: http
          image: harbor.andreybondarenko.com/dockerhub/library/python:3.15-alpine@sha256:1afb480ba8d3b3b7a8439a84f2365ce5c75ac45a79cf07daa091b49235cbe27b
          command:
            - python3
            - -u
            - -c
            - |
              import http.server, json, os
              class Handler(http.server.BaseHTTPRequestHandler):
                  def do_GET(self):
                      body = (json.dumps({"node": os.environ["NODE_NAME"],
                                          "pod": os.environ["HOSTNAME"]}) + "\n").encode()
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
              http.server.ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 5m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: bgp-trial
  namespace: bgp-trial
  labels:
    app: bgp-trial
  annotations:
    metallb.io/address-pool: bgp-trial
    metallb.io/loadBalancerIPs: 192.168.40.240
spec:
  type: LoadBalancer
  # This controller-wide class name does not select the advertisement protocol.
  loadBalancerClass: metallb-l2
  allocateLoadBalancerNodePorts: false
  externalTrafficPolicy: Local
  ipFamilyPolicy: SingleStack
  ipFamilies:
    - IPv4
  loadBalancerSourceRanges:
    - 192.168.1.112/32
  selector:
    app: bgp-trial
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bgp-trial
  namespace: bgp-trial
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - ipBlock:
            cidr: 192.168.1.112/32
      ports:
        - protocol: TCP
          port: 8080
  egress: []
