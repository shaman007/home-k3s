  firefox-sync-secrets:
    phase: 3
    ready: Only required existing app/DB Secret keys present; ESO/OpenBao needed when missing.
    sources:
    - firefox-sync
  firefox-sync-db:
    phase: 3
    ready: Authenticated read-only SELECT 1 succeeds against BOTH syncstorage and tokenserver as app user.
    sources:
    - firefox-sync/deployment-mariadb.yaml
  firefox-sync:
    phase: 4
    ready: SQL gates finish before original entrypoint; existing app owns migrations; functional login/sync requires separate user-authorized verification after rollout.
    sources:
    - firefox-sync/deployment-firefox-sync.yaml
    - tools/bootstrap/prepare_application_gates.py
  mastodon-native-dependencies:
    phase: 4
    ready: Read-only app SQL SELECT 1 and authenticated Valkey PING; init retry budgets apply. Active after controlled
