    sources:
    - mastodon/native/deployment-mastodon-streaming.yaml
  mail-dovecot:
    phase: 2
    ready: Local passwd-file/static userdb, mail PVC and existing TLS Secret; IMAP/LMTP/SASL. No Valkey dependency.
