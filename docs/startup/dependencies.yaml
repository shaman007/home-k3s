    sources:
    - thanos/stateful-set-thanos-receive.yaml
    - thanos/external-secret-thanos-receive-objstore-internal.yaml
  thanos-store:
    phase: 4
    ready: Own ESO S3 config, internal S3 access, readiness and historical StoreAPI queries.
    sources:
    - docs/startup/observability/EXECUTION.md
  thanos-compactor:
    phase: 4
    ready: Own ESO S3 config and direct S3 operations; no requirement for Query/Grafana.
    sources:
    - docs/startup/observability/EXECUTION.md
  thanos-query:
    phase: 5
    ready: Query HTTP API works; available StoreAPI backends determine data coverage; missing backends are partial
      availability, not a hard startup barrier.
    sources:
    - docs/startup/observability/README.md
  grafana:
    phase: 5
    ready: Local SQLite health; login and datasource queries checked separately. No startup wait for Loki/Thanos/Keycloak.
    sources:
    - docs/startup/observability/README.md
edges:
- from: kubernetes
  to: cilium
  kind: startup
  when: always
- from: upstream-images
  to: cilium
  kind: image
  when: image_cache_miss
- from: kubernetes
  to: coredns
  kind: startup
  when: always
- from: upstream-images
  to: coredns
  kind: image
  when: image_cache_miss
- from: kubernetes
  to: longhorn
  kind: startup
  when: always
- from: upstream-images
  to: longhorn
  kind: image
  when: image_cache_miss
- from: kubernetes
  to: metallb
  kind: startup
  when: always
- from: upstream-images
  to: metallb
  kind: image
  when: image_cache_miss
- from: kubernetes
  to: cert-manager
  kind: startup
  when: always
- from: upstream-images
