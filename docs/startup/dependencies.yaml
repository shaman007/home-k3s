format_version: 1
observed_date: '2026-11-14'
scope: Core bootstrap plus Dawarich, Immich, Mastodon (native active), Nextcloud, Keycloak, WordPress and YourSpotify,
  Bitwarden and Firefox Sync (deployed gates); mail, custom CronJobs, Karakeep and internal-S3 observability deployed
direction: provider -> consumer; phase is descriptive, not installed orchestration
planned_transitions:
  godaddy_webhook_ghcr:
    status: local preparation only; manual publishing workflow and inactive image/signature-policy candidates; no published GHCR digest or cluster change
    image: ghcr.io/shaman007/godaddy-webhook
    evidence:
    - .github/workflows/publish-godaddy-webhook.yml
    - tools/godaddy-webhook/prepare_independent.py
    - tools/godaddy-webhook/INDEPENDENT-IMAGE.md
    acceptance: public anonymous layer pull, new digest and exact workflow signature, isolated runtime/TLS checks, staged DNS01 canary; only then promote chart/policies and update bootstrap image lock/bundle
  prometheus_receive:
    status: cutover active live; Prometheus has no sidecar or S3 mount and three optional scrape tokens; source publication pending
    evidence:
    - docs/startup/prometheus-receive/README.md
    - tools/bootstrap/prepare_prometheus_receive.py
    - tools/security/test_prometheus_receive.py
    stages:
    - independent Receive PVC, ESO and scoped networking
    - remote_write with old sidecar retained until history/upload acceptance
    - remove sidecar/S3 mounts, make three app scrape Secrets optional
    edges:
    - from: prometheus-local
      to: receive
      kind: asynchronous-delivery
    - from: receive-local-pvc
      to: receive
      kind: startup
    - from: seaweedfs
      to: receive
      kind: upload-dependency-only
    - from: receive
      to: thanos-query
      kind: feature
    acceptance: all 36 legacy closed blocks accounted for in S3; 340350 sampled historical/transition points matched before cutover; post-cutover boundary and steady data match; user explicitly accepted the final shutdown scrape tail remaining local only
prepared_packages:
  mail:
    status: deployed including diagnostic-loop fix; production inbound delivery and isolated filter failure/recovery verified
    provider: Valkey RESP, Unbound DNS, ClamAV PING, independent Dovecot LMTP/SASL
    consumer: Rspamd init/readiness then Postfix init/readiness; milter tempfail and AV soft reject
  mail-training:
    status: deployed; scheduled ready and completion verified
    provider: Rspamd ping
    consumer: spam trainer main command
  nextcloud-cron:
    status: deployed; scheduled ready and completion verified
    provider: SQL and ACL Valkey plus web maintenance/schema status
    consumer: Nextcloud cron main command
  karakeep:
    status: cdb00d1b deployed; worker gate released; remote Chrome connection and Meili/web checks passed
    provider: independent Chrome Service and Meilisearch
    consumer: s6 workers only; never Pod init
  observability:
    status: 02ea6103 published and reconciled; internal S3 active; natural sidecar upload verified (5 uploads, 0 failures); no global waits
    provider: direct SeaweedFS Service
    consumer: Loki and Thanos S3 clients; not a Prometheus startup gate
recovery_scenarios:
  harbor_dns01_without_independent_images:
    status: conditional failure if Harbor TLS is unavailable AND solver cache/bundle recovery is unavailable; normal valid-TLS restart is different
    extra_edges:
    - from: harbor
      to: harbor-dns01-webhook
    evidence:
    - tools/godaddy-webhook/chart/values.yaml
    - docs/bootstrap-images/README.md
  current_public_s3_geoip_loss:
    status: historical pre-cutover route; also describes rollback dependency on GeoIP PVC restore
    endpoint: https://s3.andreybondarenko.com
    extra_edges:
    - from: public-ingress
      to: longhorn-restore
    - from: longhorn-restore
      to: public-ingress
    evidence:
    - argocd/application-traefik.yaml
    - seaweedfs/ingress-andreybondarenko-ingress.yaml
    - docs/migrations/longhorn-internal-s3/README.md
  prepared_direct_s3:
    status: active for Longhorn; signed reads, target polls, small-PVC full backup and isolated new-PVC restore/hash comparison passed
    endpoint: http://s3.seaweedfs.svc.cluster.local:8333
    extra_edges: []
    evidence:
    - seaweedfs/service-s3.yaml
    - seaweedfs/network-policy-seaweedfs-allow-ingress-from-longhorn.yaml
    - docs/migrations/longhorn-internal-s3/endpoint.json
    - docs/migrations/longhorn-internal-s3/RESTORE-VERIFICATION.md
nodes:
  kubernetes:
    phase: 0
    ready: API reachable; etcd quorum and schedulable node(s). This is a bootstrap prerequisite, not an app Job.
    sources:
    - argocd/application-cilium.yaml
  bootstrap-image-bundle:
    phase: 0
    ready: Independent flat OCI bundle checksums verified; exact references/digests also preloaded on all three nodes. Containerd GC remains possible; permanent Talos media cache not enabled.
    sources:
    - docs/bootstrap-images/images.lock.json
    - docs/bootstrap-images/README.md
  harbor-dns01-webhook:
    phase: 2
    ready: Existing GoDaddy webhook Ready with its serving TLS and PAT Secret; exact Harbor challenge CNAME followed; production Certificate issuance verified separately.
    sources:
    - cert-manager/cluster-issuer-letsencrypt-harbor-dns01.yaml
    - docs/migrations/harbor-dns01/README.md
  node-dns:
    phase: 0
    ready: Node/containerd DNS resolves Harbor to .212 without public AAAA; upstream registry names resolve. UDM
      is outside Kubernetes.
    sources:
    - docs/migrations/harbor-bootstrap/CUTOVER.md
  upstream-images:
    phase: 0
    ready: Required upstream manifest and layers available, or exact images preloaded. A warm cache does not prove
      this.
    sources:
    - argocd/application-harbor.yaml
    - argocd/application-openbao.yaml
  cilium:
    phase: 1
    ready: Agents Ready on all target nodes; pod/service connectivity and required policies verified.
    sources:
    - argocd/application-cilium.yaml
  coredns:
    phase: 1
    ready: DNS replicas Ready and service-name queries resolve from target application namespace.
    sources:
    - kube-system
  longhorn:
    phase: 1
    ready: Managers/CSI Ready; each required volume healthy enough to attach and mounts on its target Pod. Bound
      PVC alone is insufficient.
    sources:
    - argocd/application-longhorn.yaml
  metallb:
    phase: 1
    ready: Controllers/speakers/FRR Ready; .212 advertised via valid peers with endpoints.
    sources:
    - argocd/application-metallb.yaml
  internal-ca:
    phase: 1
    ready: Original root Secret restored/valid; matching public trust distributed; independent age backup available.
      Never silently replace the root.
    sources:
    - docs/migrations/openbao-internal-tls/README.md
  cert-manager:
    phase: 1
    ready: Controller and webhook operational, CA Issuer Ready; no GoDaddy dependency for local-CA signing.
    sources:
    - argocd/application-cert-manager.yaml
  openbao-tls:
    phase: 1
    ready: Backend leaf Secret present, valid, key matches certificate and expected SAN/trust.
    sources:
    - docs/migrations/openbao-internal-tls/pki.yaml
  openbao:
    phase: 2
    ready: Raft quorum; required servers unsealed and an active leader; verified internal health request succeeds.
      Unseal is manual.
    sources:
    - argocd/application-openbao.yaml
  eso:
    phase: 1
    ready: Controller/webhook available. Provider/store health is evaluated per required Secret, not globally.
    sources:
    - argocd/application-external-secrets.yaml
  registry-ingress:
    phase: 2
    ready: traefik-registry Ready endpoints, .212:443 verified TLS/SNI and Harbor authentication challenge.
    sources:
    - argocd/application-traefik-registry.yaml
  harbor-data:
    phase: 2
    ready: Internal Harbor PostgreSQL and Redis healthy, required PVCs mounted. These start before Harbor is available.
    sources:
    - argocd/application-harbor.yaml
  harbor:
    phase: 2
    ready: Core/registry ready; token exchange and real authenticated private-image pull via .212 succeeds.
    sources:
    - argocd/application-harbor.yaml
    - docs/migrations/harbor-bootstrap/CUTOVER.md
  seaweedfs:
    phase: 2
    ready: HostPath available; master/volume/filer ready, S3 identities loaded and signed read of a known object
      succeeds.
    sources:
    - seaweedfs/deployment-seaweedfs-s3.yaml
  longhorn-restore:
    phase: 2
    ready: Backup target reachable; independent S3 credentials and chosen backups available. Not required for existing
      healthy volume attachment.
    sources:
    - longhorn/backup-target-seaweedfs-patch.json
  kyverno:
    phase: 2
    ready: Admission controllers available; resource verification uses Ignore and audit. Not a hard prerequisite
