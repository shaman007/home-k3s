    - clamav/deployment-clamav.yaml
    - clamav/config-map-clamav.yaml
  mail-rspamd:
    phase: 3
    ready: Startup waits for Valkey, Unbound, ClamAV; readiness also checks local HTTP ping and milter negotiation;
