    - kyverno/README.md
  dawarich-secrets:
    phase: 3
    ready: Only required target Secrets/keys present; if missing, relevant ESO store and ExternalSecret Ready. Do
      not wait for all cluster Secrets.
    sources:
    - dawarich
  dawarich-db:
    phase: 3
    ready: 'dawarich-postgres:5432 in dawarich: SELECT 1 authenticated as the application against the configured
      database; read-only, not merely TCP or pg_isready.'
    sources:
    - dawarich/stateful-set-dawarich-postgres.yaml
  dawarich:
    phase: 4
    ready: GET /api/v1/ready with Host localhost returns HTTP200/status ok after web-entrypoint schema/data migrations
