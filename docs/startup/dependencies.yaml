    sources:
    - your-spotify/deployment-web.yaml
  bitwarden-secrets:
    phase: 3
    ready: Only required existing app/DB Secret keys present; ESO/OpenBao needed when missing.
    sources:
    - bitwarden
  bitwarden-db:
    phase: 3
    ready: Authenticated read-only SELECT 1 against bw as app user; no merely open port.
    sources:
