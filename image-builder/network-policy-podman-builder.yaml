apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: podman-builder-default-deny
  namespace: image-builder
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: podman-builder-allow-build-egress
  namespace: image-builder
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: podman-builder
      app.kubernetes.io/instance: podman-builder
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
