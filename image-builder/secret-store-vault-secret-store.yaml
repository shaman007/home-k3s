---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-secret-store
  namespace: image-builder
  annotations:
    vault.w386.k8s.my.lan/token-policies: harbor,image-signing
  labels:
    app.kubernetes.io/name: podman-builder
    app.kubernetes.io/instance: podman-builder
    app.kubernetes.io/managed-by: argoCD
spec:
  refreshInterval: 900
  provider:
    vault:
      server: "https://openbao-api.int.andreybondarenko.com:8200"
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets-image-builder
          serviceAccountRef:
            name: vault-auth
            audiences:
              - vault
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: image-builder
automountServiceAccountToken: false
