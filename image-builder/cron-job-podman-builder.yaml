---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: podman-builder
  namespace: image-builder
  labels:
    app.kubernetes.io/name: podman-builder
    app.kubernetes.io/instance: podman-builder
    app.kubernetes.io/managed-by: argoCD
spec:
  # Rebuild every Monday. Reusable build layers are imported from and exported
  # to Harbor by the Dockerfiles repository's build script.
  schedule: "29 2 * * 1"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 21600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: podman-builder
            app.kubernetes.io/instance: podman-builder
        spec:
          automountServiceAccountToken: false
          priorityClassName: homelab-batch
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/arch: amd64
          containers:
            - name: build
              # Keep the reviewed runtime immutable even though the build output
              # includes the movable podman-builder:latest tag. Digest updates are
              # deliberate Git changes, never an automatic self-update.
              image: harbor.andreybondarenko.com/library/podman-builder@sha256:11ab7bf05b9323128c07c0b99b3cfdc0657a8a3e05c19f86044cf0465fae391e
              imagePullPolicy: IfNotPresent
              securityContext:
                privileged: true
              env:
                - name: HARBOR_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: podman-builder-harbor
                      key: username
                - name: HARBOR_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: podman-builder-harbor
                      key: password
                - name: STORAGE_DRIVER
                  value: overlay
                - name: PLATFORMS
                  value: linux/amd64
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  memory: 4Gi
              volumeMounts:
                - name: workspace
                  mountPath: /workspace
                - name: container-storage
                  mountPath: /var/lib/containers
          volumes:
            - name: workspace
              emptyDir:
                sizeLimit: 2Gi
            - name: container-storage
              emptyDir:
                sizeLimit: 80Gi
