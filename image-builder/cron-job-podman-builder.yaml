---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: podman-builder
  namespace: image-builder
  labels:
    app.kubernetes.io/name: podman-builder
    app.kubernetes.io/instance: podman-builder
    app.kubernetes.io/managed-by: argoCD
spec:
  # Cron has no exact every-two-weeks expression. Trigger each Monday and use
  # a continuous Unix epoch-week parity check before starting the build.
  schedule: "29 2 * * 1"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 21600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: podman-builder
            app.kubernetes.io/instance: podman-builder
        spec:
          automountServiceAccountToken: false
          priorityClassName: homelab-batch
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/arch: amd64
          containers:
            - name: build
              # Keep the reviewed runtime immutable even though the build output
              # includes the movable podman-builder:latest tag. Digest updates are
              # deliberate Git changes, never an automatic self-update.
              image: harbor.andreybondarenko.com/library/podman-builder@sha256:c57e8ae659ebd7c9d0ff9f769ce2221f2d0ee8bebfbbdb6672ed3560ee6280c5
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
                - |
                  current_epoch_week=$(($(date -u +%s) / 604800))
                  if [ $(((current_epoch_week - 2952) % 2)) -ne 0 ]; then
                    echo "Skipping alternate week; next image rebuild is in seven days."
                    exit 0
                  fi
                  exec /usr/local/bin/nightly-build
              securityContext:
                privileged: true
              env:
                - name: HARBOR_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: podman-builder-harbor
                      key: username
                - name: HARBOR_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: podman-builder-harbor
                      key: password
                - name: STORAGE_DRIVER
                  value: overlay
                - name: PLATFORMS
                  value: linux/amd64
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  memory: 4Gi
              volumeMounts:
                - name: workspace
                  mountPath: /workspace
                - name: container-storage
                  mountPath: /var/lib/containers
          volumes:
            - name: workspace
              emptyDir:
                sizeLimit: 2Gi
            - name: container-storage
              emptyDir:
                sizeLimit: 80Gi
