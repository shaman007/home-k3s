---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: podman-builder
  namespace: image-builder
  labels:
    app.kubernetes.io/name: podman-builder
    app.kubernetes.io/instance: podman-builder
    app.kubernetes.io/managed-by: argoCD
spec:
  # Rebuild every Monday. Reusable build layers are imported from and exported
  # to Harbor by the Dockerfiles repository's build script.
  schedule: "29 2 * * 1"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 21600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: podman-builder
            app.kubernetes.io/instance: podman-builder
        spec:
          automountServiceAccountToken: false
          priorityClassName: homelab-batch
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/arch: amd64
          initContainers:
            - name: checkout
              image: registry.k8s.io/git-sync/git-sync:v4.5.0@sha256:0e64aedb0d0ae0a3bab880349a5109b2a31891d646dd61e433ca36ed220dff1f
              imagePullPolicy: IfNotPresent
              args:
                - --repo=https://github.com/shaman007/Dockerfiles.git
                - --ref=main
                - --root=/workspace
                - --link=Dockerfiles
                - --depth=1
                - --one-time
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
                runAsUser: 0
                runAsGroup: 0
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: workspace
                  mountPath: /workspace
                - name: git-tmp
                  mountPath: /tmp
          containers:
            - name: build
              image: quay.io/podman/stable:v5.8.4@sha256:6297a84090f6d51863f17c644b5248619706943bc14540764886b019f3ae78e0
              imagePullPolicy: IfNotPresent
              workingDir: /workspace/Dockerfiles
              command:
                - /bin/bash
                - -c
              args:
                - |
                  set -Eeuo pipefail
                  printf '%s' "$HARBOR_PASSWORD" | podman login "$REGISTRY" \
                    --username "$HARBOR_USERNAME" \
                    --password-stdin
                  unset HARBOR_PASSWORD
                  exec ./build.sh
              securityContext:
                privileged: true
              env:
                - name: HARBOR_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: podman-builder-harbor
                      key: username
                - name: HARBOR_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: podman-builder-harbor
                      key: password
                - name: STORAGE_DRIVER
                  value: overlay
                - name: PLATFORMS
                  value: linux/amd64
                - name: CONTAINER_ENGINE
                  value: podman
                - name: LOGIN
                  value: "0"
                - name: PULL
                  value: "0"
                - name: REGISTRY
                  value: harbor.andreybondarenko.com
                - name: NAMESPACE
                  value: library
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  memory: 4Gi
              volumeMounts:
                - name: workspace
                  mountPath: /workspace
                - name: container-storage
                  mountPath: /var/lib/containers
          volumes:
            - name: workspace
              emptyDir:
                sizeLimit: 2Gi
            - name: container-storage
              emptyDir:
                sizeLimit: 80Gi
            - name: git-tmp
              emptyDir:
                sizeLimit: 128Mi
