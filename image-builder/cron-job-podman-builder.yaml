---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: podman-builder
  namespace: image-builder
  labels:
    app.kubernetes.io/name: podman-builder
    app.kubernetes.io/instance: podman-builder
    app.kubernetes.io/managed-by: argoCD
spec:
  # Rebuild every Monday. Reusable build layers are imported from and exported
  # to Harbor by the Dockerfiles repository's build script.
  schedule: "29 2 * * 1"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 21600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: podman-builder
            app.kubernetes.io/instance: podman-builder
        spec:
          automountServiceAccountToken: false
          priorityClassName: homelab-batch
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/arch: amd64
          initContainers:
            - name: checkout
              image: registry.k8s.io/git-sync/git-sync:v4.8.0
              imagePullPolicy: IfNotPresent
              args:
                - --repo=https://github.com/shaman007/Dockerfiles.git
                - --ref=main
                - --root=/workspace
                - --link=Dockerfiles
                - --depth=1
                - --one-time
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
                runAsUser: 0
                runAsGroup: 0
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: workspace
                  mountPath: /workspace
                - name: git-tmp
                  mountPath: /tmp
            - name: copy-busybox
              image: harbor.andreybondarenko.com/dockerhub/library/busybox:1.38.0-musl
              command:
              - /bin/cp
              - /bin/busybox
              - /tools/busybox
              volumeMounts:
              - &id001
                name: signing-tools
                mountPath: /tools
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: true
                runAsUser: 0
                runAsGroup: 0
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
            - name: copy-cosign
              image: harbor.andreybondarenko.com/github/sigstore/cosign/cosign:v3.0.6
              command:
              - /tools/busybox
              - cp
              - /ko-app/cosign
              - /tools/cosign
              volumeMounts:
              - *id001
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: true
                runAsUser: 0
                runAsGroup: 0
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
          containers:
            - name: build
              image: quay.io/podman/stable:v5.8.9
              imagePullPolicy: IfNotPresent
              workingDir: /workspace/Dockerfiles
              command:
                - /bin/bash
                - -c
              args:
                - |
                  set -Eeuo pipefail
                  export PATH="/tools:$PATH"
                  mkdir -p "$DOCKER_CONFIG"
                  printf '%s' "$HARBOR_PASSWORD" | podman login "$REGISTRY" \
                    --username "$HARBOR_USERNAME" \
                    --password-stdin
                  unset HARBOR_PASSWORD
                  exec ./build.sh
              securityContext:
                privileged: true
              env:
                - name: HARBOR_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: podman-builder-harbor
                      key: username
                - name: HARBOR_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: podman-builder-harbor
                      key: password
                - name: STORAGE_DRIVER
                  value: overlay
                - name: PLATFORMS
                  value: linux/amd64
                - name: CONTAINER_ENGINE
                  value: podman
                - name: LOGIN
                  value: "0"
                - name: PULL
                  value: "0"
                - name: REGISTRY
                  value: harbor.andreybondarenko.com
                - name: NAMESPACE
                  value: library
                - name: SIGN
                  value: '1'
                - name: COSIGN_KEY
                  value: /var/run/signing/cosign.key
                - name: COSIGN_PUBLIC_KEY
                  value: /var/run/signing-public/cosign.pub
                - name: COSIGN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: podman-builder-signing
                      key: password
                - name: DOCKER_CONFIG
                  value: /workspace/registry-auth
                - name: REGISTRY_AUTH_FILE
                  value: /workspace/registry-auth/config.json
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  memory: 4Gi
              volumeMounts:
                - name: workspace
                  mountPath: /workspace
                - name: container-storage
                  mountPath: /var/lib/containers
                - name: signing-tools
                  mountPath: /tools
                  readOnly: true
                - name: signing-key
                  mountPath: /var/run/signing
                  readOnly: true
                - name: signing-public
                  mountPath: /var/run/signing-public
                  readOnly: true
          volumes:
            - name: workspace
              emptyDir:
                sizeLimit: 2Gi
            - name: container-storage
              emptyDir:
                sizeLimit: 80Gi
            - name: git-tmp
              emptyDir:
                sizeLimit: 128Mi
            - name: signing-tools
              emptyDir:
                sizeLimit: 256Mi
            - name: signing-key
              secret:
                secretName: podman-builder-signing
                defaultMode: 256
                items:
                - key: cosign.key
                  path: cosign.key
            - name: signing-public
              configMap:
                name: podman-builder-signing-public
