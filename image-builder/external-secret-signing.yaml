apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: podman-builder-signing
  namespace: image-builder
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-secret-store
    kind: SecretStore
  target:
    name: podman-builder-signing
    creationPolicy: Owner
  data:
  - secretKey: cosign.key
    remoteRef:
      key: image-signing
      property: private_key
  - secretKey: password
    remoteRef:
      key: image-signing
      property: password
