apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nllb-model-cache
  namespace: nllb
  labels:
    app: nllb
    app.kubernetes.io/name: nllb
    app.kubernetes.io/instance: nllb
    app.kubernetes.io/managed-by: argoCD
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
