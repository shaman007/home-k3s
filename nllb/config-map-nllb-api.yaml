apiVersion: v1
kind: ConfigMap
metadata:
  name: nllb-api
  namespace: nllb
  labels:
    app: nllb
    app.kubernetes.io/name: nllb
    app.kubernetes.io/instance: nllb
    app.kubernetes.io/managed-by: argoCD
data:
  nllb_api.py: |
    import json
    import os
    import re
    import threading
    import time
    import uuid
    from http import HTTPStatus
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    import torch
    from transformers import AutoModelForSeq2SeqLM, AutoTokenizer


    MODEL_ID = "facebook/nllb-200-1.3B"
    MODEL_CACHE = os.environ.get("HF_HOME", "/models/cache")
    PORT = int(os.environ.get("PORT", "8080"))
    # NLLB uses language tags rather than natural-language instructions. Keep the
    # common OpenWebUI languages friendly while also accepting an explicit tag.
    LANGUAGES = {
        "arabic": "arb_Arab", "bengali": "ben_Beng", "bulgarian": "bul_Cyrl",
        "chinese": "zho_Hans", "chinese simplified": "zho_Hans",
        "chinese traditional": "zho_Hant", "croatian": "hrv_Latn",
        "czech": "ces_Latn", "czeck": "ces_Latn", "danish": "dan_Latn", "dutch": "nld_Latn",
        "english": "eng_Latn", "estonian": "est_Latn", "finnish": "fin_Latn",
        "french": "fra_Latn", "german": "deu_Latn", "greek": "ell_Grek",
        "hebrew": "heb_Hebr", "hindi": "hin_Deva", "hungarian": "hun_Latn",
        "indonesian": "ind_Latn", "italian": "ita_Latn", "japanese": "jpn_Jpan",
        "korean": "kor_Hang", "latvian": "lav_Latn", "lithuanian": "lit_Latn",
        "norwegian": "nob_Latn", "persian": "pes_Arab", "polish": "pol_Latn",
        "portuguese": "por_Latn", "romanian": "ron_Latn", "russian": "rus_Cyrl",
        "slovak": "slk_Latn", "slovenian": "slv_Latn", "spanish": "spa_Latn",
        "swedish": "swe_Latn", "thai": "tha_Thai", "turkish": "tur_Latn",
        "ukrainian": "ukr_Cyrl", "vietnamese": "vie_Latn",
    }
    generation_lock = threading.Lock()
    tokenizer = AutoTokenizer.from_pretrained(MODEL_ID, cache_dir=MODEL_CACHE)
    model = AutoModelForSeq2SeqLM.from_pretrained(
        MODEL_ID, cache_dir=MODEL_CACHE, torch_dtype=torch.float16
    ).to("cuda").eval()


    def language_code(value):
        value = value.strip()
        if re.fullmatch(r"[a-z]{3}_[A-Z][a-z]{3}", value):
            return value
        value = value.lower().replace(" language", "").replace(" text", "")
        return LANGUAGES.get(value)


    def translation_request(messages):
        content = "\n".join(
            message.get("content", "") for message in messages
            if message.get("role") == "user" and isinstance(message.get("content"), str)
        ).strip()
        match = re.search(
            r"(?is)translate(?:\s+the following)?(?:\s+text)?\s+from\s+(.+?)\s+to\s+(.+?)\s*:\s*(.+)",
            content,
        )
        if not match:
            match = re.search(r"(?is)^(.+?)\s+to\s+(.+?)\s*:\s*(.+)", content)
        if not match:
            raise ValueError(
                "Use: Translate from Czech to English: <text>. "
                "NLLB-200 also accepts its language tags, for example ces_Latn to eng_Latn."
            )
        source, target, text = match.groups()
        source_code = language_code(source)
        target_code = language_code(target)
        if not source_code or not target_code:
            raise ValueError(
                "The source or target language was not recognized. Use a common language name "
                "or an NLLB language tag, for example ces_Latn to eng_Latn."
            )
        return source_code, target_code, text.strip()


    def split_into_chunks(text, max_input_tokens=480):
        """Keep every request below NLLB's 512-token source limit."""
        chunks = []
        current = []
        paragraphs = [part.strip() for part in re.split(r"\n\s*\n", text) if part.strip()]
        for paragraph in paragraphs:
            sentences = re.split(r"(?<=[.!?…])\s+", paragraph)
            for sentence in sentences:
                if not sentence:
                    continue
                candidate = "\n\n".join(current + [sentence])
                if current and len(tokenizer(candidate, add_special_tokens=True).input_ids) > max_input_tokens:
                    chunks.append("\n\n".join(current))
                    current = [sentence]
                else:
                    current.append(sentence)
        if current:
            chunks.append("\n\n".join(current))
        return chunks


    def translate(messages, max_tokens):
        source, target, text = translation_request(messages)
        translated = []
        with generation_lock, torch.inference_mode():
            tokenizer.src_lang = source
            for chunk in split_into_chunks(text):
                inputs = tokenizer(chunk, return_tensors="pt", truncation=True, max_length=512).to("cuda")
                generated = model.generate(
                    **inputs,
                    forced_bos_token_id=tokenizer.convert_tokens_to_ids(target),
                    # OpenWebUI's chat max_tokens is commonly 128–512, which
                    # truncates otherwise valid document translations. Chunks
                    # are bounded by the input splitter, so reserve a full
                    # translation budget for each one.
                    max_new_tokens=1024,
                    num_beams=4,
                    do_sample=False,
                )
                translated.append(tokenizer.batch_decode(generated, skip_special_tokens=True)[0])
        return "\n\n".join(translated)


    class Handler(BaseHTTPRequestHandler):
        server_version = "NLLBOpenAI/1.0"

        def log_message(self, fmt, *args):
            print(fmt % args, flush=True)

        def send_json(self, status, value):
            payload = json.dumps(value).encode()
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(payload)))
            self.end_headers()
            self.wfile.write(payload)

        def do_GET(self):
            if self.path in ("/health", "/"):
                return self.send_json(HTTPStatus.OK, {"status": "ok", "model": "nllb-200-1.3b"})
            if self.path in ("/v1/models", "/models"):
                return self.send_json(HTTPStatus.OK, {"object": "list", "data": [{
                    "id": "nllb-200-1.3b", "object": "model", "owned_by": "meta",
                }]})
            self.send_json(HTTPStatus.NOT_FOUND, {"error": {"message": "Not found"}})

        def do_POST(self):
            if self.path != "/v1/chat/completions":
                return self.send_json(HTTPStatus.NOT_FOUND, {"error": {"message": "Not found"}})
            try:
                size = int(self.headers.get("Content-Length", "0"))
                request = json.loads(self.rfile.read(size))
                result = translate(request.get("messages", []), request.get("max_tokens"))
            except (ValueError, json.JSONDecodeError) as error:
                return self.send_json(HTTPStatus.BAD_REQUEST, {"error": {"message": str(error)}})
            except Exception as error:
                print(f"translation failed: {error}", flush=True)
                return self.send_json(HTTPStatus.INTERNAL_SERVER_ERROR, {"error": {"message": "Translation failed"}})

            completion_id = f"chatcmpl-{uuid.uuid4().hex}"
            created = int(time.time())
            if request.get("stream"):
                event = {"id": completion_id, "object": "chat.completion.chunk", "created": created,
                         "model": "nllb-200-1.3b", "choices": [{"index": 0,
                         "delta": {"content": result}, "finish_reason": "stop"}]}
                self.send_response(HTTPStatus.OK)
                self.send_header("Content-Type", "text/event-stream")
                self.send_header("Cache-Control", "no-cache")
                self.end_headers()
                self.wfile.write(f"data: {json.dumps(event)}\n\ndata: [DONE]\n\n".encode())
                return
            self.send_json(HTTPStatus.OK, {"id": completion_id, "object": "chat.completion", "created": created,
                "model": "nllb-200-1.3b", "choices": [{"index": 0, "message": {"role": "assistant", "content": result},
                "finish_reason": "stop"}], "usage": {}})


    ThreadingHTTPServer(("0.0.0.0", PORT), Handler).serve_forever()
