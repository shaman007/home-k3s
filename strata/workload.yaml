apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: strata-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 160Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-quota
spec:
  hard:
    pods: "3"
    services: "2"
    secrets: "5"
    configmaps: "5"
    persistentvolumeclaims: "1"
    requests.storage: 160Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: strata
spec:
  replicas: 1
  progressDeadlineSeconds: 86400
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: strata
  template:
    metadata:
      labels:
        app: strata
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      priorityClassName: homelab-best-effort
      runtimeClassName: nvidia
      nodeSelector:
        nvidia.com/gpu.present: "true"
      terminationGracePeriodSeconds: 120
      containers:
        - name: strata
          image: harbor.andreybondarenko.com/dockerhub/nvidia/cuda:13.4.3-devel-ubuntu24.04
          command: [/bin/bash, /scripts/bootstrap.sh]
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
            - name: STRATA_REVISION
              value: 296b59d2f73c8f04a805df29c2fa97655adace78
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "1"
              memory: 12Gi
              ephemeral-storage: 2Gi
            limits:
              cpu: "4"
              memory: 12Gi
              ephemeral-storage: 5Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - name: data
              mountPath: /data
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: api-key
              mountPath: /run/strata-secret
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: strata-data
        - name: scripts
          configMap:
            name: strata-scripts
        - name: api-key
          secret:
            secretName: strata-api-key
            defaultMode: 256
---
apiVersion: v1
kind: Service
metadata:
  name: strata
spec:
  selector:
    app: strata
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: strata-access
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: open-webui
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: strata
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
