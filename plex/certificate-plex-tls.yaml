---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: plex-tls
  namespace: plex
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: plex-tls
  dnsNames:
    - plex.andreybondarenko.com
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-prod
