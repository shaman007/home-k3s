apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: plex
  name: plex-conf-lh3
  labels:
    storage.k8s.io/name: longhorn
    recurring-job.longhorn.io/source: enabled
    recurring-job.longhorn.io/backup-daily-retain31-b: enabled
    recurring-job.longhorn.io/trim-daily-a: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 15Gi
