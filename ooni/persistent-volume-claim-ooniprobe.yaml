apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ooniprobe-data
  namespace: ooni
  labels:
    app.kubernetes.io/name: ooniprobe
    app.kubernetes.io/instance: ooniprobe
    app.kubernetes.io/managed-by: argoCD
    recurring-job.longhorn.io/source: enabled
    recurring-job.longhorn.io/backup-daily-retain31-c: enabled
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
