apiVersion: batch/v1
kind: CronJob
metadata:
  name: ooniprobe
  namespace: ooni
  labels:
    app.kubernetes.io/name: ooniprobe
    app.kubernetes.io/instance: ooniprobe
    app.kubernetes.io/managed-by: argoCD
spec:
  schedule: "17 3 * * *"
  timeZone: Europe/Prague
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 21600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ooniprobe
            app.kubernetes.io/instance: ooniprobe
        spec:
          automountServiceAccountToken: false
          priorityClassName: homelab-batch
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/arch: amd64
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: ooniprobe
              image: harbor.andreybondarenko.com/library/ooniprobe:2026-08-26-081148
              imagePullPolicy: IfNotPresent
              args:
                - --config=/config/config.json
                - --batch
                - run
                - unattended
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: data
                  mountPath: /data
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: config
              configMap:
                name: ooniprobe-config
            - name: data
              persistentVolumeClaim:
                claimName: ooniprobe-data
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
