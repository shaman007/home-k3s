apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-secret-store
  namespace: open-webui
  annotations:
    vault.w386.k8s.my.lan/token-policies: open-webui
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/instance: open-webui
    app.kubernetes.io/part-of: open-webui
    app.kubernetes.io/managed-by: argo-cd
spec:
  refreshInterval: 900
  provider:
    vault:
      server: "https://openbao-api.int.andreybondarenko.com:8200"
      path: "kv"
      version: "v2"
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets-open-webui
          serviceAccountRef:
            name: vault-auth
            audiences:
              - vault
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: open-webui
automountServiceAccountToken: false
