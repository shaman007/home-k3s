apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: open-webui-allow-egress-otlp-traces
  namespace: open-webui
spec:
  podSelector:
    matchLabels:
      app: open-webui
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app: tempo
      ports:
        - protocol: TCP
          port: 4318
