apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: open-webui
  labels:
    app: open-webui
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/instance: open-webui
    app.kubernetes.io/managed-by: argoCD
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
        app.kubernetes.io/name: open-webui
        app.kubernetes.io/instance: open-webui
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      priorityClassName: homelab-best-effort
      enableServiceLinks: false
      initContainers:
        - name: prepare-data
          image: harbor.andreybondarenko.com/dockerhub/busybox:1.38
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - >-
              find /data -path /data/lost+found -prune -o -exec chown 1000:1000 {} +;
              if [ ! -s /data/.webui_secret_key ]; then
                umask 077;
                head -c 48 /dev/urandom | base64 > /data/.webui_secret_key;
                chown 1000:1000 /data/.webui_secret_key;
              fi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
            readOnlyRootFilesystem: true
            runAsUser: 0
            runAsGroup: 0
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: open-webui-data
              mountPath: /data
        - name: reconcile-model-providers
          image: harbor.andreybondarenko.com/github/open-webui/open-webui:v0.11.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              # On a fresh install, OpenWebUI initializes these ConfigVars from
              # the ConfigMap environment. On an existing install, reconcile
              # only the Git-managed model-provider settings.
              if [ ! -f /app/backend/data/webui.db ]; then
                exit 0
              fi
              python - <<'PY'
              import json
              import os
              import sqlite3

              database = "/app/backend/data/webui.db"
              values = {
                  "openai.enable": os.environ["ENABLE_OPENAI_API"].lower() == "true",
                  "openai.api_base_urls": os.environ["OPENAI_API_BASE_URLS"].split(";"),
                  "openai.api_keys": os.environ["OPENAI_API_KEYS"].split(";"),
                  "openai.api_configs": json.loads(os.environ["OPENAI_API_CONFIGS"]),
              }
              with sqlite3.connect(database) as connection:
                  connection.executemany(
                      """
                      INSERT INTO config (key, value, updated_at) VALUES (?, ?, unixepoch())
                      ON CONFLICT(key) DO UPDATE SET value = excluded.value, updated_at = excluded.updated_at
                      """,
                      [(key, json.dumps(value)) for key, value in values.items()],
                  )
              PY
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          envFrom:
            - configMapRef:
                name: open-webui-model-providers
          volumeMounts:
            - name: open-webui-data
              mountPath: /app/backend/data
            - name: tmp
              mountPath: /tmp
      containers:
        - name: open-webui
          image: harbor.andreybondarenko.com/github/open-webui/open-webui:v0.11.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          env:
            # Keep infrastructure integrations declarative. Chats, accounts,
            # and other user data remain on the persistent data volume.
            - name: ENABLE_PERSISTENT_CONFIG
              value: "False"
            - name: OLLAMA_BASE_URL
              value: http://ollama.ollama.svc.cluster.local:11434
            - name: OLLAMA_BASE_URLS
              value: http://ollama.ollama.svc.cluster.local:11434;http://ollama-small.ollama.svc.cluster.local:11434
            - name: WEBUI_AUTH
              value: "True"
            - name: ENABLE_IMAGE_GENERATION
              value: "True"
            - name: TERMINAL_SERVER_CONNECTIONS
              valueFrom:
                secretKeyRef:
                  name: open-webui-terminal-server-connections
                  key: TERMINAL_SERVER_CONNECTIONS
            - name: AIOHTTP_CLIENT_TIMEOUT_TOOL_SERVER
              value: "120"
            - name: IMAGE_GENERATION_ENGINE
              value: comfyui
            - name: IMAGE_GENERATION_MODEL
              value: sdxl_lightning_4step.safetensors
            - name: COMFYUI_BASE_URL
              value: http://comfyui.comfyui.svc.cluster.local:8188
            - name: IMAGE_SIZE
              value: 1024x1024
            - name: IMAGE_STEPS
              value: "4"
            - name: IMAGE_PROMPT_GENERATION_PROMPT_TEMPLATE
              value: |
                ### Task:
                Convert the user's request into a concise image-generation prompt for ComfyUI.

                ### Rules:
                - Do not answer the user.
                - Do not say you cannot draw, create, render, browse, or provide images.
                - Do not include apologies, disclaimers, explanations, markdown, or extra text.
                - Do not wrap the JSON in a markdown code fence.
                - The first character of your response must be { and the last character must be }.
                - Keep the prompt concrete and visual.
                - Preserve the user's requested subject, style, composition, colors, and mood.
                - If details are missing, add a few tasteful visual details that help image generation.

                ### Output:
                Return strictly valid JSON and nothing else:
                {
                  "prompt": "image generation prompt here"
                }

                ### User request:
                {{prompt}}
            - name: COMFYUI_WORKFLOW
              value: |
                {
                  "3": {
                    "inputs": {
                      "seed": 0,
                      "steps": 4,
                      "cfg": 1,
                      "sampler_name": "euler",
                      "scheduler": "sgm_uniform",
                      "denoise": 1,
                      "model": ["4", 0],
                      "positive": ["6", 0],
                      "negative": ["7", 0],
                      "latent_image": ["5", 0]
                    },
                    "class_type": "KSampler",
                    "_meta": {
                      "title": "KSampler"
                    }
                  },
                  "4": {
                    "inputs": {
                      "ckpt_name": "sdxl_lightning_4step.safetensors"
                    },
                    "class_type": "CheckpointLoaderSimple",
                    "_meta": {
                      "title": "Load Checkpoint"
                    }
                  },
                  "5": {
                    "inputs": {
                      "width": 1024,
                      "height": 1024,
                      "batch_size": 1
                    },
                    "class_type": "EmptyLatentImage",
                    "_meta": {
                      "title": "Empty Latent Image"
                    }
                  },
                  "6": {
                    "inputs": {
                      "text": "a beautiful image",
                      "clip": ["4", 1]
                    },
                    "class_type": "CLIPTextEncode",
                    "_meta": {
                      "title": "Positive Prompt"
                    }
                  },
                  "7": {
                    "inputs": {
                      "text": "text, watermark, blurry, distorted",
                      "clip": ["4", 1]
                    },
                    "class_type": "CLIPTextEncode",
                    "_meta": {
                      "title": "Negative Prompt"
                    }
                  },
                  "8": {
                    "inputs": {
                      "samples": ["3", 0],
                      "vae": ["4", 2]
                    },
                    "class_type": "VAEDecode",
                    "_meta": {
                      "title": "VAE Decode"
                    }
                  },
                  "9": {
                    "inputs": {
                      "filename_prefix": "open-webui",
                      "images": ["8", 0]
                    },
                    "class_type": "SaveImage",
                    "_meta": {
                      "title": "Save Image"
                    }
                  }
                }
            - name: COMFYUI_WORKFLOW_NODES
              value: |
                [
                  {"type": "prompt", "key": "text", "node_ids": ["6"]},
                  {"type": "model", "key": "ckpt_name", "node_ids": ["4"]},
                  {"type": "width", "key": "width", "node_ids": ["5"]},
                  {"type": "height", "key": "height", "node_ids": ["5"]},
                  {"type": "steps", "key": "steps", "node_ids": ["3"]},
                  {"type": "seed", "key": "seed", "node_ids": ["3"]}
                ]
            - name: ENABLE_SIGNUP
              value: "False"
            - name: TZ
              value: Europe/Prague
            - name: HOME
              value: /tmp
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          envFrom:
            - configMapRef:
                name: open-webui-model-providers
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 960Mi
            limits:
              memory: 1344Mi
          volumeMounts:
            - name: open-webui-data
              mountPath: /app/backend/data
            - name: open-webui-data
              mountPath: /app/backend/.webui_secret_key
              subPath: .webui_secret_key
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: open-webui-data
          persistentVolumeClaim:
            claimName: open-webui-data
        - name: tmp
          emptyDir: {}
