---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp-letsencrypt
  namespace: headlamp
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: headlamp-local-network-only@kubernetescrd,headlamp-hsts@kubernetescrd
  labels:
    app: headlamp
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/instance: headlamp
    app.kubernetes.io/managed-by: argoCD
spec:
  ingressClassName: traefik-private
  tls:
  - hosts:
    - headlamp.int.andreybondarenko.com
    secretName: headlamp-letsencrypt-internal-tls
  rules:
  - host: headlamp.int.andreybondarenko.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: headlamp
            port:
              number: 80
