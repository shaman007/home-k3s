apiVersion: v1
kind: ConfigMap
metadata:
  name: postfix-queue-exporter
  namespace: mail
data:
  postfix-queue-exporter.pl: "#!/usr/bin/perl\nuse strict;\nuse warnings;\nuse JSON::PP qw(decode_json);\nuse IO::Socket::INET;\n\
    \n# Only aggregate postqueue's JSON output; never log payloads or error text.\nsub collect {\n    my ($input, $now) =\
    \ @_;\n    my (%counts, %ages);\n    for my $name (qw(active deferred incoming hold maildrop)) {\n        $counts{$name}\
    \ = 0;\n        $ages{$name} = 0;\n    }\n    while (my $line = <$input>) {\n        die \"oversized record\" if length($line)\
    \ > 1048576;\n        my $item = decode_json($line);\n        my $queue = $item->{queue_name};\n        die \"unknown\
    \ queue\" unless defined($queue) && exists $counts{$queue};\n        my $arrival = $item->{arrival_time};\n        die\
    \ \"invalid timestamp\" unless defined($arrival) && $arrival =~ /^\\d+$/;\n        $counts{$queue}++;\n        # A message\
    \ can arrive while postqueue streams its snapshot.\n        my $age = $now > $arrival ? $now - $arrival : 0;\n       \
    \ $ages{$queue} = $age if $age > $ages{$queue};\n    }\n    my $body = \"# TYPE postfix_queue_messages gauge\\n# TYPE\
    \ postfix_queue_oldest_age_seconds gauge\\n\";\n    for my $queue (sort keys %counts) {\n        $body .= \"postfix_queue_messages{queue=\\\
    \"$queue\\\"} $counts{$queue}\\n\";\n        $body .= \"postfix_queue_oldest_age_seconds{queue=\\\"$queue\\\"} $ages{$queue}\\\
    n\";\n    }\n    return $body;\n}\n\nif (@ARGV && $ARGV[0] eq '--parse') {\n    print collect(\\*STDIN, $ARGV[1] // time);\n\
    \    exit;\n}\n\nsub metrics {\n    my $metrics;\n    my $ok = eval {\n        my $pid = open(my $queue, '-|');\n    \
    \    die \"cannot inspect queue\" unless defined $pid;\n        if (!$pid) {\n            open STDERR, '>', '/dev/null'\
    \ or exit 1;\n            $SIG{ALRM} = 'DEFAULT';\n            alarm 8;\n            exec '/usr/sbin/postqueue', '-j';\n\
    \            exit 1;\n        }\n        $metrics = collect($queue, time);\n        close $queue or die \"queue inspection\
    \ failed\";\n        1;\n    };\n    return \"# TYPE postfix_queue_scrape_success gauge\\npostfix_queue_scrape_success\
    \ \" . ($ok ? \"1\\n$metrics\" : \"0\\n\");\n}\n\nif (@ARGV && $ARGV[0] eq '--once') {\n    print metrics();\n    exit;\n\
    }\n\nmy $server = IO::Socket::INET->new(LocalAddr => '0.0.0.0', LocalPort => 9154,\n    Listen => 8, ReuseAddr => 1) or\
    \ die \"cannot listen\";\n$SIG{PIPE} = 'IGNORE';\nwhile (my $client = $server->accept()) {\n    eval {\n        local\
    \ $SIG{ALRM} = sub { die \"timeout\" };\n        alarm 10;\n        my $request = <$client> // '';\n        die \"invalid\
    \ request\" if length($request) > 4096;\n        my ($status, $body) = ('200 OK', \"ok\\n\");\n        if ($request =~\
    \ m{^GET /metrics HTTP/1\\.[01]\\r?\\n$}) {\n            $body = metrics();\n        } elsif ($request !~ m{^GET /healthz\
    \ HTTP/1\\.[01]\\r?\\n$}) {\n            ($status, $body) = ('404 Not Found', \"not found\\n\");\n        }\n        print\
    \ $client \"HTTP/1.1 $status\\r\\nContent-Type: text/plain; version=0.0.4\\r\\nContent-Length: \" . length($body) . \"\
    \\r\\nConnection: close\\r\\n\\r\\n$body\";\n        alarm 0;\n    };\n    alarm 0;\n    close $client;\n}\n"
