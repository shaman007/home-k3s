---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rspamd-ingress-letsencrypt
  namespace: mail
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: traefik-internal-clients-only@kubernetescrd
spec:
  ingressClassName: traefik-private
  tls:
  - hosts:
    - rspamd.int.andreybondarenko.com
    secretName: rspamd-letsencrypt-internal-tls
  rules:
  - host: rspamd.int.andreybondarenko.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: rspamd
            port:
              number: 11334
