---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rspamd-spam-trainer
  namespace: mail
  labels:
    tier: mail
    app: rspamd-spam-trainer
    app.kubernetes.io/name: rspamd-spam-trainer
    app.kubernetes.io/instance: rspamd-spam-trainer
    app.kubernetes.io/managed-by: argoCD
data:
  dovecot.conf: |
    dovecot_config_version = 2.4.0
    dovecot_storage_version = 2.4.0
    protocols =
    base_dir = /run/dovecot
    log_path = /dev/stderr

    service auth {
      unix_listener auth-userdb {
        mode = 0660
        user = 1000
        group = 1000
      }
    }

    userdb static {
      userdb_static_allow_all_users = yes
      fields {
        uid = 1000
        gid = 1000
        home = /var/mail/boxes/%{user | username}
      }
    }

    mail_driver = mbox
    mail_path = /var/mail/boxes/%{user | username}
    mail_inbox_path = /var/mail/%{user | username}
    mbox_write_locks = fcntl

    namespace inbox {
      inbox = yes
    }
  train-spam.sh: |
    #!/bin/sh
    set -eu

    pending=/tmp/pending-messages
    message=/tmp/message.eml
    learned=0

    # doveadm resolves the static user through Dovecot's auth-userdb socket.
    # Start a private master in this pod; protocols are disabled above, so it
    # does not expose IMAP, LMTP, or ManageSieve listeners.
    dovecot
    trap 'dovecot stop >/dev/null 2>&1 || true' EXIT

    attempts=0
    until [ -S /run/dovecot/auth-userdb ]; do
      attempts=$((attempts + 1))
      if [ "${attempts}" -ge 50 ]; then
        echo "Dovecot auth-userdb socket did not become ready." >&2
        exit 1
      fi
      sleep 0.1
    done

    doveadm search -u spam mailbox INBOX all > "${pending}"

    while read -r mailbox_guid uid; do
      [ -n "${mailbox_guid}" ] || continue

      # doveadm prefixes the fetched value with a "text:" field marker.
      doveadm fetch -u spam text mailbox-guid "${mailbox_guid}" uid "${uid}" \
        | sed '1d' > "${message}"

      curl --fail --silent --show-error \
        --header 'Content-Type: message/rfc822' \
        --data-binary "@${message}" \
        http://rspamd.mail.svc.cluster.local:11334/learnspam > /dev/null

      # Delete only after Rspamd confirms that this message was learned.
      doveadm expunge -u spam mailbox-guid "${mailbox_guid}" uid "${uid}"
      learned=$((learned + 1))
    done < "${pending}"

    doveadm purge -u spam
    dovecot stop
    trap - EXIT
    echo "Learned and removed ${learned} spam message(s)."
