# Native SMTP listener: IPv6 clients connect directly to port 25, without router port translation.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  namespace: mail
  name: postfix-smtp
spec:
  entryPoints:
    - smtp
  routes:
    - match: HostSNI(`*`)
      services:
        - name: postfix-tls
          port: 587
          proxyProtocol:
            version: 2
