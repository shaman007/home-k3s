apiVersion: apps/v1
kind: Deployment
metadata:
  name: rspamd
  namespace: mail
  labels:
    app: rspamd
    tier: mail
    app.kubernetes.io/name: rspamd
    app.kubernetes.io/instance: rspamd
    app.kubernetes.io/version: 4.0.0
    app.kubernetes.io/managed-by: argoCD
  annotations:
    configmap.reloader.stakater.com/auto: 'true'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rspamd
      tier: mail
  template:
    metadata:
      labels:
        app: rspamd
        tier: mail
    spec:
      automountServiceAccountToken: false
      priorityClassName: homelab-standard
      securityContext:
        fsGroup: 11333
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: rspamd-cf
          configMap:
            name: rspamd-cf
            items:
              - key: logging
                path: logging.inc
        - name: worker-cf
          secret:
            secretName: workercontroller
            items:
              - key: workercontroller
                path: worker-controller.inc
        - name: redis-cf
          configMap:
            name: rspamd-cf
            items:
              - key: redis.conf
                path: redis.conf
        - name: history-cf
          configMap:
            name: rspamd-cf
            items:
              - key: history
                path: history_redis.conf
        - name: greylist-cf
          configMap:
            name: rspamd-cf
            items:
              - key: greylist
                path: greylist.conf
        - name: greylist-whitelist-cf
          configMap:
            name: rspamd-cf
            items:
              - key: greylist_whitelist_domains
                path: greylist-whitelist-domains.inc
        - name: antivirus-cf
          configMap:
            name: rspamd-cf
            items:
              - key: antivirus
                path: antivirus.conf
        - name: neural-cf
          configMap:
            name: rspamd-cf
            items:
              - key: neural
                path: neural.conf
        - name: neural-group-cf
          configMap:
            name: rspamd-cf
            items:
              - key: neural_group
                path: neural_group.conf
        - name: statistics-cf
          configMap:
            name: rspamd-cf
            items:
              - key: statistics
                path: statistic.conf
        - name: rspamd
          configMap:
            name: rspamd-cf
            items:
              - key: rspamd
                path: rspamd.conf
        - name: dkimsigning-cf
          configMap:
            name: rspamd-cf
            items:
              - key: dkim_signing
                path: dkim_signing.conf
        - name: surbl-cf
          configMap:
            name: rspamd-cf
            items:
              - key: surbl
                path: surbl.conf
        - name: options-cf
          configMap:
            name: rspamd-cf
            items:
              - key: options
                path: options.inc
        - name: external-relay-cf
          configMap:
            name: rspamd-cf
            items:
              - key: external_relay
                path: external_relay.conf
        - name: settings-cf
          configMap:
            name: rspamd-cf
            items:
              - key: settings
                path: settings.conf
        - name: privater-cf
          secret:
            secretName: andreybondarenko.key
            items:
              - key: andreybondarenko.key
                path: andreybondarenko.key
        - name: mail-lh
          persistentVolumeClaim:
            claimName: mail-lh
        - name: rspamd-local
          persistentVolumeClaim:
            claimName: rspamd-local
        - name: logs
          emptyDir: {}
        - name: mail-startup
          configMap:
            name: mail-startup-e07d94c90561
        - name: force-actions-cf
          configMap:
            name: rspamd-cf
            items:
              - key: force_actions
                path: force_actions.conf
      containers:
        - name: rspamd
          image: harbor.andreybondarenko.com/github/rspamd/rspamd-docker:4.2.3
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 50m
              memory: 576Mi
            limits:
              memory: 768Mi
          ports:
            - containerPort: 11333
            - containerPort: 11334
          readinessProbe:
            exec:
              command:
                - timeout
                - -s
                - TERM
                - -k
                - '1'
                - '8'
                - perl
                - /mail-startup/mail_dependency_gate.pl
                - --check
                - rspamd-ready
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /ping
              port: 11334
              scheme: HTTP
            periodSeconds: 30
            timeoutSeconds: 1
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 11333
            runAsGroup: 11333
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: rspamd-cf
              mountPath: /etc/rspamd/local.d/logging.inc
              subPath: logging.inc
            - name: worker-cf
              mountPath: /etc/rspamd/local.d/worker-controller.inc
              subPath: worker-controller.inc
            - name: redis-cf
              mountPath: /etc/rspamd/local.d/redis.conf
              readOnly: true
              subPath: redis.conf
            - name: history-cf
              mountPath: /etc/rspamd/local.d/history_redis.conf
              subPath: history_redis.conf
            - name: greylist-cf
              mountPath: /etc/rspamd/local.d/greylist.conf
              subPath: greylist.conf
            - name: greylist-whitelist-cf
              mountPath: /etc/rspamd/local.d/greylist-whitelist-domains.inc
              subPath: greylist-whitelist-domains.inc
            - name: neural-cf
              mountPath: /etc/rspamd/local.d/neural.conf
              subPath: neural.conf
            - name: neural-group-cf
              mountPath: /etc/rspamd/local.d/neural_group.conf
              subPath: neural_group.conf
            - name: antivirus-cf
              mountPath: /etc/rspamd/local.d/antivirus.conf
              subPath: antivirus.conf
            - name: statistics-cf
              mountPath: /usr/share/rspamd/config/statistic.conf
              subPath: statistic.conf
            - name: rspamd
              mountPath: /etc/rspamd/rspamd.conf
              subPath: rspamd.conf
            - name: dkimsigning-cf
              mountPath: /etc/rspamd/local.d/dkim_signing.conf
              subPath: dkim_signing.conf
            - name: privater-cf
              mountPath: /var/lib/rspamd/dkim/andreybondarenko.key
              subPath: andreybondarenko.key
              readOnly: true
            - name: rspamd-local
              mountPath: /var/lib/rspamd
            - name: mail-lh
              mountPath: /mail
            - name: logs
              mountPath: /var/log/
            - name: surbl-cf
              mountPath: /etc/rspamd/local.d/surbl.conf
              subPath: surbl.conf
            - name: options-cf
              mountPath: /etc/rspamd/local.d/options.inc
              subPath: options.inc
            - name: external-relay-cf
              mountPath: /etc/rspamd/local.d/external_relay.conf
              subPath: external_relay.conf
              readOnly: true
            - name: settings-cf
              mountPath: /etc/rspamd/local.d/settings.conf
              subPath: settings.conf
            - name: mail-startup
              mountPath: /mail-startup
              readOnly: true
            - name: force-actions-cf
              mountPath: /etc/rspamd/local.d/force_actions.conf
              subPath: force_actions.conf
              readOnly: true
      initContainers:
        - name: fix-perms
          image: harbor.andreybondarenko.com/dockerhub/busybox:1.38
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - chown -R 11333:11333 /var/lib/rspamd && chmod 755 /var/lib/rspamd
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: rspamd-local
              mountPath: /var/lib/rspamd
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 32Mi
        - name: wait-for-mail-dependencies
          image: harbor.andreybondarenko.com/github/rspamd/rspamd-docker:4.2.3
          imagePullPolicy: IfNotPresent
          command:
            - timeout
            - -s
            - TERM
            - -k
            - '1'
            - '305'
            - perl
            - /mail-startup/mail_dependency_gate.pl
            - --wait
            - rspamd-dependencies
          securityContext:
            runAsNonRoot: true
            runAsUser: 11333
            runAsGroup: 11333
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: mail-startup
              mountPath: /mail-startup
              readOnly: true
      nodeSelector:
        kubernetes.io/hostname: w386
