apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  annotations:
    kubernetes.io/ingress.class: traefik
  namespace: mail
  name: dovecot-managesieve
spec:
  entryPoints:
    - managesieve
  routes:
    - match: HostSNI(`*`)
      services:
        - name: dovecot-managesieve
          port: 4190
