apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postfix-allow-prometheus-metrics
  namespace: mail
spec:
  podSelector:
    matchLabels: {app: postfix}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
          podSelector:
            matchLabels: {app: prometheus-server}
      ports:
        - {protocol: TCP, port: 9154}
