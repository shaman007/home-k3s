apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-own-harbor-images
spec:
  validationActions:
  - Audit
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
      - pods/ephemeralcontainers
  matchImageReferences:
  - glob: harbor.andreybondarenko.com/library/*
  validationConfigurations:
    mutateDigest: false
    verifyDigest: false
    required: true
  attestors:
  - name: homelab
    cosign:
      key:
        data: '-----BEGIN PUBLIC KEY-----

          MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEfi0XzPtSZGYDC23AQfmxdlrkBL+Q

          H9Xf65VWTlPLplKxqMZBCVhs1LESys/sz7sXEb16L8F2SMxeNYWMONclTQ==

          -----END PUBLIC KEY-----

          '
      ctlog:
        url: https://rekor.sigstore.dev
  validations:
  - expression: images.containers.map(image, verifyImageSignatures(image, [attestors.homelab])).all(result,
      result > 0)
    message: Image must be signed by the homelab signing key
