apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-drop-all-capabilities
  annotations:
    policies.kyverno.io/title: Explicit capability drops
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/description: Require explicit drop ALL; permit only NET_BIND_SERVICE additions.
spec:
  validationActions:
  - Audit
  failurePolicy: Ignore
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups: ['']
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [pods]
  matchConditions:
  - name: exclude-control-plane-namespaces
    expression: "!(request.namespace in ['kyverno', 'kube-system'])"
  - name: linux-pods
    expression: "object.spec.?os.?name.orValue('linux') != 'windows'"
  variables:
  - name: containers
    expression: object.spec.containers + object.spec.?initContainers.orValue([]) + object.spec.?ephemeralContainers.orValue([])
  validations:
  - expression: >-
      variables.containers.all(c,
        'ALL' in c.?securityContext.?capabilities.?drop.orValue([]) &&
        c.?securityContext.?capabilities.?add.orValue([]).all(cap, cap == 'NET_BIND_SERVICE'))
    message: All regular, init and ephemeral containers must explicitly drop ALL capabilities and may only add NET_BIND_SERVICE.
