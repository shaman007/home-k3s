apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-dockerfiles-ghcr-ephemeral
spec:
  validationActions:
  - Audit
  failurePolicy: Ignore
  evaluation:
    admission:
      enabled: true
    background:
      enabled: false
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - UPDATE
      resources:
      - pods/ephemeralcontainers
  matchImageReferences:
  - glob: ghcr.io/shaman007/canitiser:*
  - glob: ghcr.io/shaman007/canitiser@*
  - glob: ghcr.io/shaman007/connectivity-exporter-local:*
  - glob: ghcr.io/shaman007/connectivity-exporter-local@*
  - glob: ghcr.io/shaman007/crowdsec-rootless:*
  - glob: ghcr.io/shaman007/crowdsec-rootless@*
  - glob: ghcr.io/shaman007/external-access-daily-report:*
  - glob: ghcr.io/shaman007/external-access-daily-report@*
  - glob: ghcr.io/shaman007/mastodon:*
  - glob: ghcr.io/shaman007/mastodon@*
  - glob: ghcr.io/shaman007/ooniprobe:*
  - glob: ghcr.io/shaman007/ooniprobe@*
  - glob: ghcr.io/shaman007/php:*
  - glob: ghcr.io/shaman007/php@*
  - glob: ghcr.io/shaman007/postfix:*
  - glob: ghcr.io/shaman007/postfix@*
  - glob: ghcr.io/shaman007/ripe-atlas:*
  - glob: ghcr.io/shaman007/ripe-atlas@*
  - glob: ghcr.io/shaman007/sync:*
  - glob: ghcr.io/shaman007/sync@*
  validationConfigurations:
    mutateDigest: false
    verifyDigest: false
    required: true
  attestors:
  - name: dockerfiles
    cosign:
      keyless:
        identities:
        - issuer: https://token.actions.githubusercontent.com
          subjectRegExp: ^https://github\.com/shaman007/Dockerfiles/\.github/workflows/docker-publish\.yml@refs/(heads/main|tags/v[0-9]+\.[0-9]+\.[0-9]+)$
      ctlog:
        url: https://rekor.sigstore.dev
  validations:
  - expression: (images.containers + images.initContainers + images.ephemeralContainers).map(image,
      verifyImageSignatures(image, [attestors.dockerfiles])).all(result, result >
      0)
    message: Image must be signed by the Dockerfiles publishing workflow
  autogen:
    podControllers:
      controllers: []
---
