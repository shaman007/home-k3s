---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-linux-host
  namespace: monitoring
data:
  linux-host.json: |-
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {"type": "grafana", "uid": "-- Grafana --"},
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "Linux host, NVIDIA GPU, hardware sensor, and SMART metrics. Missing data is shown as no data and does not create alerts.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"decimals": 0, "unit": "s"}, "overrides": []},
          "gridPos": {"h": 4, "w": 4, "x": 0, "y": 0},
          "id": 1,
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto", "wideLayout": true},
          "targets": [{"editorMode": "code", "expr": "time() - node_boot_time_seconds{job=\"linux-host-node-exporter\",host=~\"$host\"}", "instant": true, "range": false, "refId": "A"}],
          "title": "Uptime",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"decimals": 1, "max": 100, "min": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 75}, {"color": "red", "value": 90}]}, "unit": "percent"}, "overrides": []},
          "gridPos": {"h": 4, "w": 4, "x": 4, "y": 0},
          "id": 2,
          "options": {"colorMode": "background", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto", "wideLayout": true},
          "targets": [{"editorMode": "code", "expr": "100 * (1 - avg(rate(node_cpu_seconds_total{job=\"linux-host-node-exporter\",host=~\"$host\",mode=\"idle\"}[5m])))", "instant": true, "range": false, "refId": "A"}],
          "title": "CPU Used",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"decimals": 1, "max": 100, "min": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 80}, {"color": "red", "value": 90}]}, "unit": "percent"}, "overrides": []},
          "gridPos": {"h": 4, "w": 4, "x": 8, "y": 0},
          "id": 3,
          "options": {"colorMode": "background", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto", "wideLayout": true},
          "targets": [{"editorMode": "code", "expr": "100 * (1 - node_memory_MemAvailable_bytes{job=\"linux-host-node-exporter\",host=~\"$host\"} / node_memory_MemTotal_bytes{job=\"linux-host-node-exporter\",host=~\"$host\"})", "instant": true, "range": false, "refId": "A"}],
          "title": "Memory Used",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"decimals": 1, "max": 100, "min": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 80}, {"color": "red", "value": 90}]}, "unit": "percent"}, "overrides": []},
          "gridPos": {"h": 4, "w": 4, "x": 12, "y": 0},
          "id": 4,
          "options": {"colorMode": "background", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto", "wideLayout": true},
          "targets": [{"editorMode": "code", "expr": "100 * (1 - node_filesystem_avail_bytes{job=\"linux-host-node-exporter\",host=~\"$host\",mountpoint=\"/\",fstype!~\"tmpfs|overlay\"} / node_filesystem_size_bytes{job=\"linux-host-node-exporter\",host=~\"$host\",mountpoint=\"/\",fstype!~\"tmpfs|overlay\"})", "instant": true, "range": false, "refId": "A"}],
          "title": "Root Filesystem Used",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"decimals": 2, "unit": "short"}, "overrides": []},
          "gridPos": {"h": 4, "w": 4, "x": 16, "y": 0},
          "id": 5,
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto", "wideLayout": true},
          "targets": [{"editorMode": "code", "expr": "node_load1{job=\"linux-host-node-exporter\",host=~\"$host\"}", "instant": true, "range": false, "refId": "A"}],
          "title": "Load (1m)",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"decimals": 0, "unit": "short"}, "overrides": []},
          "gridPos": {"h": 4, "w": 4, "x": 20, "y": 0},
          "id": 6,
          "options": {"colorMode": "value", "graphMode": "none", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto", "wideLayout": true},
          "targets": [{"editorMode": "code", "expr": "count(node_cpu_seconds_total{job=\"linux-host-node-exporter\",host=~\"$host\",mode=\"idle\"})", "instant": true, "range": false, "refId": "A"}],
          "title": "CPU Cores",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"custom": {"axisCenteredZero": false, "axisColorMode": "text", "axisLabel": "", "axisPlacement": "auto", "barAlignment": 0, "drawStyle": "line", "fillOpacity": 18, "gradientMode": "none", "hideFrom": {"legend": false, "tooltip": false, "viz": false}, "insertNulls": false, "lineInterpolation": "linear", "lineWidth": 1, "pointSize": 5, "scaleDistribution": {"type": "linear"}, "showPoints": "never", "spanNulls": false, "stacking": {"group": "A", "mode": "none"}, "thresholdsStyle": {"mode": "off"}}, "max": 100, "min": 0, "unit": "percent"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "id": 7,
          "options": {"legend": {"calcs": ["lastNotNull", "mean", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"hideZeros": false, "mode": "multi", "sort": "desc"}},
          "targets": [
            {"editorMode": "code", "expr": "100 * (1 - avg(rate(node_cpu_seconds_total{job=\"linux-host-node-exporter\",host=~\"$host\",mode=\"idle\"}[5m])))", "legendFormat": "CPU", "range": true, "refId": "A"},
            {"editorMode": "code", "expr": "100 * (1 - node_memory_MemAvailable_bytes{job=\"linux-host-node-exporter\",host=~\"$host\"} / node_memory_MemTotal_bytes{job=\"linux-host-node-exporter\",host=~\"$host\"})", "legendFormat": "Memory", "range": true, "refId": "B"}
          ],
          "title": "CPU and Memory",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"custom": {"axisCenteredZero": true, "axisColorMode": "text", "axisLabel": "", "axisPlacement": "auto", "barAlignment": 0, "drawStyle": "line", "fillOpacity": 12, "gradientMode": "none", "hideFrom": {"legend": false, "tooltip": false, "viz": false}, "insertNulls": false, "lineInterpolation": "linear", "lineWidth": 1, "pointSize": 5, "scaleDistribution": {"type": "linear"}, "showPoints": "never", "spanNulls": false, "stacking": {"group": "A", "mode": "none"}, "thresholdsStyle": {"mode": "off"}}, "unit": "Bps"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "id": 8,
          "options": {"legend": {"calcs": ["lastNotNull", "mean", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"hideZeros": false, "mode": "multi", "sort": "desc"}},
          "targets": [
            {"editorMode": "code", "expr": "sum(rate(node_network_receive_bytes_total{job=\"linux-host-node-exporter\",host=~\"$host\",device!~\"lo|veth.*|docker.*|br-.*\"}[5m]))", "legendFormat": "Receive", "range": true, "refId": "A"},
            {"editorMode": "code", "expr": "-sum(rate(node_network_transmit_bytes_total{job=\"linux-host-node-exporter\",host=~\"$host\",device!~\"lo|veth.*|docker.*|br-.*\"}[5m]))", "legendFormat": "Transmit", "range": true, "refId": "B"}
          ],
          "title": "Network Throughput",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"custom": {"axisCenteredZero": false, "axisColorMode": "text", "axisLabel": "", "axisPlacement": "auto", "barAlignment": 0, "drawStyle": "line", "fillOpacity": 12, "gradientMode": "none", "hideFrom": {"legend": false, "tooltip": false, "viz": false}, "insertNulls": false, "lineInterpolation": "linear", "lineWidth": 1, "pointSize": 5, "scaleDistribution": {"type": "linear"}, "showPoints": "never", "spanNulls": false, "stacking": {"group": "A", "mode": "none"}, "thresholdsStyle": {"mode": "off"}}, "unit": "Bps"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
          "id": 9,
          "options": {"legend": {"calcs": ["lastNotNull", "mean", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"hideZeros": false, "mode": "multi", "sort": "desc"}},
          "targets": [
            {"editorMode": "code", "expr": "sum by (device) (rate(node_disk_read_bytes_total{job=\"linux-host-node-exporter\",host=~\"$host\"}[5m]))", "legendFormat": "{{device}} read", "range": true, "refId": "A"},
            {"editorMode": "code", "expr": "sum by (device) (rate(node_disk_written_bytes_total{job=\"linux-host-node-exporter\",host=~\"$host\"}[5m]))", "legendFormat": "{{device}} write", "range": true, "refId": "B"}
          ],
          "title": "Disk I/O",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"decimals": 1, "max": 100, "min": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 80}, {"color": "red", "value": 90}]}, "unit": "percent"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
          "id": 10,
          "options": {"displayMode": "gradient", "maxVizHeight": 300, "minVizHeight": 16, "minVizWidth": 8, "namePlacement": "auto", "orientation": "horizontal", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "showUnfilled": true, "sizing": "auto", "valueMode": "color"},
          "targets": [{"editorMode": "code", "expr": "100 * (1 - node_filesystem_avail_bytes{job=\"linux-host-node-exporter\",host=~\"$host\",device=~\"/dev/.+\",fstype!~\"tmpfs|devtmpfs|overlay|squashfs\"} / node_filesystem_size_bytes{job=\"linux-host-node-exporter\",host=~\"$host\",device=~\"/dev/.+\",fstype!~\"tmpfs|devtmpfs|overlay|squashfs\"})", "legendFormat": "{{mountpoint}}", "range": true, "refId": "A"}],
          "title": "Filesystem Usage",
          "type": "bargauge"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"custom": {"axisCenteredZero": false, "axisColorMode": "text", "axisLabel": "", "axisPlacement": "auto", "barAlignment": 0, "drawStyle": "line", "fillOpacity": 15, "gradientMode": "none", "hideFrom": {"legend": false, "tooltip": false, "viz": false}, "insertNulls": false, "lineInterpolation": "linear", "lineWidth": 1, "pointSize": 5, "scaleDistribution": {"type": "linear"}, "showPoints": "never", "spanNulls": false, "stacking": {"group": "A", "mode": "none"}, "thresholdsStyle": {"mode": "off"}}, "max": 100, "min": 0, "unit": "percent"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 20},
          "id": 11,
          "options": {"legend": {"calcs": ["lastNotNull", "mean", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"hideZeros": false, "mode": "multi", "sort": "desc"}},
          "targets": [
            {"editorMode": "code", "expr": "linux_host_gpu_utilization_percent{job=\"linux-host-node-exporter\",host=~\"$host\"}", "legendFormat": "GPU", "range": true, "refId": "A"},
            {"editorMode": "code", "expr": "100 * linux_host_gpu_memory_used_bytes{job=\"linux-host-node-exporter\",host=~\"$host\"} / linux_host_gpu_memory_total_bytes{job=\"linux-host-node-exporter\",host=~\"$host\"}", "legendFormat": "VRAM used", "range": true, "refId": "B"},
            {"editorMode": "code", "expr": "linux_host_gpu_memory_utilization_percent{job=\"linux-host-node-exporter\",host=~\"$host\"}", "legendFormat": "Memory controller", "range": true, "refId": "C"}
          ],
          "title": "GPU Utilization",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"custom": {"axisCenteredZero": false, "axisColorMode": "text", "axisLabel": "", "axisPlacement": "auto", "barAlignment": 0, "drawStyle": "line", "fillOpacity": 15, "gradientMode": "none", "hideFrom": {"legend": false, "tooltip": false, "viz": false}, "insertNulls": false, "lineInterpolation": "linear", "lineWidth": 1, "pointSize": 5, "scaleDistribution": {"type": "linear"}, "showPoints": "never", "spanNulls": false, "stacking": {"group": "A", "mode": "none"}, "thresholdsStyle": {"mode": "off"}}, "min": 0, "unit": "bytes"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 20},
          "id": 12,
          "options": {"legend": {"calcs": ["lastNotNull", "mean", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"hideZeros": false, "mode": "multi", "sort": "desc"}},
          "targets": [
            {"editorMode": "code", "expr": "linux_host_gpu_memory_used_bytes{job=\"linux-host-node-exporter\",host=~\"$host\"}", "legendFormat": "Used", "range": true, "refId": "A"},
            {"editorMode": "code", "expr": "linux_host_gpu_memory_free_bytes{job=\"linux-host-node-exporter\",host=~\"$host\"}", "legendFormat": "Free", "range": true, "refId": "B"}
          ],
          "title": "GPU Memory",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"custom": {"axisCenteredZero": false, "axisColorMode": "text", "axisLabel": "", "axisPlacement": "auto", "barAlignment": 0, "drawStyle": "line", "fillOpacity": 12, "gradientMode": "none", "hideFrom": {"legend": false, "tooltip": false, "viz": false}, "insertNulls": false, "lineInterpolation": "linear", "lineWidth": 1, "pointSize": 5, "scaleDistribution": {"type": "linear"}, "showPoints": "never", "spanNulls": false, "stacking": {"group": "A", "mode": "none"}, "thresholdsStyle": {"mode": "off"}}, "unit": "celsius"}, "overrides": [{"matcher": {"id": "byName", "options": "Fan"}, "properties": [{"id": "unit", "value": "percent"}, {"id": "custom.axisPlacement", "value": "right"}]}]},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 28},
          "id": 13,
          "options": {"legend": {"calcs": ["lastNotNull", "mean", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"hideZeros": false, "mode": "multi", "sort": "desc"}},
          "targets": [
            {"editorMode": "code", "expr": "linux_host_gpu_temperature_celsius{job=\"linux-host-node-exporter\",host=~\"$host\"}", "legendFormat": "Temperature", "range": true, "refId": "A"},
            {"editorMode": "code", "expr": "linux_host_gpu_fan_percent{job=\"linux-host-node-exporter\",host=~\"$host\"}", "legendFormat": "Fan", "range": true, "refId": "B"}
          ],
          "title": "GPU Temperature and Fan",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"custom": {"axisCenteredZero": false, "axisColorMode": "text", "axisLabel": "", "axisPlacement": "auto", "barAlignment": 0, "drawStyle": "line", "fillOpacity": 15, "gradientMode": "none", "hideFrom": {"legend": false, "tooltip": false, "viz": false}, "insertNulls": false, "lineInterpolation": "linear", "lineWidth": 1, "pointSize": 5, "scaleDistribution": {"type": "linear"}, "showPoints": "never", "spanNulls": false, "stacking": {"group": "A", "mode": "none"}, "thresholdsStyle": {"mode": "off"}}, "min": 0, "unit": "watt"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 28},
          "id": 14,
          "options": {"legend": {"calcs": ["lastNotNull", "mean", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"hideZeros": false, "mode": "multi", "sort": "desc"}},
          "targets": [
            {"editorMode": "code", "expr": "linux_host_gpu_power_watts{job=\"linux-host-node-exporter\",host=~\"$host\"}", "legendFormat": "Draw", "range": true, "refId": "A"},
            {"editorMode": "code", "expr": "linux_host_gpu_power_limit_watts{job=\"linux-host-node-exporter\",host=~\"$host\"}", "legendFormat": "Limit", "range": true, "refId": "B"}
          ],
          "title": "GPU Power",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"custom": {"axisCenteredZero": false, "axisColorMode": "text", "axisLabel": "", "axisPlacement": "auto", "barAlignment": 0, "drawStyle": "line", "fillOpacity": 10, "gradientMode": "none", "hideFrom": {"legend": false, "tooltip": false, "viz": false}, "insertNulls": false, "lineInterpolation": "linear", "lineWidth": 1, "pointSize": 5, "scaleDistribution": {"type": "linear"}, "showPoints": "never", "spanNulls": false, "stacking": {"group": "A", "mode": "none"}, "thresholdsStyle": {"mode": "off"}}, "unit": "celsius"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 36},
          "id": 15,
          "options": {"legend": {"calcs": ["lastNotNull", "mean", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"hideZeros": false, "mode": "multi", "sort": "desc"}},
          "targets": [
            {"editorMode": "code", "expr": "node_hwmon_temp_celsius{job=\"linux-host-node-exporter\",host=~\"$host\",chip=\"platform_coretemp_0\",sensor=\"temp1\"}", "legendFormat": "CPU package", "range": true, "refId": "A"},
            {"editorMode": "code", "expr": "node_hwmon_temp_celsius{job=\"linux-host-node-exporter\",host=~\"$host\",chip=\"platform_asus_ec_sensors\",sensor=\"temp2\"}", "legendFormat": "VRM", "range": true, "refId": "B"},
            {"editorMode": "code", "expr": "node_hwmon_temp_celsius{job=\"linux-host-node-exporter\",host=~\"$host\",chip=~\"nvme_.*\",sensor=\"temp1\"}", "legendFormat": "{{chip}}", "range": true, "refId": "C"},
            {"editorMode": "code", "expr": "node_thermal_zone_temp{job=\"linux-host-node-exporter\",host=~\"$host\",type=\"iwlwifi_1\"}", "legendFormat": "Wi-Fi", "range": true, "refId": "D"}
          ],
          "title": "Component Temperatures",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"decimals": 0, "max": 1, "min": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}, "unit": "bool"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 36},
          "id": 16,
          "options": {"colorMode": "background", "graphMode": "none", "justifyMode": "auto", "orientation": "horizontal", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto", "wideLayout": true},
          "targets": [{"editorMode": "code", "expr": "linux_host_smart_health_passed{job=\"linux-host-node-exporter\",host=~\"$host\"}", "legendFormat": "{{device}} {{model}}", "range": true, "refId": "A"}],
          "title": "SMART Health",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"custom": {"axisCenteredZero": false, "axisColorMode": "text", "axisLabel": "", "axisPlacement": "auto", "barAlignment": 0, "drawStyle": "line", "fillOpacity": 10, "gradientMode": "none", "hideFrom": {"legend": false, "tooltip": false, "viz": false}, "insertNulls": false, "lineInterpolation": "linear", "lineWidth": 1, "pointSize": 5, "scaleDistribution": {"type": "linear"}, "showPoints": "never", "spanNulls": false, "stacking": {"group": "A", "mode": "none"}, "thresholdsStyle": {"mode": "off"}}, "unit": "celsius"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 44},
          "id": 17,
          "options": {"legend": {"calcs": ["lastNotNull", "mean", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"hideZeros": false, "mode": "multi", "sort": "desc"}},
          "targets": [{"editorMode": "code", "expr": "linux_host_smart_temperature_celsius{job=\"linux-host-node-exporter\",host=~\"$host\"}", "legendFormat": "{{device}} {{model}}", "range": true, "refId": "A"}],
          "title": "Disk Temperatures",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"custom": {"axisCenteredZero": false, "axisColorMode": "text", "axisLabel": "", "axisPlacement": "auto", "barAlignment": 0, "drawStyle": "line", "fillOpacity": 8, "gradientMode": "none", "hideFrom": {"legend": false, "tooltip": false, "viz": false}, "insertNulls": false, "lineInterpolation": "linear", "lineWidth": 1, "pointSize": 5, "scaleDistribution": {"type": "linear"}, "showPoints": "never", "spanNulls": false, "stacking": {"group": "A", "mode": "none"}, "thresholdsStyle": {"mode": "off"}}, "min": 0, "unit": "short"}, "overrides": [{"matcher": {"id": "byRegexp", "options": "/.*wear.*/"}, "properties": [{"id": "unit", "value": "percent"}, {"id": "custom.axisPlacement", "value": "right"}]}]},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 44},
          "id": 18,
          "options": {"legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"hideZeros": false, "mode": "multi", "sort": "desc"}},
          "targets": [
            {"editorMode": "code", "expr": "linux_host_smart_nvme_percentage_used{job=\"linux-host-node-exporter\",host=~\"$host\"}", "legendFormat": "{{device}} wear", "range": true, "refId": "A"},
