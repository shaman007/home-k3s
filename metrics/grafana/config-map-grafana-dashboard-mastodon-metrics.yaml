---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-mastodon-metrics
  namespace: monitoring
data:
  mastodon-metrics.json: |-
    {
      "uid": "mastodon-metrics",
      "title": "Mastodon Application Metrics",
      "description": "Native web/Puma and embedded Sidekiq metrics, plus read-only Sidekiq queue counts and waiting age from Valkey. Retry/dead sets retain failures; they are not new-failure counters.",
      "tags": [
        "homelab",
        "monitoring-audit"
      ],
      "schemaVersion": 41,
      "version": 1,
      "editable": true,
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timezone": "browser",
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Web requests by status",
          "datasource": {
            "type": "prometheus",
            "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (status) (rate(ruby_http_requests_total{job=\"mastodon\"}[$__rate_interval]))",
              "legendFormat": "{{status}}",
              "range": true
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Puma request backlog",
          "datasource": {
            "type": "prometheus",
            "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
