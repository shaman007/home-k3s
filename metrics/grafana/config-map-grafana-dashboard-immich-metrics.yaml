---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-immich-metrics
  namespace: monitoring
data:
  immich-metrics.json: |-
    {
      "uid": "immich-metrics",
      "title": "Immich Application Metrics",
      "description": "API and microservices telemetry from the two native endpoints. Queue panels show observed active-job gauges; no absent metric is presented as a successful zero.",
      "tags": [
        "homelab",
        "monitoring-audit"
      ],
      "schemaVersion": 41,
      "version": 1,
      "editable": true,
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timezone": "browser",
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Telemetry endpoint health",
          "datasource": {
            "type": "prometheus",
            "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "up{job=\"immich\"}",
              "legendFormat": "{{instance}}",
              "range": true
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Process memory",
          "datasource": {
            "type": "prometheus",
            "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "process_memory_usage{job=\"immich\"}",
              "legendFormat": "{{instance}}",
              "range": true
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Process CPU utilization",
          "datasource": {
            "type": "prometheus",
            "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
          },
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * process_cpu_utilization{job=\"immich\"}",
              "legendFormat": "{{instance}} / {{process_cpu_state}}",
              "range": true
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Active jobs by queue",
          "datasource": {
            "type": "prometheus",
            "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
          },
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (__name__) ({job=\"immich\",__name__=~\"immich_queues_.*_active\"})",
              "legendFormat": "{{__name__}}",
              "range": true
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Worker job runs",
          "datasource": {
            "type": "prometheus",
            "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
          },
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(immich_job_repository_run_duration_count{job=\"immich\"}[$__rate_interval]))",
              "legendFormat": "runs",
              "range": true
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Asset creation calls",
          "datasource": {
            "type": "prometheus",
            "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
          },
          "gridPos": {
            "x": 12,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(immich_asset_repository_create_duration_count{job=\"immich\"}[$__rate_interval]))",
              "legendFormat": "calls",
              "range": true
            }
          ]
        }
      ],
      "templating": {
        "list": []
      }
    }
