---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-data-services
  namespace: monitoring
data:
  data-services.json: |-
    {
      "uid": "data-services",
      "title": "Database and Storage Metrics",
      "description": "Modern panels for existing PostgreSQL, MySQL, Valkey, FerretDB and Longhorn exporters. These supplement the imported legacy dashboards. Database exporters do not establish application request health.",
      "tags": [
        "homelab",
        "monitoring-audit"
      ],
      "schemaVersion": 41,
      "version": 1,
      "editable": true,
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timezone": "browser",
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "PostgreSQL exporter health",
          "datasource": {
            "type": "prometheus",
            "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "pg_up",
              "legendFormat": "{{job}} / {{instance}}",
              "range": true
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "PostgreSQL database size",
          "datasource": {
            "type": "prometheus",
