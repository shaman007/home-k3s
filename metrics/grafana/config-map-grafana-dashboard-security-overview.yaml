    {
      "uid": "security-overview",
      "title": "Security Overview",
      "description": "CrowdSec, Keycloak, Kubernetes audit and Falco detections with collection and delivery health. Events indicate activity or attempts, not proof of compromise.",
      "schemaVersion": 41,
      "version": 1,
      "editable": true,
      "tags": [
        "homelab",
        "security"
      ],
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timezone": "browser",
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Security overview · collection health",
          "collapsed": false,
          "panels": [],
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          }
        },
        {
          "id": 2,
          "title": "CrowdSec endpoints · expected 2",
          "description": "Global coverage, independent of event filters. Scrape availability alone does not prove ingestion. Current cluster baseline: 2.",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(up{job=\"crowdsec\"}) or vector(0)",
              "datasource": {
                "type": "prometheus",
                "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
              },
              "instant": true,
              "range": false,
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 2
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
