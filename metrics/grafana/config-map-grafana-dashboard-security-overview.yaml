        {
          "id": 14,
          "title": "Credential failures · selected range",
          "description": "Credential/account errors only. Refresh-token failures are excluded; realm totals do not identify a user or attacker.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
          },
          "gridPos": {
            "x": 0,
            "y": 46,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (realm,error) (increase(keycloak_user_events_total{job=\"keycloak\",realm=~\"${realm:regex}\",event=\"login\",error=~\"invalid_user_credentials|user_not_found|user_disabled|user_temporarily_disabled\"}[$__range]))",
              "datasource": {
