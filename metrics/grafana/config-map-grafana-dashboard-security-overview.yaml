        {
          "id": 6,
          "title": "Active rules · grouped by API server",
          "description": "Each row groups events, rather than representing one attack. See actors, actions and targets in the table below. Node identifies the receiving API server; the collector namespace is hidden. Falco sends events directly to Alertmanager and is shown separately.",
          "type": "table",
          "datasource": {
            "type": "prometheus",
            "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
          },
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 24,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
              "expr": "ALERTS{category=\"security\",alertstate=~\"pending|firing\"}",
              "datasource": {
                "type": "prometheus",
                "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
              },
              "instant": true,
              "range": false,
              "format": "table",
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data",
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Outcome"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "allowed": {
                            "text": "API allowed"
                          },
                          "denied": {
                            "text": "API denied"
                          },
                          "failed": {
                            "text": "Request failed"
                          },
                          "dry-run": {
                            "text": "Dry-run only"
                          }
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Detection"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "KubernetesUnexpectedSecretRead": {
                            "text": "Secret access outside reviewed exceptions"
                          },
                          "KubernetesSensitivePodExec": {
                            "text": "Exec / attach / port-forward"
                          },
                          "KubernetesDangerousRBAC": {
                            "text": "Permission grant / dangerous role"
                          },
                          "KubernetesPrivilegedPod": {
                            "text": "Privileged Pod"
                          }
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "sortBy": []
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "category": true,
                  "cluster": true,
                  "job": true,
                  "namespace": true,
                  "owner": true,
                  "priority": true,
                  "severity": true,
                  "Value": true,
                  "Value #A": true
                },
                "indexByName": {
                  "alertname": 0,
                  "alertstate": 1,
                  "node": 2,
                  "outcome": 3,
                  "name": 4,
                  "destination": 5
                },
                "renameByName": {
                  "alertname": "Detection",
                  "alertstate": "State",
                  "node": "API server / sensor node",
                  "outcome": "Outcome",
                  "name": "Scenario",
                  "destination": "Destination"
                }
              }
            }
          ]
        },
        {
          "id": 31,
          "title": "Who did what and where · audit events in the last 15 minutes",
          "description": "Events behind active audit alerts, grouped by actor, action and target; the value is the event count. Allowed means API permitted, denied means API rejected, and dry-run means validation without changes. The receiving API server is not necessarily the request source. Source IP is available for new events and may identify a node after NAT. Get reads one object, list retrieves a collection, and watch subscribes to changes. Actor is the authenticated identity, not a proven person or process. These fields are queried from logs without adding Prometheus metric labels.",
          "type": "table",
          "datasource": {
            "type": "loki",
            "uid": "db1b23ef-7ce7-4bb2-b0b6-998c13754cfd"
          },
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 24,
            "h": 10
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (node,detection,actor,action,target_namespace,target_name,outcome,source_ip) (count_over_time({job=\"kubernetes-audit\",node=~\"${node:regex}\",detection=~\"${audit_detection:regex}\",outcome=~\"${outcome:regex}\"} | json actor=\"actor\", verb=\"verb\", resource=\"resource\", subresource=\"subresource\", target_namespace=\"namespace\", target_name=\"name\", source_ip=\"source_ip\" | __error__=\"\" | label_format action=\"{{.verb}} {{.resource}}{{if .subresource}}/{{.subresource}}{{end}}\", target_namespace=\"{{if .target_namespace}}{{.target_namespace}}{{else}}(cluster){{end}}\", target_name=\"{{if .target_name}}{{.target_name}}{{else}}(collection){{end}}\" [15m]))",
              "datasource": {
                "type": "loki",
                "uid": "db1b23ef-7ce7-4bb2-b0b6-998c13754cfd"
              },
              "instant": true,
              "range": false,
              "queryType": "instant",
              "maxLines": 200,
              "format": "table",
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data",
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Outcome"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "allowed": {
                            "text": "API allowed"
                          },
                          "denied": {
                            "text": "API denied"
                          },
                          "failed": {
                            "text": "Request failed"
                          },
                          "dry-run": {
                            "text": "Dry-run only"
                          }
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Actor"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 320
                  },
                  {
                    "id": "custom.wrapText",
                    "value": true
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Detection"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "secret_read": {
                            "text": "Secret access outside reviewed exceptions"
                          },
                          "dangerous_rbac": {
                            "text": "Permission grant / dangerous role"
                          },
                          "sensitive_exec": {
                            "text": "Exec / attach / port-forward"
                          },
                          "privileged_pod": {
                            "text": "Privileged Pod"
                          }
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "sortBy": []
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "indexByName": {
                  "actor": 0,
                  "action": 1,
                  "target_namespace": 2,
                  "target_name": 3,
                  "outcome": 4,
                  "detection": 5,
                  "node": 6,
                  "source_ip": 7,
                  "Value #A": 8
                },
                "renameByName": {
                  "actor": "Actor",
                  "action": "Action",
                  "target_namespace": "Target namespace",
                  "target_name": "Object / collection",
                  "outcome": "Outcome",
                  "detection": "Detection",
                  "node": "API server",
                  "source_ip": "Source IP",
                  "Value #A": "Events",
                  "Value": "Events"
                }
              }
            }
          ]
        },
        {
          "id": 7,
