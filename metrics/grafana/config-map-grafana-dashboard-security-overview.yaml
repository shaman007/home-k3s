          "title": "Exploit and scanning activity",
          "description": "Rolling 10-minute detection counts. Routine scans are reviewed in the daily external-access email, without immediate alerts. Attempts do not prove exploitation; counters retain raw detection context.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
          },
          "gridPos": {
            "x": 0,
