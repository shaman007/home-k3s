---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-metrics-collection
  namespace: monitoring
data:
  metrics-collection.json: |-
    {
      "uid": "metrics-collection",
      "title": "Metrics Collection",
      "description": "Scrape health, sample volume, alert delivery and collector health. Up means an endpoint responded, not that the application is healthy. A missing target is different from a down target.",
      "tags": [
        "homelab",
        "monitoring-audit"
      ],
      "schemaVersion": 41,
      "version": 1,
      "editable": true,
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timezone": "browser",
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Targets up",
          "datasource": {
            "type": "prometheus",
            "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (job) (up{job=~\"$job\"})",
              "legendFormat": "{{job}}",
              "range": true
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Targets down",
          "datasource": {
            "type": "prometheus",
            "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (job) (1 - up{job=~\"$job\"})",
              "legendFormat": "{{job}}",
              "range": true
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Scrape duration",
          "datasource": {
            "type": "prometheus",
            "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
          },
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max by (job) (scrape_duration_seconds{job=~\"$job\"})",
              "legendFormat": "{{job}}",
              "range": true
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Samples after relabeling",
          "datasource": {
            "type": "prometheus",
            "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
          },
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (job) (scrape_samples_post_metric_relabeling{job=~\"$job\"})",
              "legendFormat": "{{job}}",
              "range": true
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Scrape sample churn",
          "datasource": {
            "type": "prometheus",
            "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
          },
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (job) (scrape_series_added{job=~\"$job\"})",
              "legendFormat": "{{job}}",
              "range": true
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Prometheus TSDB series",
          "datasource": {
            "type": "prometheus",
            "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
          },
          "gridPos": {
            "x": 12,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "prometheus_tsdb_head_series{job=\"prometheus\"}",
              "legendFormat": "{{instance}}",
              "range": true
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Prometheus rule evaluation failures",
          "datasource": {
            "type": "prometheus",
            "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
          },
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(prometheus_rule_evaluation_failures_total{job=\"prometheus\"}[$__rate_interval]))",
              "legendFormat": "failures",
              "range": true
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Prometheus alert notification errors",
          "datasource": {
            "type": "prometheus",
            "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
          },
          "gridPos": {
            "x": 12,
            "y": 24,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(prometheus_notifications_errors_total{job=\"prometheus\"}[$__rate_interval]))",
              "legendFormat": "errors",
              "range": true
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Alertmanager notification failures",
          "datasource": {
            "type": "prometheus",
            "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
          },
          "gridPos": {
            "x": 0,
            "y": 32,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (integration) (rate(alertmanager_notifications_failed_total{job=\"alertmanager\"}[$__rate_interval]))",
              "legendFormat": "{{integration}}",
              "range": true
            }
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Alloy last config load successful",
          "datasource": {
            "type": "prometheus",
            "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
          },
          "gridPos": {
            "x": 12,
            "y": 32,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "alloy_config_last_load_successful{job=\"alloy\"}",
              "legendFormat": "{{pod}}",
              "range": true
            }
          ]
        }
      ],
      "templating": {
        "list": [
          {
            "name": "job",
            "label": "Job",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
            },
            "query": {
              "query": "label_values(up, job)",
              "refId": "StandardVariableQuery"
            },
            "refresh": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "options": []
          }
        ]
      }
    }
