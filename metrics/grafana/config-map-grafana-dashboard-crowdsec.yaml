apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-crowdsec
  namespace: monitoring
data:
  crowdsec.json: |
    {
      "uid": "crowdsec-overview",
      "title": "CrowdSec",
      "description": "Public Traefik CrowdSec observation: ingestion, parser health, scenarios, alerts and decisions. Simulation context is documented explicitly.",
      "tags": [
        "crowdsec",
        "security",
        "traefik"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "title": "Observation mode",
          "type": "text",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 4
          },
          "description": "",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {}
            },
            "overrides": []
          },
          "options": {
            "mode": "markdown",
            "content": "### CrowdSec \u2014 public Traefik monitoring\nThis deployment is configured for **global simulation with no bouncer**. Alerts and decisions do **not** mean requests were blocked. The mode is configuration context, not a live status metric.\n\nUse `cscli alerts list` / `cscli alerts inspect <ID> --details` in `deployment/crowdsec-lapi` for IPs and request evidence. Source/parser counters reset on restart; charts use rates or increases. Unparsed lines include Traefik startup and operational logs."
          }
        },
        {
          "id": 2,
          "title": "LAPI up",
          "type": "stat",
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 4,
            "h": 4
          },
          "description": "1 = scrape succeeds; 0 = scrape fails.",
          "datasource": {
            "type": "prometheus",
            "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "up{job=\"crowdsec\",instance=\"crowdsec-service.crowdsec.svc.cluster.local:6060\"}",
              "legendFormat": "",
              "datasource": {
                "type": "prometheus",
                "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
              },
              "editorMode": "code",
              "range": false,
              "instant": true,
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {},
              "decimals": 0,
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red"
                    },
                    "1": {
                      "text": "UP",
                      "color": "green"
                    }
                  }
                }
              ],
              "noValue": "NO DATA"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "orientation": "auto"
          }
        },
        {
          "id": 3,
          "title": "Agent up",
          "type": "stat",
          "gridPos": {
            "x": 4,
            "y": 4,
            "w": 4,
            "h": 4
          },
          "description": "1 = scrape succeeds; verify source panels for actual ingestion.",
          "datasource": {
            "type": "prometheus",
            "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "up{job=\"crowdsec\",instance=\"crowdsec-agent-service.crowdsec.svc.cluster.local:6060\"}",
              "legendFormat": "",
              "datasource": {
                "type": "prometheus",
                "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
              },
              "editorMode": "code",
              "range": false,
              "instant": true,
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {},
              "decimals": 0,
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red"
                    },
                    "1": {
                      "text": "UP",
                      "color": "green"
                    }
                  }
                }
              ],
              "noValue": "NO DATA"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "orientation": "auto"
          }
        },
        {
          "id": 4,
          "title": "Parsed requests \u00b7 selected range",
          "type": "stat",
          "gridPos": {
            "x": 8,
            "y": 4,
            "w": 4,
            "h": 4
          },
          "description": "Successfully parsed events in the selected time range.",
          "datasource": {
            "type": "prometheus",
            "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(cs_parser_hits_ok_total{job=\"crowdsec\"}[$__range]))",
              "legendFormat": "",
              "datasource": {
                "type": "prometheus",
                "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
              },
              "editorMode": "code",
              "range": false,
              "instant": true,
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {},
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "orientation": "auto"
          }
        },
        {
          "id": 5,
