              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {},
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "orientation": "auto"
          }
        },
        {
          "id": 8,
          "title": "Incoming log lines by Traefik replica",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "description": "Includes access logs and operational logs read from each public Traefik replica.",
          "datasource": {
            "type": "prometheus",
            "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (source) (rate(cs_kubernetessource_hits_total{job=\"crowdsec\"}[$__rate_interval]))",
              "legendFormat": "{{source}}",
              "datasource": {
                "type": "prometheus",
                "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
              },
              "editorMode": "code",
              "range": true,
              "instant": false,
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 9,
          "title": "Parsed and unparsed lines",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
