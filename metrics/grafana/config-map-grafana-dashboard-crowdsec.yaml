              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {},
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "orientation": "auto"
          }
        },
        {
          "id": 6,
          "title": "Recorded alerts",
          "type": "stat",
          "gridPos": {
            "x": 16,
            "y": 4,
            "w": 4,
            "h": 4
          },
          "description": "The exporter may omit this metric until the first alert. Zero is shown only while LAPI scrape is healthy.",
          "datasource": {
            "type": "prometheus",
            "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(cs_alerts{job=\"crowdsec\"}) or (0 * max(up{job=\"crowdsec\",instance=\"crowdsec-service.crowdsec.svc.cluster.local:6060\"} == 1))",
              "legendFormat": "",
              "datasource": {
                "type": "prometheus",
                "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
              },
              "editorMode": "code",
              "range": false,
              "instant": true,
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {},
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "orientation": "auto"
          }
        },
        {
          "id": 7,
          "title": "Active decisions",
          "type": "stat",
          "gridPos": {
            "x": 20,
            "y": 4,
            "w": 4,
            "h": 4
          },
          "description": "Simulation decisions are not enforced. Missing series are zero only while LAPI scrape is healthy.",
          "datasource": {
            "type": "prometheus",
            "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(cs_active_decisions{job=\"crowdsec\"}) or (0 * max(up{job=\"crowdsec\",instance=\"crowdsec-service.crowdsec.svc.cluster.local:6060\"} == 1))",
              "legendFormat": "",
              "datasource": {
                "type": "prometheus",
                "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
              },
              "editorMode": "code",
              "range": false,
