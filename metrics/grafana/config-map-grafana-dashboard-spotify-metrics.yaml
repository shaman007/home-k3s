---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-spotify-metrics
  namespace: monitoring
data:
  spotify-metrics.json: |-
    {
      "uid": "spotify-metrics",
      "title": "Your Spotify Metrics",
      "description": "Authenticated native server/runtime metrics. HTTP/import/ingestion counters are event-dependent and may be absent until the first event after restart. Empty counters are not presented as successful zeros.",
      "tags": [
        "homelab",
        "monitoring-audit"
      ],
      "schemaVersion": 41,
      "version": 1,
      "editable": true,
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timezone": "browser",
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Metrics target health",
          "datasource": {
            "type": "prometheus",
            "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "up{job=\"spotify\"}",
              "legendFormat": "target",
              "range": true
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Resident memory",
          "datasource": {
            "type": "prometheus",
            "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "process_resident_memory_bytes{job=\"spotify\"}",
              "legendFormat": "memory",
              "range": true
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Process CPU cores",
          "datasource": {
            "type": "prometheus",
            "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
          },
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "cores",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "rate(process_cpu_seconds_total{job=\"spotify\"}[$__rate_interval])",
              "legendFormat": "CPU",
              "range": true
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Node.js used heap",
          "datasource": {
            "type": "prometheus",
            "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
          },
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "nodejs_heap_size_used_bytes{job=\"spotify\"}",
              "legendFormat": "heap",
              "range": true
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Node.js event loop p99",
          "datasource": {
            "type": "prometheus",
            "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
          },
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "nodejs_eventloop_lag_p99_seconds{job=\"spotify\"}",
              "legendFormat": "p99",
              "range": true
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Application HTTP requests",
          "datasource": {
            "type": "prometheus",
            "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
          },
          "gridPos": {
            "x": 12,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_requests_total{job=\"spotify\"}[$__rate_interval]))",
              "legendFormat": "requests",
              "range": true
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Tracks ingested",
          "datasource": {
            "type": "prometheus",
            "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
          },
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(ingested_tracks_total{job=\"spotify\"}[$__rate_interval]))",
              "legendFormat": "tracks",
              "range": true
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Imports in 24 hours",
          "datasource": {
            "type": "prometheus",
            "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
          },
          "gridPos": {
            "x": 12,
            "y": 24,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(imports_total{job=\"spotify\"}[24h]))",
              "legendFormat": "imports",
              "range": true
            }
          ]
        }
      ],
      "templating": {
        "list": []
      }
    }
