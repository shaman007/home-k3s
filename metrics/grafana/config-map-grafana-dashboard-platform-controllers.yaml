          ]
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Argo repository requests",
          "datasource": {
            "type": "prometheus",
            "uid": "ed6c70f1-51fe-45d9-9fd0-74971e3d2fd4"
          },
          "gridPos": {
