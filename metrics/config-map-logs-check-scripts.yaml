    #!/usr/bin/env python3
    """Seed the scheduled daily baseline after an off-schedule verification report."""
    import concurrent.futures
    from datetime import datetime, timedelta
    import json
    import runpy
    from zoneinfo import ZoneInfo

    m = runpy.run_path('/scripts/logs-check.py', run_name='history_seed')
    end = datetime.fromisoformat(m['env']('HISTORY_BASELINE_END', required=True)).astimezone(
        ZoneInfo(m['env']('REPORT_TIMEZONE', 'Europe/Prague')))
    if end > datetime.now(ZoneInfo('UTC')):
        raise RuntimeError('Cannot seed a future baseline')
    start = end - timedelta(hours=m['env_int']('LOOKBACK_HOURS', 24))
    namespace, name = m['env']('REPORT_NAMESPACE', 'monitoring'), m['env']('REPORT_CONFIGMAP_NAME', 'logs-check-report')
    path = f'/api/v1/namespaces/{namespace}/configmaps/{name}'
    parent = m['kube_json'](path)
    report = json.loads(parent['data']['report.json'])
    queries = report['queries']
    source_start, source_end = (datetime.fromisoformat(report[key]) for key in ('window_start', 'window_end'))
    left, right = max(start, source_start), min(end, source_end)
    can_reuse = (left < right and report.get('pattern_history_complete', False)
                 and report.get('preflight', {}).get('collection', {}).get('ok', False)
                 and set(report.get('raw_entry_counts', {})) == set(queries)
                 and set(report.get('entry_counts', {})) == set(queries))
    if can_reuse:
        counts = m['load_pattern_counts'](report)
        raw_counts, entry_counts = dict(report['raw_entry_counts']), dict(report['entry_counts'])
        intervals = [(1, start, left), (1, right, end),
                     (-1, source_start, left), (-1, right, source_end)]
    else:
        counts = {}
        raw_counts, entry_counts = {key: 0 for key in queries}, {key: 0 for key in queries}
        intervals = [(1, start, end)]
    def collect(task):
        sign, bucket, left, right = task
        rows = m['loki_query_range'](queries[bucket], int(left.timestamp()*1e9), int(right.timestamp()*1e9)-1, limit=0)
        raw = len(rows)
        grouped = m['filter_false_positives']({bucket: rows})[0]
        found, descriptions = m['count_patterns'](grouped)
        return sign, bucket, raw, len(grouped[bucket]), found

    tasks = []
    for sign, begin, finish in intervals:
        cursor = begin
        while cursor < finish:
            stop = min(cursor+timedelta(hours=1), finish)
            tasks.extend((sign, bucket, cursor, stop) for bucket in queries)
            cursor = stop
    with concurrent.futures.ThreadPoolExecutor(max_workers=4) as executor:
        pending = {executor.submit(collect, task) for task in tasks}
        completed = 0
        while pending:
            done, pending = concurrent.futures.wait(pending, return_when=concurrent.futures.FIRST_COMPLETED)
            for future in done:
                sign, bucket, raw, kept, found = future.result()
                raw_counts[bucket] += sign * raw
                entry_counts[bucket] += sign * kept
                for key, value in found.items():
                    counts[key] = counts.get(key, 0) + sign * value
                completed += 1
                if completed % 12 == 0 or completed == len(tasks):
                    print(f'scheduled baseline collection completed={completed}/{len(tasks)}', flush=True)
    if any(value < 0 for value in counts.values()) or any(value < 0 for value in entry_counts.values()) or any(value < 0 for value in raw_counts.values()):
        raise RuntimeError('Source history changed while deriving the scheduled baseline')
    counts = {key: value for key, value in counts.items() if value}
    if sum(counts.values()) != sum(entry_counts.values()):
        raise RuntimeError('Derived pattern totals differ from collected entry totals')
    ref = m['store_pattern_counts'](counts, parent['metadata'], start.isoformat(), end.isoformat())
    report['recurrence_baseline'] = {
        'window_start': start.isoformat(), 'window_end': end.isoformat(),
        'pattern_history_storage': ref, 'pattern_history_complete': True,
        'preflight': {'collection': {'ok': True}},
        'raw_entry_counts': raw_counts, 'entry_counts': entry_counts}
    latest = m['kube_json'](path)
    if latest['data']['report.json'] != parent['data']['report.json']:
        raise RuntimeError('Report changed during scheduled baseline collection')
    m['upsert_report'](name, parent['data']['report.txt'], report,
                       expected_resource_version=latest['metadata']['resourceVersion'])
    saved = json.loads(m['kube_json'](path)['data']['report.json'])
    assert m['load_pattern_counts'](saved['recurrence_baseline']) == counts
    details = {key: ('verification', 'history', 'pattern', key) for key in counts}
    _, comparison, complete = m['compare_pattern_history'](counts, details, name, end, end+(end-start))
    assert complete and f'0 newly observed sampled patterns; {len(counts)} recurring sampled patterns.' in comparison
    print(json.dumps({'window_start': start.isoformat(), 'window_end': end.isoformat(),
                      'patterns': len(counts), 'reused_complete_snapshot': can_reuse,
                      'next_scheduled_baseline_selection_verified': True}, indent=2), flush=True)
