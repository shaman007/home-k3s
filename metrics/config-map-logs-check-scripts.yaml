    #!/usr/bin/env python3
    """Rebuild adjacent complete history snapshots without repeating LLM analysis."""
    import concurrent.futures
    from datetime import datetime, timedelta
    import json
    import re
    import runpy
    from zoneinfo import ZoneInfo

    m = runpy.run_path('/scripts/logs-check.py', run_name='history_rebuild')
    g = m['pattern_history'].__globals__
    namespace = m['env']('REPORT_NAMESPACE', 'monitoring')
    name = m['env']('REPORT_CONFIGMAP_NAME', 'logs-check-report')
    path = f'/api/v1/namespaces/{namespace}/configmaps/{name}'
    parent = m['kube_json'](path)
    report = json.loads(parent['data']['report.json'])
    start, end = (datetime.fromisoformat(report[key]) for key in ('window_start', 'window_end'))
    windows = [(start - (end-start), start), (start, end)]
    # Use exactly the same queries as the saved, fully analysed report.
    queries = report['queries']
    counts, details = [{}, {}], [{}, {}]
    filtered_counts = [{key: 0 for key in queries} for _ in windows]
    raw_counts = [{key: 0 for key in queries} for _ in windows]

    def collect(task):
        window, bucket, cursor, stop = task
        entries = m['loki_query_range'](queries[bucket], int(cursor.timestamp()*1e9), int(stop.timestamp()*1e9)-1, limit=0)
        raw = len(entries)
        grouped = m['filter_false_positives']({bucket: entries})[0]
        found, descriptions = m['count_patterns'](grouped)
        return window, bucket, raw, len(grouped[bucket]), found, descriptions

    tasks = []
    for window, (left, right) in enumerate(windows):
        cursor = left
        while cursor < right:
            stop = min(cursor+timedelta(hours=1), right)
            tasks.extend((window, bucket, cursor, stop) for bucket in queries)
            cursor = stop
    with concurrent.futures.ThreadPoolExecutor(max_workers=4) as executor:
        pending = {executor.submit(collect, task) for task in tasks}
        completed = 0
        while pending:
            done, pending = concurrent.futures.wait(pending, return_when=concurrent.futures.FIRST_COMPLETED)
            for future in done:
                window, bucket, raw, kept, found, descriptions = future.result()
                raw_counts[window][bucket] += raw
                filtered_counts[window][bucket] += kept
                for key, value in found.items():
                    counts[window][key] = counts[window].get(key, 0) + value
                if window == 1:
                    details[window].update(descriptions)
                completed += 1
                if completed % 12 == 0 or completed == len(tasks):
                    print(f'history collection completed={completed}/{len(tasks)}', flush=True)
    # No partial baseline is published if any Loki query failed.
    if filtered_counts[1] != report['entry_counts']:
        raise RuntimeError(f'Rebuilt current window differs from analysed counts: {filtered_counts[1]} versus {report["entry_counts"]}')
    old_ref = m['store_pattern_counts'](counts[0], parent['metadata'], windows[0][0].isoformat(), start.isoformat())
    virtual_name = name + '-verification-baseline'
    virtual_path = f'/api/v1/namespaces/{namespace}/configmaps/{virtual_name}'
    baseline = {'window_start': windows[0][0].isoformat(), 'window_end': start.isoformat(),
                'pattern_history_storage': old_ref, 'pattern_history_complete': True,
                'preflight': {'collection': {'ok': True}}}
    real_api = g['kube_json']
    def api(request_path, **kwargs):
        if request_path == virtual_path and kwargs.get('method', 'GET') == 'GET':
            return {'data': {'report.json': json.dumps(baseline)}}
        return real_api(request_path, **kwargs)
    g['kube_json'] = api
    _, changes, complete = m['compare_pattern_history'](counts[1], details[1], virtual_name, start, end)
    assert complete and 'recurring sampled patterns.' in changes
    assert 'Baseline unavailable' not in changes
    report['pattern_counts'] = counts[1]
    report['pattern_history_complete'] = complete
    report['previous_pattern_history_storage'] = old_ref
    report['history_rebuild'] = {'completed_at': datetime.now(ZoneInfo('UTC')).isoformat(),
                               'baseline_pattern_count': len(counts[0]), 'current_pattern_count': len(counts[1]),
                               'newly_observed': len(counts[1].keys()-counts[0].keys()),
                               'recurring': len(counts[1].keys() & counts[0].keys()),
                               'raw_counts': raw_counts, 'filtered_counts': filtered_counts,
                               'collection_complete': True}
    def replace_changes(text):
        updated, replaced = re.subn(r'## Pattern changes\n.*?(?=\n\n## Analyst notes)', lambda _: changes,
                                    text, count=1, flags=re.S)
        if replaced != 1:
            raise RuntimeError('Cannot find existing pattern comparison section')
        return updated
    report['analysis'] = replace_changes(report['analysis'])
    text = replace_changes(parent['data']['report.txt'])
    latest = real_api(path)
    if latest['data']['report.json'] != parent['data']['report.json']:
        raise RuntimeError('Report changed during history rebuild')
    m['upsert_report'](name, text, report, expected_resource_version=latest['metadata']['resourceVersion'])
    saved = json.loads(real_api(path)['data']['report.json'])
    assert m['load_pattern_counts'](saved) == counts[1]
    assert len(counts[1]) > 2000
    assert m['load_pattern_counts']({'pattern_history_storage': saved['previous_pattern_history_storage']}) == counts[0]
    print(json.dumps(report['history_rebuild'], indent=2), flush=True)
    print('Complete adjacent-window history and recurrence verified.', flush=True)

