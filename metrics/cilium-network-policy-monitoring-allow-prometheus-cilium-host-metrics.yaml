apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: monitoring-allow-prometheus-cilium-host-metrics
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app: prometheus-server
  egress:
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            # node-exporter uses the host network to collect node interfaces.
            - port: "9100"
              protocol: TCP
            - port: "9963"
              protocol: TCP
            - port: "9964"
              protocol: TCP
            - port: "9965"
              protocol: TCP
            - port: "9962"
              protocol: TCP
            - port: "9120"
              protocol: TCP
            - port: "9140"
              protocol: TCP
            - port: "9141"
              protocol: TCP
