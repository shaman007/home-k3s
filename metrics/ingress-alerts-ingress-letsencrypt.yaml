---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alerts-ingress-letsencrypt
  namespace: monitoring
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: traefik-internal-clients-only@kubernetescrd,traefik-admin-oidc@kubernetescrd
spec:
  ingressClassName: traefik-private
  tls:
  - hosts:
    - alerts.int.andreybondarenko.com
    secretName: alerts-letsencrypt-internal-tls
  rules:
  - host: alerts.int.andreybondarenko.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: alertmanager
            port:
              number: 9093
