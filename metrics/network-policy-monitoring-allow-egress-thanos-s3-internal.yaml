apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-allow-egress-thanos-s3-internal
  namespace: monitoring
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - prometheus-server
      - thanos-store-gateway
      - thanos-compactor
      - thanos-receive
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: seaweedfs
      podSelector:
        matchLabels:
          app: seaweedfs-s3
    ports:
    - protocol: TCP
      port: 8333
