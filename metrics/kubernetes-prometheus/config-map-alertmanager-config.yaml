---
kind: ConfigMap
apiVersion: v1
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  config.yml: |-
    global:
    templates:
    - '/etc/alertmanager-templates/*.tmpl'
    route:
      receiver: alert-emailer
      group_by: ['alertname', 'priority', 'namespace', 'job']
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 4h
      routes:
      - receiver: alert-emailer
        matchers: ['priority="critical"']
        repeat_interval: 30m

    receivers:
    - name: alert-emailer
      email_configs:
      - to: me@andreybondarenko.com
        send_resolved: false
        from: alert@andreybondarenko.com
        smarthost: traefik.traefik.svc.cluster.local:587
        require_tls: false
        text: '{{ template "email.default.text" . }}'
