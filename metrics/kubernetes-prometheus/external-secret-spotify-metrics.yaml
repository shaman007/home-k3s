apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prometheus-spotify-metrics
  namespace: monitoring
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-secret-store
    kind: SecretStore
  target:
    name: prometheus-spotify-metrics
    creationPolicy: Owner
  data:
  - secretKey: token
    remoteRef:
      key: monitoring
      property: SPOTIFY_METRICS_PASSWORD
