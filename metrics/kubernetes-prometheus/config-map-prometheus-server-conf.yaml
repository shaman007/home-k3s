apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-server-conf
  labels:
    name: prometheus-server-conf
  namespace: monitoring
data:
  prometheus.rules: |-
    groups:
    - name: alerts
      rules:
      - alert: High Node Memory
        expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 90
        for: 3m
        labels:
          severity: mail
          owner: homelab
          priority: warning
        annotations:
          summary: High Memory Usage
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
          description: Inspect this resource and its recent events; see the linked runbook before making changes.
      - alert: High Swap Usage
        expr: ((node_memory_SwapTotal_bytes{host!="fedora"} - node_memory_SwapFree_bytes{host!="fedora"})/node_memory_SwapTotal_bytes{host!="fedora"})*100 > 40
        for: 3m
        labels:
          severity: mail
          owner: homelab
          priority: warning
        annotations:
          summary: High Swap Usage
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
          description: Inspect this resource and its recent events; see the linked runbook before making changes.
      - alert: NodeLoadHigh
        expr: node_load5 / on(instance,job) count by(instance,job) (node_cpu_seconds_total{mode="idle"}) > 2
        for: 5m
        labels:
          severity: mail
          owner: homelab
          priority: warning
        annotations:
          summary: Load exceeds twice the logical CPU count.
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
          description: Inspect this resource and its recent events; see the linked runbook before making changes.
      - alert: High Filesystem Usage
        expr: 100 * (1 - node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"}) > 85
        for: 3m
        labels:
          severity: mail
          owner: homelab
          priority: warning
        annotations:
          summary: High Filesystem Usage
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
          description: Inspect this resource and its recent events; see the linked runbook before making changes.
      - alert: Mysql is down
        expr: mysql_up < 1
        for: 1m
        labels:
          severity: mail
          owner: homelab
          priority: critical
        annotations:
          summary: Mysql is down
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
          description: Inspect this resource and its recent events; see the linked runbook before making changes.
      - alert: VaultMetricsTargetDown
        expr: up{job="openbao"} == 0 or absent(up{job="openbao"})
        for: 1m
        labels:
          severity: mail
          owner: homelab
          priority: critical
        annotations:
          summary: Vault metrics target is down.
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
          description: Inspect this resource and its recent events; see the linked runbook before making changes.
      - alert: VaultSealed
        expr: vault_core_unsealed{job="openbao"} == 0
        for: 1m
        labels:
          severity: mail
          owner: homelab
          priority: critical
        annotations:
          summary: Vault is sealed.
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
          description: Inspect this resource and its recent events; see the linked runbook before making changes.
      - alert: Postgresql-bitwarden is down
        expr: pg_up{instance="bitwarden-postgres-metrics.bitwarden.svc.cluster.local:9187", job="postgres-bitwarden"} < 1
        for: 1m
        labels:
          severity: mail
          owner: homelab
          priority: critical
        annotations:
          summary: Postgresql-bitwarden is down
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
          description: Inspect this resource and its recent events; see the linked runbook before making changes.
      - alert: Postgresql-keycloak is down
        expr: pg_up{instance="keycloak-postgres-metrics.keycloak.svc.cluster.local:9187", job="postgres-keycloak"} < 1
        for: 1m
        labels:
          severity: mail
          owner: homelab
          priority: critical
        annotations:
          summary: Postgresql-keycloak is down
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
          description: Inspect this resource and its recent events; see the linked runbook before making changes.
      - alert: Postgresql-dawarich is down
        expr: pg_up{instance="dawarich-postgres-metrics.dawarich.svc.cluster.local:9187", job="postgres-dawarich"} < 1
        for: 1m
        labels:
          severity: mail
          owner: homelab
          priority: critical
        annotations:
          summary: Postgresql-dawarich is down
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
          description: Inspect this resource and its recent events; see the linked runbook before making changes.
      - alert: Postgresql-mastodon is down
        expr: pg_up{instance="mastodon-postgres-metrics.mastodon.svc.cluster.local:9187", job="postgres-mastodon"} < 1
        for: 1m
        labels:
          severity: mail
          owner: homelab
          priority: critical
        annotations:
          summary: Postgresql-mastodon is down
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
          description: Inspect this resource and its recent events; see the linked runbook before making changes.
      - alert: KubeJobFailed
        expr: '(kube_job_failed{job="kube-state-metrics",condition="true",namespace=~".*"} > 0)

          and on (namespace, job_name)

          ((time() - kube_job_status_start_time{job="kube-state-metrics",namespace=~".*"}) < 3600)

          '
        for: 10m
        labels:
          severity: mail
          owner: homelab
          priority: warning
        annotations:
          summary: Job failed to complete.
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
          description: Inspect this resource and its recent events; see the linked runbook before making changes.
      - alert: TalosEtcdBackupMissing
        expr: "(time() - kube_cronjob_status_last_successful_time{namespace=\"talos-backup\",cronjob=\"talos-backup\"} > 7200)\nor\n(kube_cronjob_info{namespace=\"talos-backup\",cronjob=\"\
          talos-backup\"}\n  unless on (namespace, cronjob)\n  kube_cronjob_status_last_successful_time{namespace=\"talos-backup\",cronjob=\"talos-backup\"})\nor\nabsent(kube_cronjob_info{namespace=\"\
          talos-backup\",cronjob=\"talos-backup\"})\n"
        for: 10m
        labels:
          severity: mail
          owner: homelab
          priority: critical
        annotations:
          summary: Talos etcd backup has no successful scheduled run in the last two hours.
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
          description: Inspect this resource and its recent events; see the linked runbook before making changes.
      - alert: TalosEtcdBackupSuspended
        expr: kube_cronjob_spec_suspend{namespace="talos-backup",cronjob="talos-backup"} == 1
        for: 15m
        labels:
          severity: mail
          owner: homelab
          priority: warning
        annotations:
          summary: Talos etcd backup scheduling is suspended.
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
          description: Inspect this resource and its recent events; see the linked runbook before making changes.
      - alert: CPUThrottlingHigh
        expr: sum by (cluster, container, pod, namespace) (increase(container_cpu_cfs_throttled_periods_total{container!=""}[5m])) / sum by (cluster, container, pod, namespace) (increase(container_cpu_cfs_periods_total[5m]))
          > (25 / 100)
        for: 5m
        labels:
          severity: mail
          owner: homelab
          priority: warning
        annotations:
          summary: Processes experience elevated CPU throttling.
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
          description: Inspect this resource and its recent events; see the linked runbook before making changes.
      - alert: KubePodCrashLooping
        expr: max_over_time(kube_pod_container_status_waiting_reason{job="kube-state-metrics",namespace=~".*",reason="CrashLoopBackOff"}[5m]) >= 1
        for: 5m
        labels:
          severity: mail
          owner: homelab
          priority: warning
        annotations:
          summary: Pod is crash looping.
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
          description: Inspect this resource and its recent events; see the linked runbook before making changes.
      - alert: KubePodNotReady
        expr: (max by(namespace,pod) (kube_pod_status_ready{condition="true"} == 0) and on(namespace,pod) max by(namespace,pod) (kube_pod_owner{owner_kind!="Job"})) unless on(namespace,pod)
          kube_pod_deletion_timestamp
        for: 15m
        labels:
          severity: mail
          owner: homelab
          priority: warning
        annotations:
          summary: Pod has been in a non-ready state for more than 15 minutes.
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
          description: Inspect this resource and its recent events; see the linked runbook before making changes.
      - alert: KubeNodeNotReady
        expr: kube_node_status_condition{condition="Ready",job="kube-state-metrics",status="true"} == 0
        for: 1m
        labels:
          severity: mail
          owner: homelab
          priority: critical
        annotations:
          summary: Node is not ready.
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
          description: Inspect this resource and its recent events; see the linked runbook before making changes.
      - alert: KubeNodeUnreachable
        expr: (kube_node_spec_taint{effect="NoSchedule",job="kube-state-metrics",key="node.kubernetes.io/unreachable"} unless ignoring (key, value) kube_node_spec_taint{job="kube-state-metrics",key=~"ToBeDeletedByClusterAutoscaler|cloud.google.com/impending-node-termination|aws-node-termination-handler/spot-itn"})
          == 1
        for: 1m
        labels:
          severity: mail
          owner: homelab
          priority: critical
        annotations:
          summary: Node is unreachable.
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
          description: Inspect this resource and its recent events; see the linked runbook before making changes.
      - alert: TargetDown
        expr: 100 * (count by (cluster, job, namespace, service) (up{alert_on_down!="false"} == 0) / count by (cluster, job, namespace, service) (up{alert_on_down!="false"})) > 10
        for: 1m
        labels:
          severity: mail
          owner: homelab
          priority: warning
        annotations:
          summary: One or more targets are unreachable.
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
          description: Inspect this resource and its recent events; see the linked runbook before making changes.
      - alert: PVC is full!
        expr: max by (namespace, persistentvolumeclaim) (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) > 0.95
        for: 1m
        labels:
          severity: mail
          pvc: '{{ $labels.persistentvolumeclaim }}'
          pvc_namespace: '{{ $labels.namespace }}'
          owner: homelab
          priority: critical
        annotations:
          summary: One or more PVC is >95% utilized.
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
          description: Inspect this resource and its recent events; see the linked runbook before making changes.
