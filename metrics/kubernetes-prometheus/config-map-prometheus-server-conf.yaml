          cronjob: backup-daily-retain11
      - record: homelab_expected_backup_cronjob
        expr: vector(1)
        labels:
          namespace: longhorn-system
          cronjob: backup-daily-retain30
      - record: homelab_expected_backup_cronjob
        expr: vector(1)
        labels:
          namespace: longhorn-system
          cronjob: backup-daily-retain31-a
      - record: homelab_expected_backup_cronjob
        expr: vector(1)
        labels:
          namespace: longhorn-system
          cronjob: backup-daily-retain31-b
      - record: homelab_expected_backup_cronjob
        expr: vector(1)
        labels:
          namespace: longhorn-system
          cronjob: backup-daily-retain31-c
      - record: homelab_expected_backup_cronjob
        expr: vector(1)
        labels:
          namespace: longhorn-system
          cronjob: backup-monthly-retain60-hister
      - record: homelab_expected_backup_cronjob
        expr: vector(1)
        labels:
          namespace: longhorn-system
          cronjob: backup-monthly-retain60-mempalace
    - name: homelab-platform
      interval: 30s
      rules:
      - alert: ExpectedScrapeJobMissing
        expr: homelab_expected_scrape_job unless on(job) count by(job) (up)
        for: 10m
        labels:
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: An expected scrape job disappeared from discovery.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: PrometheusNotificationFailures
        expr: increase(prometheus_notifications_errors_total[10m]) > 0 or increase(prometheus_notifications_dropped_total[10m]) > 0
        for: 5m
        labels:
          severity: mail
          priority: critical
          owner: homelab
        annotations:
          summary: Prometheus cannot reliably deliver alerts.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: AlertmanagerNotificationFailures
        expr: increase(alertmanager_notifications_failed_total[10m]) > 0
        for: 5m
        labels:
          severity: mail
          priority: critical
          owner: homelab
        annotations:
          summary: Alertmanager notification delivery is failing.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: AlertmanagerPeersMissing
        expr: alertmanager_cluster_members < 3
        for: 10m
        labels:
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: Alertmanager has fewer than three peers.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: AlertmanagerDiscoveryEmpty
        expr: prometheus_notifications_alertmanagers_discovered == 0
        for: 5m
        labels:
          severity: mail
          priority: critical
          owner: homelab
        annotations:
          summary: Prometheus has no Alertmanager.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: CertificateExpiring
        expr: (min by(namespace,name) (certmanager_certificate_expiration_timestamp_seconds) - time()) < 5 * 86400
        for: 10m
        labels:
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: Certificate expires within five days.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: CertificateNotReady
        expr: max by(namespace,name) (certmanager_certificate_ready_status{condition="True"}) == 0
        for: 15m
        labels:
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: Certificate remains not ready.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: ExternalSecretNotReady
        expr: max by(namespace,name) (externalsecret_status_condition{condition="Ready",status="True"}) == 0
        for: 10m
        labels:
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: Secret reconciliation is not ready.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: SecretStoreNotReady
        expr: max by(namespace,name) (secretstore_status_condition{condition="Ready",status="True"}) == 0
        for: 10m
        labels:
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: Secret reconciliation is not ready.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: ClusterSecretStoreNotReady
        expr: max by(namespace,name) (clustersecretstore_status_condition{condition="Ready",status="True"}) == 0
        for: 10m
        labels:
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: Secret reconciliation is not ready.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: ExternalSecretReconcileErrors
        expr: sum by(namespace,name) (increase(externalsecret_sync_calls_error[15m])) > 5
        for: 10m
        labels:
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: External Secret has repeated reconciliation errors.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: DeploymentReplicasUnavailable
        expr: kube_deployment_spec_replicas - kube_deployment_status_replicas_available > 0
        for: 15m
        labels:
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: Deployment has fewer available replicas than desired.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: StatefulSetReplicasUnavailable
        expr: kube_statefulset_replicas - kube_statefulset_status_replicas_ready > 0
        for: 15m
        labels:
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: StatefulSet has fewer ready replicas than desired.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: DaemonSetReplicasUnavailable
        expr: kube_daemonset_status_desired_number_scheduled - kube_daemonset_status_number_available > 0
        for: 15m
        labels:
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: DaemonSet has fewer available pods than desired.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: DeploymentRolloutStuck
        expr: kube_deployment_status_condition{condition="Progressing",status="false"} == 1
        for: 10m
        labels:
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: Deployment exceeded its rollout deadline.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: ArgoApplicationUnhealthy
        expr: argocd_app_info{health_status=~"Degraded|Missing|Unknown"} == 1
        for: 15m
        labels:
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: Argo application health is degraded.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: ArgoApplicationOutOfSync
        expr: argocd_app_info{sync_status="OutOfSync"} == 1
        for: 30m
        labels:
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: Argo application remains out of sync.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: ArgoApplicationSyncFailed
        expr: argocd_app_info{phase=~"Failed|Error"} == 1
        for: 15m
        labels:
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: Argo application sync failed.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: PVCUsageWarning
        expr: max by(namespace,persistentvolumeclaim) (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) > 0.85 and max by(namespace,persistentvolumeclaim) (kubelet_volume_stats_used_bytes
          / kubelet_volume_stats_capacity_bytes) <= 0.95
        for: 15m
        labels:
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: PVC usage exceeds 85%.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: PVCInodesLow
        expr: max by(namespace,persistentvolumeclaim) (kubelet_volume_stats_inodes_used / kubelet_volume_stats_inodes) > 0.90
        for: 15m
        labels:
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: PVC inode usage exceeds 90%.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: PVCExhaustionPredicted
        expr: (predict_linear(kubelet_volume_stats_available_bytes[6h], 86400) < 0) and (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes > 0.70)
        for: 1h
        labels:
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: PVC may exhaust capacity within 24 hours.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: LonghornVolumeDegraded
        expr: max by(volume,pvc,pvc_namespace) (longhorn_volume_robustness{state="degraded"}) == 1
        for: 15m
        labels:
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: Longhorn volume has reduced replica redundancy.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: LonghornVolumeFaulted
        expr: max by(volume,pvc,pvc_namespace) (longhorn_volume_robustness{state="faulted"}) == 1
        for: 5m
        labels:
          severity: mail
          priority: critical
          owner: homelab
        annotations:
          summary: Longhorn volume is faulted.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: LonghornBackupStale
        expr: ((time() - kube_cronjob_status_last_successful_time) > on(namespace,cronjob) homelab_backup_max_age_seconds) and on(namespace,cronjob) (kube_cronjob_spec_suspend == 0)
        for: 30m
        labels:
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: Longhorn backup is overdue for its daily or monthly schedule.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: LonghornBackupNeverSucceeded
        expr: ((time() - kube_cronjob_created) > on(namespace,cronjob) homelab_backup_max_age_seconds) unless on(namespace,cronjob) kube_cronjob_status_last_successful_time
        for: 30m
        labels:
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: Scheduled Longhorn backup has never succeeded.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: LonghornBackupSuspended
        expr: kube_cronjob_spec_suspend{namespace="longhorn-system",cronjob=~"backup-.*"} == 1
        for: 30m
        labels:
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: Longhorn backup schedule is suspended.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: RedisUnavailable
        expr: redis_up == 0
        for: 5m
        labels:
          severity: mail
          priority: critical
          owner: homelab
        annotations:
          summary: Redis or Valkey is unavailable.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: RedisConnectionsRejected
        expr: increase(redis_rejected_connections_total[10m]) > 0
        for: 10m
        labels:
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: Redis or Valkey is rejecting connections.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: RedisMemoryNearLimit
        expr: (redis_memory_used_bytes / redis_memory_max_bytes > 0.90) and (redis_memory_max_bytes > 0)
        for: 15m
        labels:
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: Redis memory exceeds 90% of its configured limit.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: RedisEvictions
        expr: increase(redis_evicted_keys_total[15m]) > 100
        for: 15m
        labels:
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: Redis is evicting more than 100 keys per fifteen minutes.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: PostgresConnectionsHigh
        expr: sum by(job,instance) (pg_stat_database_numbackends) / on(job,instance) pg_settings_max_connections > 0.80
        for: 15m
        labels:
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: PostgreSQL connections exceed 80% of capacity.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: PostgresReplicationLag
        expr: pg_replication_lag_seconds > 60 and on(job,instance) (pg_replication_is_replica == 1)
        for: 10m
        labels:
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: PostgreSQL replica is more than sixty seconds behind.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: MysqlConnectionsHigh
        expr: mysql_global_status_threads_connected / mysql_global_variables_max_connections > 0.80
        for: 15m
        labels:
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: MySQL connections exceed 80% of capacity.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: TraefikHigh5xx
        expr: (sum by(service) (rate(traefik_service_requests_total{code=~"5.."}[10m])) / sum by(service) (rate(traefik_service_requests_total[10m])) > 0.05) and (sum by(service) (increase(traefik_service_requests_total[10m]))
          >= 100)
        for: 10m
        labels:
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: Ingress service returns over 5% server errors with at least 100 requests per ten minutes.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: TraefikHighLatency
        expr: (histogram_quantile(0.95, sum by(le,service) (rate(traefik_service_request_duration_seconds_bucket[10m]))) > 3) and (sum by(service) (increase(traefik_service_request_duration_seconds_count[10m]))
          >= 100)
        for: 15m
        labels:
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: Ingress p95 latency exceeds three seconds with at least 100 requests per ten minutes.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: PrometheusRuleFailures
        expr: increase(prometheus_rule_evaluation_failures_total[10m]) > 0
        for: 10m
        labels:
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: Prometheus rule evaluation is failing.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: PrometheusStorageFailures
        expr: increase(prometheus_tsdb_compactions_failed_total[15m]) > 0 or increase(prometheus_tsdb_wal_corruptions_total[15m]) > 0
        for: 10m
        labels:
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: Prometheus storage encountered errors.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: ThanosUploadFailures
        expr: increase(thanos_shipper_upload_failures_total[15m]) > 0
        for: 10m
        labels:
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: Thanos cannot upload blocks.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: ThanosCompactionHalted
        expr: thanos_compact_halted == 1
        for: 10m
        labels:
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: Thanos compaction is halted.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: LokiIngestionLoss
        expr: sum by(job,instance) (increase(loki_discarded_samples_total[15m])) > 0
        for: 10m
        labels:
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: Loki is discarding log samples.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: LokiWalFailure
        expr: increase(loki_ingester_wal_disk_full_failures_total[15m]) > 0 or increase(loki_ingester_wal_corruptions_total[15m]) > 0
        for: 10m
        labels:
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: Loki WAL encountered corruption or a full disk.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: AlloyConfigInvalid
        expr: alloy_config_last_load_successful == 0
        for: 10m
        labels:
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: Alloy failed to load its configuration.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: AlloyLogsDropped
        expr: sum by(job,instance) (increase(loki_write_dropped_entries_total[15m])) > 0
        for: 10m
        labels:
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: Alloy is dropping log entries.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: HubbleEventsLost
        expr: sum by(instance) (rate(hubble_lost_events_total[10m])) > 1
        for: 10m
        labels:
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: Hubble is losing more than one event per second.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: MetalLBConfigStale
        expr: metallb_k8s_client_config_stale_bool == 1
        for: 10m
        labels:
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: MetalLB is using stale configuration.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: BGPNeighborUnavailable
        expr: (max by(node) (kube_pod_info{namespace="metallb-system"} and on(namespace,pod) kube_pod_owner{namespace="metallb-system",owner_kind="DaemonSet",owner_name="metallb-frr-k8s"})) unless on(node) (max by(node) (frrk8s_bgp_session_up{job="metallb",peer="192.168.30.1",vrf="default"} == 1))
        for: 2m
        labels:
          severity: mail
          priority: warning
          owner: homelab
          job: metallb
          component: bgp
        annotations:
          summary: UDM BGP session is down or missing on {{ $labels.node }}.
          description: Expected FRR node has no established IPv4 session to 192.168.30.1. Check exporter health, FRR state and the UDM peer; L2 may still work.
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#bgp
      - alert: BGPServiceRouteUnavailable
        expr: label_join(max by(namespace,service,ip) (kube_service_status_load_balancer_ingress{ip=~"192[.]168[.]30[.](210|211|213)"}), "service", "/", "namespace", "service") unless on(service,ip) (max by(service,ip) ((metallb_speaker_announced{job="metallb",protocol="bgp"} == 1) and on(node) (max by(node) (frrk8s_bgp_session_up{job="metallb",peer="192.168.30.1",vrf="default"} == 1))))
        for: 2m
        labels:
          severity: mail
          priority: critical
          owner: homelab
          job: metallb
          component: bgp
        annotations:
          summary: No usable BGP advertisement for {{ $labels.service }} ({{ $labels.ip }}).
          description: No speaker announces this allocated IPv4 service address through a node with an established UDM session. L2 reachability alone does not clear this condition.
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#bgp
      - alert: FRRConfigUnavailable
        expr: (max by(node) (kube_pod_info{namespace="metallb-system"} and on(namespace,pod) kube_pod_owner{namespace="metallb-system",owner_kind="DaemonSet",owner_name="metallb-frr-k8s"})) unless on(node) max by(node) ((frrk8s_k8s_client_config_loaded_bool{job="metallb"} == 1) and (frrk8s_k8s_client_config_stale_bool{job="metallb"} == 0))
        for: 5m
        labels:
          severity: mail
          priority: warning
          owner: homelab
          job: metallb
          component: bgp
        annotations:
          summary: FRR configuration is stale, unloaded or unobservable on {{ $labels.node }}.
          description: Inspect FRR controller/reloader logs and authenticated metrics on ports 9140/9141. Do not restart nodes or delete service IP pools to clear the alert.
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#bgp
      - alert: BGPPrefixAdvertisementMismatch
        expr: (count by(node) (count by(node,ip) (metallb_speaker_announced{job="metallb",protocol="bgp",ip!~".*:.*"} == 1))) unless on(node) ((max by(node) (frrk8s_bgp_announced_prefixes_total{job="metallb",peer="192.168.30.1",vrf="default"})) == on(node) (count by(node) (count by(node,ip) (metallb_speaker_announced{job="metallb",protocol="bgp",ip!~".*:.*"} == 1))))
        for: 5m
        labels:
          severity: mail
          priority: warning
          owner: homelab
          job: metallb
          component: bgp
        annotations:
          summary: FRR IPv4 prefix count differs from MetalLB intent on {{ $labels.node }}.
          description: The current FRR advertised-prefix gauge must match unique IPv4 addresses announced by the local speaker. Counts vary with ready endpoints; IPv6 stays on L2 and is excluded.
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#bgp
      - alert: BGPUnexpectedReceivedRoutes
        expr: frrk8s_bgp_received_prefixes_total{job="metallb",peer="192.168.30.1",vrf="default"} > 0
        for: 5m
        labels:
          severity: mail
          priority: warning
          owner: homelab
          job: metallb
          component: bgp
        annotations:
          summary: FRR receives unexpected routes from the UDM on {{ $labels.node }}.
          description: This design exports no UDM routes to Kubernetes. Check the UDM outbound route-map and FRR inbound policy before changing routing.
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#bgp
      - alert: UDMBGPCollectionUnavailable
        expr: (unifi_bgp_scrape_success{job="unifi-bgp"} == 0) or (time() - unifi_bgp_last_success_timestamp_seconds{job="unifi-bgp"} > 120) or absent(unifi_bgp_scrape_success{job="unifi-bgp"})
        for: 5m
        labels:
          severity: mail
          priority: warning
          owner: homelab
          job: unifi-bgp
          component: bgp
        annotations:
          summary: UDM BGP route-table monitoring is unavailable.
          description: Check the read-only bgp-exporter sidecar, UniFi credentials and controller API. Failed collection does not reuse old route health.
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#bgp
      - alert: UDMBGPRouteMissing
        expr: (unifi_bgp_route_active_next_hops{job="unifi-bgp"} == 0) and on(instance) (unifi_bgp_scrape_success{job="unifi-bgp"} == 1)
        for: 2m
        labels:
          severity: mail
          priority: critical
          owner: homelab
          job: unifi-bgp
          component: bgp
        annotations:
          summary: UDM has no active Kubernetes next hop for {{ $labels.prefix }}.
          description: The controller forwarding table lacks a usable BGP route for this production VIP. Existing L2 access may still succeed; inspect UDM prefix filters and received routes.
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#bgp
      - alert: UDMBGPPeerUnavailable
        expr: (unifi_bgp_peer_established{job="unifi-bgp"} == 0) and on(instance) (unifi_bgp_scrape_success{job="unifi-bgp"} == 1)
        for: 2m
        labels:
          severity: mail
          priority: warning
          owner: homelab
          job: unifi-bgp
          component: bgp
        annotations:
          summary: UDM BGP peer {{ $labels.peer }} is not established.
          description: The router reports a missing, down or wrong-AS Kubernetes neighbor. Compare FRR session telemetry before changing routing.
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#bgp
      - alert: UDMBGPPolicyViolation
        expr: ((unifi_bgp_policy_violations{job="unifi-bgp"} > 0) or (unifi_bgp_exported_routes{job="unifi-bgp"} > 0)) and on(instance) (unifi_bgp_scrape_success{job="unifi-bgp"} == 1)
        for: 2m
        labels:
          severity: mail
          priority: critical
          owner: homelab
          job: unifi-bgp
          component: bgp
        annotations:
          summary: UDM BGP route exchange differs from the reviewed policy.
          description: Inspect peer/reason labels. Only the three production /32s, the three Kubernetes neighbors and zero UDM route exports are expected.
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#bgp
      - alert: LoadBalancerAddressMissing
        expr: kube_service_spec_type{type="LoadBalancer"} unless on(namespace,service) kube_service_status_load_balancer_ingress
        for: 10m
        labels:
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: LoadBalancer service has no assigned ingress address.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: HarborQueueBacklog
        expr: harbor_task_queue_size > 100
        for: 10m
        labels:
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: Harbor job queue exceeds one hundred tasks.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: GPUHot
        expr: max by(UUID,modelName) (DCGM_FI_DEV_GPU_TEMP) > 85
        for: 10m
        labels:
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: GPU temperature exceeds the configured 85 C warning threshold.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: GPURemapFailure
        expr: max by(UUID,modelName) (DCGM_FI_DEV_ROW_REMAP_FAILURE) > 0 or max by(UUID,modelName) (DCGM_FI_DEV_UNCORRECTABLE_REMAPPED_ROWS) > 0
        for: 10m
        labels:
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: GPU reports remapping failure or uncorrectable remapped rows.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: GPUExporterMissing
        expr: absent(DCGM_FI_DEV_GPU_TEMP)
        for: 10m
        labels:
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: Expected GPU telemetry is missing.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: CoreDNSServerErrors
        expr: sum by(instance) (rate(coredns_dns_responses_total{rcode="SERVFAIL"}[10m])) / sum by(instance) (rate(coredns_dns_responses_total[10m])) > 0.05 and sum by(instance) (increase(coredns_dns_responses_total[10m]))
          >= 100
        for: 10m
        labels:
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: CoreDNS SERVFAIL fraction exceeds 5% with at least 100 responses per ten minutes.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: CoreDNSLatency
        expr: histogram_quantile(0.99,sum by(instance,le) (rate(coredns_dns_request_duration_seconds_bucket[10m]))) > 1 and sum by(instance) (increase(coredns_dns_request_duration_seconds_count[10m]))
          >= 100
        for: 15m
        labels: &id001
          severity: mail
          priority: warning
          owner: homelab
        annotations:
          summary: CoreDNS p99 latency exceeds one second.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: ContainerOOMKilled
        expr: (increase(kube_pod_container_status_restarts_total[15m]) > 0) and on(namespace,pod,container) (kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1)
        for: 5m
        labels: *id001
        annotations:
          summary: Container restarted after an out-of-memory kill.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: LonghornBackupScheduleMissing
        expr: homelab_expected_backup_cronjob unless on(namespace,cronjob) kube_cronjob_info
        for: 30m
        labels: *id001
        annotations:
          summary: An expected Longhorn backup CronJob is missing.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage
      - alert: CriticalHTTPSProbeFailed
        expr: (connectivity_status{job="connectivity-exporter",host="sso.andreybondarenko.com"} == 0 or absent(connectivity_status{job="connectivity-exporter",host="sso.andreybondarenko.com"}))
          or (connectivity_status{job="connectivity-exporter",host="harbor.andreybondarenko.com"} == 0 or absent(connectivity_status{job="connectivity-exporter",host="harbor.andreybondarenko.com"}))
          or (connectivity_status{job="connectivity-exporter",host="mastodon.andreybondarenko.com"} == 0 or absent(connectivity_status{job="connectivity-exporter",host="mastodon.andreybondarenko.com"}))
        for: 10m
        labels:
          severity: mail
          priority: critical
          owner: homelab
        annotations:
          summary: Critical HTTPS endpoint is unavailable or its probe disappeared.
          description: 'Affected resource: {{ $labels }}; observed value: {{ $value }}. See runbook for checks and thresholds.'
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#triage

    - name: application-queues
      rules:
      - record: mastodon_queue_waiting_jobs
        expr: max by (queue) (label_replace(redis_script_values{job="valkey-mastodon",key=~"mastodon_queue_.+_waiting"}, "queue", "$1", "key", "mastodon_queue_(.+)_waiting"))
      - record: mastodon_queue_oldest_age_seconds
        expr: max by (queue) (label_replace(redis_script_values{job="valkey-mastodon",key=~"mastodon_queue_.+_latency_seconds"}, "queue", "$1", "key", "mastodon_queue_(.+)_latency_seconds"))
      - record: mastodon_retry_jobs
        expr: max(redis_script_values{job="valkey-mastodon",key="mastodon_retry_jobs"})
      - record: mastodon_dead_jobs
        expr: max(redis_script_values{job="valkey-mastodon",key="mastodon_dead_jobs"})
      - record: mastodon_scheduled_jobs
        expr: max(redis_script_values{job="valkey-mastodon",key="mastodon_schedule_jobs"})
      - record: immich_queue_jobs
        expr: max by (queue,state) (label_replace(label_replace(redis_script_values{job="valkey-immich",key=~"immich_queue_.+_(waiting|active|paused|failed|delayed)"}, "queue", "$1", "key",
          "immich_queue_(.+)_(waiting|active|paused|failed|delayed)"), "state", "$2", "key", "immich_queue_(.+)_(waiting|active|paused|failed|delayed)"))
      - alert: PostfixQueueMetricsUnavailable
        expr: max((min(up{job="postfix-queue"}) == 0) or (min(postfix_queue_scrape_success{job="postfix-queue"}) == 0) or absent(postfix_queue_scrape_success{job="postfix-queue"}))
        for: 10m
        labels:
          severity: mail
          priority: warning
          owner: homelab
          application: mail
        annotations:
          summary: Postfix queue telemetry is unavailable.
          description: Check scrape health and the non-root collector; missing data does not mean an empty queue.
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#application-queues
      - alert: MastodonQueueMetricsUnavailable
        expr: max((min(up{job="valkey-mastodon"}) == 0) or (min(redis_script_result{job="valkey-mastodon"}) != 1) or absent(redis_script_result{job="valkey-mastodon"}))
        for: 10m
        labels:
          severity: mail
          priority: warning
          owner: homelab
          application: mastodon
        annotations:
          summary: Mastodon queue telemetry is unavailable.
          description: Check Valkey exporter health, mounted script and the read-only collector result.
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#application-queues
      - alert: ImmichQueueMetricsUnavailable
        expr: max((min(up{job="valkey-immich"}) == 0) or (min(redis_script_result{job="valkey-immich"}) != 1) or absent(redis_script_result{job="valkey-immich"}))
        for: 10m
        labels:
          severity: mail
          priority: warning
          owner: homelab
          application: immich
        annotations:
          summary: Immich queue telemetry is unavailable.
          description: Check Valkey exporter health and BullMQ queue inventory; missing metadata fails collection.
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#application-queues
      - alert: PostfixQueueBacklog
        expr: sum(postfix_queue_messages{job="postfix-queue",queue=~"active|deferred|incoming|maildrop"}) > 50
        for: 15m
        labels:
          severity: mail
          priority: warning
          owner: homelab
          application: mail
        annotations:
          summary: Postfix delivery queue exceeds fifty messages.
          description: Inspect queue state counts, delivery logs, DNS and remote SMTP reachability. Do not flush or delete messages to clear this alert.
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#application-queues
      - alert: PostfixQueueOldMail
        expr: max(postfix_queue_oldest_age_seconds{job="postfix-queue",queue=~"active|deferred|incoming|maildrop"}) > 3600
        for: 15m
        labels:
          severity: mail
          priority: warning
          owner: homelab
          application: mail
        annotations:
          summary: Postfix has queued mail older than one hour.
          description: Age is measured from initial arrival, not entry into the current queue. Investigate delivery deferrals before changing mail.
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#application-queues
      - alert: PostfixQueueHeldMail
        expr: sum(postfix_queue_messages{job="postfix-queue",queue="hold"}) > 0
        for: 30m
        labels:
          severity: mail
          priority: warning
          owner: homelab
          application: mail
        annotations:
          summary: Postfix has held mail requiring review.
          description: Held mail does not progress automatically. Confirm whether the hold is intentional; do not release messages automatically.
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#application-queues
      - alert: MastodonQueueBacklog
        expr: mastodon_queue_waiting_jobs > 100
        for: 15m
        labels:
          severity: mail
          priority: warning
          owner: homelab
          application: mastodon
        annotations:
          summary: Mastodon queue {{ $labels.queue }} exceeds one hundred waiting jobs.
          description: Compare waiting age, busy workers and database/Valkey health. Queue counts exclude executing jobs.
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#application-queues
      - alert: MastodonQueueOldJobs
        expr: mastodon_queue_oldest_age_seconds > 300
        for: 15m
        labels:
          severity: mail
          priority: warning
          owner: homelab
          application: mastodon
        annotations:
          summary: Mastodon queue {{ $labels.queue }} has a job waiting over five minutes.
          description: Inspect worker availability and queue latency. Retry and scheduled sets are separate from runnable work.
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#application-queues
      - alert: MastodonRetryBacklog
        expr: mastodon_retry_jobs > 100
        for: 30m
        labels:
          severity: mail
          priority: warning
          owner: homelab
          application: mastodon
        annotations:
          summary: Mastodon retains over one hundred retrying jobs.
          description: Federation failures can cause transient retries. Inspect sustained growth and worker logs; do not clear retry/dead sets.
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#application-queues
      - alert: ImmichQueueBacklog
        expr: immich_queue_jobs{state="waiting"} > 1000
        for: 30m
        labels:
          severity: mail
          priority: warning
          owner: homelab
          application: immich
        annotations:
          summary: Immich queue {{ $labels.queue }} exceeds one thousand waiting jobs.
          description: Bulk imports can legitimately build a backlog. Compare active workers and queue trend before intervention. Paused/delayed jobs are shown separately.
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#application-queues
      - alert: ImmichQueueFailedJobs
        expr: immich_queue_jobs{state="failed"} > 0
        for: 30m
        labels:
          severity: mail
          priority: warning
          owner: homelab
          application: immich
        annotations:
          summary: Immich queue {{ $labels.queue }} retains failed jobs.
          description: This is a retained failure count, not a rate of new failures. Review the Immich admin job view; do not automatically retry or delete jobs.
          runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/monitoring-alerts.md#application-queues
  prometheus.yaml: |-
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
      external_labels:
        cluster: prometheus
    rule_files:
      - /etc/prometheus/prometheus.rules
    alerting:
      alertmanagers:
      - scheme: http
        static_configs:
        - targets:
          - "alertmanager.monitoring.svc:9093"
    scrape_configs:
      - job_name: hister
        scrape_interval: 45s
        scrape_timeout: 15s
        authorization:
          credentials_file: /etc/prometheus-hister/token
        static_configs:
          - targets: [hister.hister.svc.cluster.local:8080]
      - job_name: spotify
        scrape_interval: 45s
        scrape_timeout: 15s
        basic_auth:
          username: prometheus
          password_file: /etc/prometheus-spotify/token
        static_configs:
          - targets: [server.spotify.svc.cluster.local:8080]
      - job_name: longhorn-csi
        scrape_interval: 45s
        scrape_timeout: 15s
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [longhorn-system]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_phase]
            action: keep
            regex: Running
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: csi-(attacher|provisioner|resizer|snapshotter)
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "8000"
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: component
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      - job_name: metrics-server
        scheme: https
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true
        scrape_interval: 45s
        scrape_timeout: 15s
        static_configs:
        - targets:
          - metrics-server.kube-system.svc.cluster.local:443
      - job_name: snapshot-controller
        scrape_interval: 45s
        scrape_timeout: 15s
        kubernetes_sd_configs:
        - role: pod
          namespaces:
            names:
            - kube-system
        relabel_configs:
        - source_labels:
          - __meta_kubernetes_pod_phase
          action: keep
          regex: Running
        - source_labels:
          - __meta_kubernetes_pod_label_app_kubernetes_io_name
          action: keep
          regex: snapshot-controller
        - source_labels:
          - __meta_kubernetes_pod_container_port_number
          action: keep
          regex: '8080'
        - source_labels:
          - __meta_kubernetes_namespace
          target_label: kubernetes_namespace
        - source_labels:
          - __meta_kubernetes_pod_name
          target_label: pod
      - job_name: node-feature-discovery
        scrape_interval: 45s
        scrape_timeout: 15s
        kubernetes_sd_configs:
        - role: pod
          namespaces:
            names:
            - gpu-operator
        relabel_configs:
        - source_labels:
          - __meta_kubernetes_pod_phase
          action: keep
          regex: Running
        - source_labels:
          - __meta_kubernetes_pod_label_app_kubernetes_io_name
          action: keep
          regex: node-feature-discovery
        - source_labels:
          - __meta_kubernetes_pod_container_port_number
          action: keep
          regex: '8080'
        - source_labels:
          - __meta_kubernetes_namespace
          target_label: kubernetes_namespace
        - source_labels:
          - __meta_kubernetes_pod_name
          target_label: pod
      - job_name: firefox-sync
        scrape_interval: 45s
        scrape_timeout: 15s
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [firefox-sync]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_phase]
            action: keep
            regex: Running
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "9102"
          - source_labels: [__meta_kubernetes_namespace]
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      - job_name: meilisearch
        scrape_interval: 45s
        scrape_timeout: 15s
        authorization:
          credentials_file: /etc/prometheus-meilisearch/token
        static_configs:
          - targets:
              - meilisearch.karakeep.svc.cluster.local:7700
      - job_name: external-secrets
        scrape_interval: 45s
        scrape_timeout: 15s
        kubernetes_sd_configs:
        - role: pod
          namespaces:
            names:
            - external-secrets
        relabel_configs:
        - source_labels:
          - __meta_kubernetes_pod_phase
          action: keep
          regex: Running
        - source_labels:
          - __meta_kubernetes_pod_container_port_number
          action: keep
