          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: true

          # avoid double-scraping node-exporter (handled by the dedicated job above)
          - source_labels: [__meta_kubernetes_service_name]
            action: drop
            regex: node-exporter|prometheus-service

          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scheme]
            action: replace
            target_label: __scheme__
            regex: (https?)
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: (.+?)(?::\d+)?;(\d+)
            replacement: $1:$2
          - action: labelmap
            regex: __meta_kubernetes_service_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_service_name]
            action: replace
            target_label: kubernetes_name
      - job_name: postfix-queue
        scrape_interval: 45s
        scrape_timeout: 15s
        static_configs:
        - targets:
          - postfix-queue.mail.svc.cluster.local:9154
      - job_name: valkey-immich
        scrape_interval: 45s
        scrape_timeout: 15s
        static_configs:
        - targets:
          - immich-valkey.immich.svc.cluster.local:9121
