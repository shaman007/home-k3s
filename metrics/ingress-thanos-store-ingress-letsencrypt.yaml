---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: thanos-store-ingress-letsencrypt
  namespace: monitoring
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: traefik-internal-clients-only@kubernetescrd,traefik-admin-oidc@kubernetescrd
spec:
  ingressClassName: traefik-private
  tls:
  - hosts:
    - thanos-store.int.andreybondarenko.com
    secretName: thanos-store-letsencrypt-internal-tls
  rules:
  - host: thanos-store.int.andreybondarenko.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: thanos-store-gateway
            port:
              number: 10902
