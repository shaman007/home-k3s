apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: thanos-store-vault-acme-tls
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  secretName: thanos-store-vault-acme-tls
  duration: 720h
  renewBefore: 168h
  dnsNames:
  - thanos-store.w386.k8s.my.lan
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: vault-acme
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: thanos-store-ingress
  namespace: monitoring
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: traefik-internal-clients-only@kubernetescrd,traefik-admin-oidc@kubernetescrd
spec:
  ingressClassName: traefik-private
  tls:
  - hosts:
    - thanos-store.w386.k8s.my.lan
    secretName: thanos-store-vault-acme-tls
  rules:
  - host: thanos-store.w386.k8s.my.lan
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: thanos-store-gateway
            port:
              number: 10902
