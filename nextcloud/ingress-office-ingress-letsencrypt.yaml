---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: office-ingress-letsencrypt
  namespace: nextcloud
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/router.middlewares: traefik-internal-clients-only@kubernetescrd,nextcloud-hsts@kubernetescrd
spec:
  ingressClassName: traefik-private
  tls:
  - hosts:
    - office.int.andreybondarenko.com
    secretName: office-letsencrypt-internal-tls
  rules:
  - host: office.int.andreybondarenko.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: collabora-collabora-online
            port:
              number: 9980
