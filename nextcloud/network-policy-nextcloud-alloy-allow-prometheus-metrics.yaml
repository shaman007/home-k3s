apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nextcloud-alloy-allow-prometheus-metrics
  namespace: nextcloud
spec:
  podSelector:
    matchLabels:
      app: nextcloud-web
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app: prometheus-server
    ports:
    - protocol: TCP
      port: 12345
