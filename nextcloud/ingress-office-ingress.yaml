apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: office-ingress
  namespace: nextcloud
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: "https"
    traefik.ingress.kubernetes.io/router.middlewares: traefik-internal-clients-only@kubernetescrd,nextcloud-hsts@kubernetescrd
spec:
  ingressClassName: traefik-private
  tls:
    - hosts:
        - office.w386.k8s.my.lan
      secretName: office-vault-acme-tls
  rules:
    - host: office.w386.k8s.my.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: collabora-collabora-online
                port:
                  number: 9980
