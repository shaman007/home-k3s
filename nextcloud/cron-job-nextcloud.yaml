apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud
  namespace: nextcloud
  labels:
    app: nextcloud
    component: web
    app.kubernetes.io/name: nextcloud
    app.kubernetes.io/instance: nextcloud
    app.kubernetes.io/version: latest
    app.kubernetes.io/managed-by: argoCD
spec:
  schedule: 15 * * * *
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: nextcloud
            component: web
            app.kubernetes.io/name: nextcloud
            app.kubernetes.io/instance: nextcloud
        spec:
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          hostAliases:
          - ip: 192.168.30.210
            hostnames:
            - andreybondarenko.com
          automountServiceAccountToken: false
          priorityClassName: homelab-batch
          containers:
          - name: previews
            image: harbor.andreybondarenko.com/library/php:2026-11-09-022903
            imagePullPolicy: IfNotPresent
            securityContext:
              runAsUser: 33
              capabilities:
                drop:
                - ALL
              runAsGroup: 33
              runAsNonRoot: true
              allowPrivilegeEscalation: false
            command:
            - /bin/sh
            - /cron-gate/nextcloud_job_gate.sh
            resources:
              requests:
                cpu: 10m
                memory: 768Mi
              limits:
                memory: 4Gi
            volumeMounts:
            - name: application-code
              mountPath: /nextcloud
            - name: cron-gate
              mountPath: /cron-gate
              readOnly: true
          volumes:
          - name: application-code
            persistentVolumeClaim:
              claimName: nextcloud-lh-120gi
          - name: config-volume
            configMap:
              name: php-fpm-config
          - name: cron-gate
            configMap:
              name: nextcloud-cron-dependencies-3028385fbece
          restartPolicy: Never
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                  - key: app
                    operator: In
                    values:
                    - nextcloud
                  - key: component
                    operator: In
                    values:
                    - web
                topologyKey: kubernetes.io/hostname
