apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo
  namespace: monitoring
data:
  tempo.yaml: |
    target: all
    stream_over_http_enabled: true
    server:
      http_listen_port: 3200
    distributor:
      receivers:
        otlp:
          protocols:
            http:
              endpoint: 0.0.0.0:4318
    storage:
      trace:
        backend: local
        wal:
          path: /var/tempo/wal
        local:
          path: /var/tempo/blocks
    backend_scheduler:
      local_work_path: /var/tempo/scheduler
      provider:
        compaction:
          compaction:
            block_retention: 24h
    metrics_generator:
      storage:
        path: /var/tempo/generator/wal
    usage_report:
      reporting_enabled: false
