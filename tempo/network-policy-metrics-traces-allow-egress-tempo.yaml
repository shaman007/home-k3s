apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metrics-traces-allow-egress-tempo
  namespace: monitoring
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - prometheus-server
      - thanos-querier
      - thanos-store-gateway
      - thanos-compactor
      - thanos-receive
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app: tempo
    ports:
    - protocol: TCP
      port: 4318
