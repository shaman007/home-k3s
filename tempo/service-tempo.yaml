apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: monitoring
spec:
  # CoreDNS uses the node resolver, so its exporter cannot bootstrap via service DNS.
  # Preserve the current allocation and use it explicitly in the CoreDNS Corefile.
  clusterIP: 10.43.163.168
  selector:
    app: tempo
  ports:
    - name: http
      port: 3200
      targetPort: http
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: zipkin
      port: 9411
      targetPort: zipkin
    - name: jaeger-compact
      port: 6831
      targetPort: jaeger-compact
      protocol: UDP
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
