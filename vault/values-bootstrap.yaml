global:
  tlsDisable: false

injector:
  enabled: false

server:
  includeConfigAnnotation: true
  service:
    annotations:
      traefik.ingress.kubernetes.io/service.serverstransport: vault-vault-server@kubernetescrd
  extraEnvironmentVars:
    VAULT_CACERT: /vault/userconfig/vault-server-tls/ca.crt
  extraVolumes:
    - type: secret
      name: vault-server-tls
  affinity: ""
  ha:
    enabled: true
    replicas: 2
    apiAddr: "https://vault-active.vault.svc:8200"
    clusterAddr: "https://$(HOSTNAME).vault-internal:8201"
    raft:
      enabled: true
      config: |
        ui = true

        listener "tcp" {
          tls_disable = 0
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_cert_file = "/vault/userconfig/vault-server-tls/tls.crt"
          tls_key_file = "/vault/userconfig/vault-server-tls/tls.key"
          telemetry {
            unauthenticated_metrics_access = "true"
          }
        }

        storage "raft" {
          path = "/vault/data"
        }

        service_registration "kubernetes" {}

        telemetry {
          prometheus_retention_time = "30s"
          disable_hostname = true
        }
