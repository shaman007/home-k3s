apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-token-rotator
  namespace: vault
  labels:
    app.kubernetes.io/name: vault-token-rotator
    app.kubernetes.io/instance: vault-token-rotator
    app.kubernetes.io/managed-by: argoCD
spec:
  schedule: "17 3 * * *"
  suspend: true
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          priorityClassName: homelab-batch
          serviceAccountName: vault-token-rotator
          restartPolicy: OnFailure
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: rotate
              image: harbor.andreybondarenko.com/library/sync:2026-07-27-200859
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c", "echo 'Disabled: External Secrets uses Vault Kubernetes auth'"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
