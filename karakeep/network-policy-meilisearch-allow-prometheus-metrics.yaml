apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: meilisearch-allow-prometheus-metrics
  namespace: karakeep
spec:
  podSelector:
    matchLabels:
      app: meilisearch
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app: prometheus-server
      ports:
        - protocol: TCP
          port: 7700
