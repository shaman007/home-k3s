---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: karakeep
  namespace: karakeep
  labels:
    app: karakeep
    app.kubernetes.io/name: karakeep
    app.kubernetes.io/instance: karakeep
    app.kubernetes.io/version: "0.31.0"
    app.kubernetes.io/managed-by: argoCD
  annotations:
    configmap.reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: karakeep
  template:
    metadata:
      labels:
        app: karakeep
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      priorityClassName: homelab-standard
      initContainers:
        - name: init-writable-paths
          image: harbor.andreybondarenko.com/dockerhub/busybox:1.38
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              find /karakeep-data -path /karakeep-data/lost+found -prune -o -exec chown 1000:1000 {} +
              chmod 0755 /run
              chown 1000:1000 /run
              chmod 1777 /chrome-tmp /web-tmp
              chown -R 1000:1000 /chrome-data /chrome-tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
            readOnlyRootFilesystem: true
            runAsUser: 0
            runAsGroup: 0
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - {name: karakeep-data, mountPath: /karakeep-data}
            - {name: chrome-data, mountPath: /chrome-data}
            - {name: chrome-tmp, mountPath: /chrome-tmp}
            - {name: tmp, mountPath: /web-tmp}
            - {name: run, mountPath: /run}
      containers:
        - name: web
          image: harbor.andreybondarenko.com/github/karakeep-app/karakeep:0.33.2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 3000
          startupProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          env:
            - name: CRAWLER_STORE_PDF
              value: "true"
          envFrom:
            - configMapRef:
                name: karakeep-env
            - secretRef:
                name: karakeep-secret-env
          volumeMounts:
            - name: karakeep-data
              mountPath: /data
            - name: run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 93m
              memory: 896Mi
            limits:
              memory: 1152Mi
        - name: chrome
          image: harbor.andreybondarenko.com/library/alpine-chrome:2026-08-20-163827
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          command: ["/usr/bin/chromium-browser"] # override ENTRYPOINT
          args:
            - --no-sandbox
            - --headless
            - --remote-debugging-address=0.0.0.0
            - --remote-debugging-port=9222
            - --user-data-dir=/data/profile
            - --no-first-run
            - --no-default-browser-check
            - --disable-gpu
            - --disable-vulkan
            - --use-angle=swiftshader
            - --use-gl=swiftshader
            - --disable-features=MediaRouter,Translate,OnDeviceModel,OptimizationHints,OptimizationGuideModelDownloading
          env:
            - {name: DBUS_SYSTEM_BUS_ADDRESS, value: "disabled:"}
            - {name: DBUS_SESSION_BUS_ADDRESS, value: "disabled:"}
            - {name: HOME, value: /tmp}
            - {name: TMPDIR, value: /tmp}
            - {name: XDG_CONFIG_HOME, value: /tmp/.chromium}
            - {name: XDG_CACHE_HOME, value: /tmp/.chromium}
          volumeMounts:
            - {name: dshm, mountPath: /dev/shm}
            - {name: chrome-data, mountPath: /data}
            - {name: chrome-tmp, mountPath: /tmp}
          ports:
            - {containerPort: 9222}
          resources:
            requests:
              cpu: 40m
              memory: 1Gi
            limits:
              memory: 1536Mi
      volumes:
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 1Gi}
        - name: chrome-data
          emptyDir: {}
        - name: chrome-tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: karakeep-data
          persistentVolumeClaim:
            claimName: karakeep-data
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
