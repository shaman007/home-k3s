---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: karakeep
  namespace: karakeep
  labels:
    app: karakeep
    app.kubernetes.io/name: karakeep
    app.kubernetes.io/instance: karakeep
    app.kubernetes.io/version: "0.31.0"
    app.kubernetes.io/managed-by: argoCD
  annotations:
    configmap.reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: karakeep
  template:
    metadata:
      annotations:
        checksum/karakeep-worker-startup: 7c7e2cfefb0d2d0091f581d05968f0d721060ced8dd2cc6bf06e439c6c467c26
      labels:
        app: karakeep
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      priorityClassName: homelab-standard
      initContainers:
        - name: init-writable-paths
          image: harbor.andreybondarenko.com/dockerhub/busybox:1.38
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              find /karakeep-data -path /karakeep-data/lost+found -prune -o -exec chown 1000:1000 {} +
              chmod 0755 /run
              chown 1000:1000 /run
              chmod 1777 /web-tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
            readOnlyRootFilesystem: true
            runAsUser: 0
            runAsGroup: 0
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - {name: karakeep-data, mountPath: /karakeep-data}
            - {name: tmp, mountPath: /web-tmp}
            - {name: run, mountPath: /run}
      containers:
        - name: web
          image: harbor.andreybondarenko.com/github/karakeep-app/karakeep:0.34.1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 3000
          startupProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          env:
            - name: CRAWLER_STORE_PDF
              value: "true"
          envFrom:
            - configMapRef:
                name: karakeep-env
            - secretRef:
                name: karakeep-secret-env
          volumeMounts:
            - name: karakeep-data
              mountPath: /data
            - name: run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
            - name: worker-startup
              mountPath: /worker-startup
              readOnly: true
            - name: worker-startup
              mountPath: /etc/s6-overlay/s6-rc.d/svc-workers/run
              subPath: run
              readOnly: true
          resources:
            requests:
              cpu: 93m
              memory: 1Gi
            limits:
              memory: 2Gi
      volumes:
        - name: karakeep-data
          persistentVolumeClaim:
            claimName: karakeep-data
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: worker-startup
          configMap:
            name: karakeep-worker-startup-7c7e2cfefb0d
            defaultMode: 0555
