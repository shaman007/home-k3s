---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: karakeep
  namespace: karakeep
  labels:
    app: karakeep
    app.kubernetes.io/name: karakeep
    app.kubernetes.io/instance: karakeep
    app.kubernetes.io/version: "0.31.0"
    app.kubernetes.io/managed-by: argoCD
  annotations:
    configmap.reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: karakeep
  template:
    metadata:
      labels:
        app: karakeep
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      priorityClassName: homelab-standard
      initContainers:
        - name: init-writable-paths
          image: harbor.andreybondarenko.com/dockerhub/busybox:1.38
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              find /karakeep-data -path /karakeep-data/lost+found -prune -o -exec chown 1000:1000 {} +
              chmod 0755 /run
              chown 1000:1000 /run
              chmod 1777 /chrome-tmp /web-tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
            readOnlyRootFilesystem: true
            runAsUser: 0
            runAsGroup: 0
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - {name: karakeep-data, mountPath: /karakeep-data}
            - {name: chrome-tmp, mountPath: /chrome-tmp}
            - {name: tmp, mountPath: /web-tmp}
            - {name: run, mountPath: /run}
      containers:
        - name: web
          image: harbor.andreybondarenko.com/github/karakeep-app/karakeep:0.33.2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 3000
          startupProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          env:
            - name: CRAWLER_STORE_PDF
              value: "true"
          envFrom:
            - configMapRef:
                name: karakeep-env
            - secretRef:
                name: karakeep-secret-env
          volumeMounts:
            - name: karakeep-data
              mountPath: /data
            - name: run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 93m
              memory: 1Gi
            limits:
              memory: 1536Mi
        - name: chrome
          image: ghcr.io/karakeep-app/karakeep-chrome:151.0.7922.47-r1@sha256:5b19bbb160e9ff60681a3abd97e1c4ec9f64212301410de658c3900ab7ef31e7
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          args:
            - --disable-gpu
            - --disable-dev-shm-usage
            - --hide-scrollbars
            - --disable-blink-features=AutomationControlled
            - --window-size=1440,900
          volumeMounts:
            - {name: dshm, mountPath: /dev/shm}
            - {name: chrome-tmp, mountPath: /tmp}
          ports:
            - {containerPort: 9222}
          resources:
            requests:
              cpu: 40m
              memory: 1Gi
            limits:
              memory: 1536Mi
      volumes:
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 1Gi}
        - name: chrome-tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: karakeep-data
          persistentVolumeClaim:
            claimName: karakeep-data
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
