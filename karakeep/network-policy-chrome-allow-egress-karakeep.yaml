apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chrome-allow-egress-karakeep
  namespace: karakeep
spec:
  podSelector:
    matchLabels:
      app: karakeep
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: karakeep-chrome
    ports:
    - protocol: TCP
      port: 9222
