---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: meilisearch
  namespace: karakeep
  labels:
    app: karakeep
    app.kubernetes.io/name: meilisearch
    app.kubernetes.io/instance: meilisearch
    app.kubernetes.io/version: "v1.41.0"
    app.kubernetes.io/managed-by: argoCD
spec:
  serviceName: meilisearch-headless
  replicas: 1
  selector:
    matchLabels:
      app: meilisearch
  template:
    metadata:
      labels:
        app: meilisearch
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      priorityClassName: homelab-standard
      initContainers:
        - name: init-meili-data
          image: harbor.andreybondarenko.com/dockerhub/busybox:1.38
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - find /meili_data -path /meili_data/lost+found -prune -o -exec chown 1000:1000 {} +
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
            readOnlyRootFilesystem: true
            runAsUser: 0
            runAsGroup: 0
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: meili-data
              mountPath: /meili_data
      containers:
        - name: meilisearch
          image: harbor.andreybondarenko.com/dockerhub/getmeili/meilisearch:v1.52.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 7700
              protocol: TCP
          env:
            # Keep the established data path across engine upgrades.
            - name: MEILI_DB_PATH
              value: /meili_data/data-v1.37.0-r1.ms
            # Automatically migrate the disposable search index after image upgrades.
            - name: MEILI_UPGRADE_DB
              value: "true"
            # Keep indexing memory below container limits to prevent OOM during import.
            - name: MEILI_MAX_INDEXING_MEMORY
              value: "268435456"
            - name: MEILI_NO_ANALYTICS
              value: "true"
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: karakeep-secret-env
                  key: MEILI_MASTER_KEY
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: meili-data
              mountPath: /meili_data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: meili-data
          persistentVolumeClaim:
            claimName: meili-data
        - name: tmp
          emptyDir: {}
