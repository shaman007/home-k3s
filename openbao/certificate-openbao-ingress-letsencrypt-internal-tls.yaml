---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-ingress-letsencrypt-internal-tls
  namespace: openbao
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  secretName: openbao-ingress-letsencrypt-internal-tls
  renewBefore: 720h
  dnsNames:
  - openbao.int.andreybondarenko.com
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-internal-prod
