---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openbao-ingress
  namespace: openbao
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    traefik.ingress.kubernetes.io/service.serversscheme: "https"
    traefik.ingress.kubernetes.io/router.middlewares: traefik-internal-clients-only@kubernetescrd
spec:
  ingressClassName: traefik-private
  tls:
    - hosts:
        - openbao.w386.k8s.my.lan
      secretName: openbao-ingress-vault-acme-tls
  rules:
    - host: openbao.w386.k8s.my.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openbao
                port:
                  number: 8200
