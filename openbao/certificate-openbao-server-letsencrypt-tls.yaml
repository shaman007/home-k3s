# Compatibility resource/Secret name retained for restart-free TLS migration.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-server-letsencrypt-tls
  namespace: openbao
spec:
  secretName: openbao-server-letsencrypt-tls
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
  - server auth
  dnsNames:
  - openbao-api.int.andreybondarenko.com
  - openbao.openbao.svc
  - openbao.openbao.svc.cluster.local
  - openbao-active.openbao.svc
  - openbao-active.openbao.svc.cluster.local
  - openbao-internal.openbao.svc
  - openbao-internal.openbao.svc.cluster.local
  - '*.openbao-internal.openbao.svc'
  - '*.openbao-internal.openbao.svc.cluster.local'
  issuerRef:
    kind: Issuer
    name: openbao-internal-ca
