apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-pki-renewer
  namespace: openbao
  labels:
    app.kubernetes.io/name: vault-pki-renewer
    app.kubernetes.io/instance: vault-pki-renewer
    app.kubernetes.io/managed-by: argoCD
spec:
  suspend: true
  schedule: 27 4 * * *
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          priorityClassName: homelab-batch
          serviceAccountName: vault-pki-renewer
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: renew
            image: harbor.andreybondarenko.com/library/sync:2026-11-02-095223
            imagePullPolicy: IfNotPresent
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            command:
            - /bin/sh
            - -ec
            - "echo \"Retired: OpenBao backend TLS is managed by cert-manager and\
              \ Let\u2019s Encrypt.\""
          automountServiceAccountToken: false
