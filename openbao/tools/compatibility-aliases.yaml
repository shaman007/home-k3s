# Promote these Services into the reconciled OpenBao manifests only after the
# old Vault chart Services have been removed during the final cutover.
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: vault
spec:
  type: ExternalName
  externalName: openbao.openbao.svc.cluster.local
---
apiVersion: v1
kind: Service
metadata:
  name: vault-active
  namespace: vault
spec:
  type: ExternalName
  externalName: openbao-active.openbao.svc.cluster.local
