# Omni test instance. Secret material is supplied from OpenBao kv/omni.
replicaCount: 1
image:
  tag: v1.12.4
config:
  account:
    id: c1519aad-3b4e-4eae-b930-47441b28f8c0
    name: home-lab-test
  services:
    api:
      advertisedURL: https://omni.w386.k8s.my.lan
    kubernetesProxy:
      advertisedURL: https://omni-k8s.w386.k8s.my.lan
    machineAPI:
      advertisedURL: https://omni-siderolink.w386.k8s.my.lan
    siderolink:
      wireGuard:
        advertisedEndpoint: 192.168.1.100:30180
      useGRPCTunnel: true
  auth:
    auth0:
      enabled: false
    oidc:
      enabled: true
      providerURL: https://sso.andreybondarenko.com/realms/master
      clientID: omni-test
      scopes:
      - openid
      - profile
      - email
    initialUsers:
    - me@andreybondarenko.com
additionalConfigSources:
- existingSecret: omni-secrets
  key: config.yaml
etcdEncryptionKey:
  existingSecret: omni-secrets
persistence:
  enabled: true
  storageClassName: longhorn
  size: 10Gi
priorityClassName: homelab-standard
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 2Gi
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
ingress:
  main:
    enabled: true
    className: traefik
    host: omni.w386.k8s.my.lan
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: 'true'
    tls:
    - secretName: omni-tls
      hosts:
      - omni.w386.k8s.my.lan
  kubernetesProxy:
    enabled: true
    className: traefik
    host: omni-k8s.w386.k8s.my.lan
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: 'true'
    tls:
    - secretName: omni-tls
      hosts:
      - omni-k8s.w386.k8s.my.lan
  siderolinkApi:
    enabled: true
    className: traefik
    host: omni-siderolink.w386.k8s.my.lan
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: 'true'
    tls:
    - secretName: omni-tls
      hosts:
      - omni-siderolink.w386.k8s.my.lan
extraObjects:
- apiVersion: v1
  kind: ServiceAccount
  metadata:
    name: vault-auth
    namespace: omni
  automountServiceAccountToken: false
- apiVersion: external-secrets.io/v1
  kind: SecretStore
  metadata:
    name: vault-secret-store
    namespace: omni
    annotations:
      vault.w386.k8s.my.lan/token-policies: omni
  spec:
    refreshInterval: 900
    provider:
      vault:
        server: https://openbao.openbao.svc:8200
        path: kv
        version: v2
        caBundle: 
        auth:
          kubernetes:
            mountPath: kubernetes
            role: external-secrets-omni
            serviceAccountRef:
              name: vault-auth
              audiences:
              - vault
- apiVersion: external-secrets.io/v1
  kind: ExternalSecret
  metadata:
    name: omni-secrets
    namespace: omni
  spec:
    refreshInterval: 15m
    secretStoreRef:
      name: vault-secret-store
      kind: SecretStore
    target:
      name: omni-secrets
      creationPolicy: Owner
    data:
    - secretKey: omni.asc
      remoteRef:
        key: omni
        property: omni.asc
    - secretKey: config.yaml
      remoteRef:
        key: omni
        property: config.yaml
- apiVersion: cert-manager.io/v1
  kind: Certificate
  metadata:
    name: omni-tls
    namespace: omni
  spec:
    secretName: omni-tls
    duration: 720h
    renewBefore: 168h
    dnsNames:
    - omni.w386.k8s.my.lan
    - omni-k8s.w386.k8s.my.lan
    - omni-siderolink.w386.k8s.my.lan
    issuerRef:
      group: cert-manager.io
      kind: ClusterIssuer
      name: vault-acme
- apiVersion: v1
  kind: ResourceQuota
  metadata:
    name: namespace-quota
    namespace: omni
  spec:
    hard:
      pods: '5'
      services: '10'
      secrets: '20'
      configmaps: '10'
      persistentvolumeclaims: '2'
      requests.storage: 20Gi
- apiVersion: v1
  kind: LimitRange
  metadata:
    name: default-resource-requests
    namespace: omni
  spec:
    limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 256Mi
      default:
        memory: 2Gi
      min:
        cpu: 10m
        memory: 32Mi
      max:
        memory: 4Gi
