---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-wordpress
  namespace: wordpress
  labels:
    app: mysql-wordpress
    tier: mysql
    app.kubernetes.io/name: mysql-wordpress
    app.kubernetes.io/instance: mysql-wordpress
    app.kubernetes.io/managed-by: argoCD
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mysql-wordpress
      tier: mysql
  template:
    metadata:
      labels:
        app: mysql-wordpress
        tier: mysql
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      priorityClassName: homelab-essential
      containers:
        - name: mysql
          image: harbor.andreybondarenko.com/dockerhub/mariadb:11.4.12
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          env:
            # Create this secret manually in-cluster; do not commit credentials.
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-wordpress-auth
                  key: password
            - name: MARIADB_DATABASE
              value: wordpress
          args:
            - --transaction-isolation=READ-COMMITTED
          ports:
            - containerPort: 3306
              name: mysql
          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: "20m"
              memory: "832Mi"
            limits:
              memory: "1152Mi"
          volumeMounts:
            - name: mariadb-wordpress-lh
              mountPath: /var/lib/mysql
            - name: mysql-run
              mountPath: /var/run/mysqld
            - name: mysql-tmp
              mountPath: /tmp
        - name: mysqld-exporter
          image: harbor.andreybondarenko.com/quay/prometheus/mysqld-exporter:v0.20.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          command:
            - /bin/sh
            - -ec
            - |
              cat > /tmp/.my.cnf <<EOF
              [client]
              user = root
              password = ${MYSQL_ROOT_PASSWORD}
              host = 127.0.0.1
              EOF
              exec /bin/mysqld_exporter --config.my-cnf=/tmp/.my.cnf
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-wordpress-auth
                  key: password
          ports:
            - containerPort: 9104
              name: mysqld-exporter
          resources:
            requests:
              memory: "128Mi"
              cpu: "10m"
            limits:
              memory: "256Mi"
          volumeMounts:
            - name: mysqld-exporter-tmp
              mountPath: /tmp
      volumes:
        - name: mysqld-exporter-tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: mariadb-wordpress-lh
          persistentVolumeClaim:
            claimName: mariadb-wordpress-lh
        - name: mysql-run
          emptyDir: {}
        - name: mysql-tmp
          emptyDir: {}
