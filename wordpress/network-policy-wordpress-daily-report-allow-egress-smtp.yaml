---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wordpress-daily-report-allow-egress-smtp
  namespace: wordpress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: wordpress-daily-report
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
              app.kubernetes.io/instance: traefik-traefik
      ports:
        - protocol: TCP
          port: 25
