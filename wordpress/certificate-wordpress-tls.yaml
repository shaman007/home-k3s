---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wordpress-tls
  namespace: wordpress
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: wordpress-tls
  dnsNames:
    - andreybondarenko.com
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-prod
