apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  namespace: firefox-sync
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      automountServiceAccountToken: false
      priorityClassName: homelab-standard
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: mariadb
        image: harbor.andreybondarenko.com/dockerhub/mariadb:12.3.3@sha256:d46e102fa8b9b72bfcdeb56f9dd538742092119dc8b11f31fe662605cd234cd9
        args:
        - --socket=/tmp/mysql.sock
        - --pid-file=/tmp/mysql.pid
        - --secure-file-priv=/tmp
        - --character-set-server=utf8mb4
        - --collation-server=utf8mb4_0900_ai_ci
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 999
          runAsGroup: 999
          seccompProfile:
            type: RuntimeDefault
          readOnlyRootFilesystem: true
        ports:
        - name: mysql
          containerPort: 3306
        env:
        - name: MARIADB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: firefox-sync-env
              key: MYSQL_ROOT_PASSWORD
        - name: MARIADB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: firefox-sync-env
              key: MYSQL_PASSWORD
        - name: MARIADB_DATABASE
          value: syncstorage
        - name: MARIADB_USER
          value: sync
        - name: MARIADB_ROOT_HOST
          value: localhost
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1Gi
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
        - name: tmp
          mountPath: /tmp
        - name: init
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        startupProbe:
          tcpSocket:
            port: mysql
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          tcpSocket:
            port: mysql
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: mysql
          periodSeconds: 20
          failureThreshold: 6
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: mariadb-data
      - name: tmp
        emptyDir: {}
      - name: init
        configMap:
          name: mysql-init
