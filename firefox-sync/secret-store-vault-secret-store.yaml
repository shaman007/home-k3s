apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-secret-store
  namespace: firefox-sync
spec:
  refreshInterval: 900
  provider:
    vault:
      server: https://openbao-api.int.andreybondarenko.com:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets-firefox-sync
          serviceAccountRef:
            name: vault-auth
            audiences:
            - vault
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: firefox-sync
automountServiceAccountToken: false
