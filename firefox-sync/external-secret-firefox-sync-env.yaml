apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: firefox-sync-env
  namespace: firefox-sync
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-secret-store
    kind: SecretStore
  target:
    name: firefox-sync-env
    creationPolicy: Owner
  data:
  - secretKey: MYSQL_ROOT_PASSWORD
    remoteRef:
      key: firefox-sync
      property: MYSQL_ROOT_PASSWORD
  - secretKey: MYSQL_PASSWORD
    remoteRef:
      key: firefox-sync
      property: MYSQL_PASSWORD
  - secretKey: SYNC_MASTER_SECRET
    remoteRef:
      key: firefox-sync
      property: SYNC_MASTER_SECRET
  - secretKey: SYNC_TOKENSERVER__FXA_METRICS_HASH_SECRET
    remoteRef:
      key: firefox-sync
      property: SYNC_TOKENSERVER__FXA_METRICS_HASH_SECRET
