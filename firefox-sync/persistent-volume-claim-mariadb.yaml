apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-data
  namespace: firefox-sync
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job.longhorn.io/backup-daily-retain31-b: enabled
    recurring-job.longhorn.io/trim-daily-a: enabled
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
