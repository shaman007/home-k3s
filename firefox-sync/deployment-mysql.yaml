apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: firefox-sync
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      automountServiceAccountToken: false
      priorityClassName: homelab-standard
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: mysql
        image: harbor.andreybondarenko.com/dockerhub/mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
        args:
        - --socket=/tmp/mysql.sock
        - --pid-file=/tmp/mysql.pid
        - --secure-file-priv=/tmp
        - --mysqlx-socket=/tmp/mysqlx.sock
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 999
          runAsGroup: 999
          seccompProfile:
            type: RuntimeDefault
          readOnlyRootFilesystem: true
        ports:
        - name: mysql
          containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: firefox-sync-env
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: firefox-sync-env
              key: MYSQL_PASSWORD
        - name: MYSQL_DATABASE
          value: syncstorage
        - name: MYSQL_USER
          value: sync
        - name: MYSQL_ROOT_HOST
          value: localhost
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1Gi
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
          subPath: mysql
        - name: tmp
          mountPath: /tmp
        - name: init
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        startupProbe:
          tcpSocket:
            port: mysql
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          tcpSocket:
            port: mysql
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: mysql
          periodSeconds: 20
          failureThreshold: 6
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: mysql-data
      - name: tmp
        emptyDir: {}
      - name: init
        configMap:
          name: mysql-init
