apiVersion: v1
kind: Service
metadata:
  name: thanos-receive
  namespace: monitoring
spec:
  selector:
    app: thanos-receive
  ports:
  - name: remote-write
    port: 19291
    targetPort: remote-write
  - name: http
    port: 10902
    targetPort: http
  - name: grpc
    port: 10901
    targetPort: grpc
---
apiVersion: v1
kind: Service
metadata:
  name: thanos-receive-headless
  namespace: monitoring
spec:
  selector:
    app: thanos-receive
  ports:
  - name: remote-write
    port: 19291
    targetPort: remote-write
  - name: http
    port: 10902
    targetPort: http
  - name: grpc
    port: 10901
    targetPort: grpc
  clusterIP: None
