apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: thanos-receive-objstore-internal
  namespace: monitoring
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-secret-store
    kind: SecretStore
  target:
    name: thanos-receive-objstore-internal
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        objstore.yml: '{{- $store := .source | fromYaml -}}

          {{- if or (ne (get $store "type") "S3") (not (kindIs "map" (get $store "config"))) -}}

          {{- mustFromJson "S3-config-required" -}}

          {{- end -}}

          {{- $config := $store.config -}}

          {{- $_ := set $config "endpoint" "s3.seaweedfs.svc.cluster.local:8333" -}}

          {{- $_ := set $config "insecure" true -}}

          {{- $store | toYaml -}}

          '
  data:
  - secretKey: source
    remoteRef:
      key: monitoring
      property: objstore.yml
