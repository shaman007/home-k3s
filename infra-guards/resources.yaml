    \ reviewed(original, e)\n                assert ready(original), e['name'] + ': not fully ready'\n                assert\
    \ request(e, patch(original), True)['spec'] == expected_spec(original, e), e['name'] + ': unexpected admission result'\n\
    \            break\n        except AssertionError:\n            if attempt == 29: raise\n            time.sleep(3)\n \
    \   for e in entries:\n        storage_check()\n        gpu_check()\n        original = request(e); reviewed(original,\
    \ e)\n        assert ready(original), e['name'] + ': readiness changed'\n        expected = expected_spec(original, e)\n\
    \        if expected != original['spec']:\n            assert request(e, patch(original), True)['spec'] == expected\n\
    \            assert request(e, patch(original))['spec'] == expected\n        deadline = time.monotonic() + 300\n     \
    \   stable_since = None\n        while True:\n            current = request(e)\n            assert current['spec'] ==\
    \ expected, e['name'] + ': unexpected spec change'\n            if ready(current):\n                if stable_since is\
    \ None: stable_since = time.monotonic()\n                if time.monotonic() - stable_since >= 15: break\n           \
    \ else: stable_since = None\n            if time.monotonic() >= deadline: raise RuntimeError(e['name'] + ': rollout failed;\
    \ later targets untouched')\n            time.sleep(3)\n        storage_check()\n        gpu_check()\n        print(e['namespace']\
    \ + '/' + e['name'] + ': guards and rollout verified', flush=True)\n\n\nif __name__ == '__main__':\n    main()\n"
  storage_guard.py: "#!/usr/bin/env python3\n\"\"\"Preflight native mutations, then roll reviewed workloads one at a time.\"\
    \"\"\nimport copy\nimport json\nimport os\nfrom pathlib import Path\nimport ssl\nimport time\nimport urllib.error\nimport\
    \ urllib.request\n\nNAMESPACE = 'longhorn-system'\nMARKER = 'hardening.home-k3s/component-security'\n\n\ndef security(entry):\n\
    \    return {'runAsNonRoot': entry['uid'] != 0, 'runAsUser': entry['uid'], 'runAsGroup': entry['gid'],\n            'allowPrivilegeEscalation':\
    \ False, 'privileged': False,\n            'capabilities': {'drop': ['ALL']}, 'seccompProfile': {'type': 'RuntimeDefault'}}\n\
    \n\ndef reviewed(doc, entry):\n    meta, pod = doc['metadata'], doc['spec']['template']['spec']\n    assert doc['kind']\
    \ == entry['kind'] and meta['namespace'] == NAMESPACE and meta['name'] == entry['name']\n    assert doc['spec']['template']['metadata']['labels']['app']\
    \ == entry['name']\n    assert pod['serviceAccountName'] == entry['serviceAccount']\n    assert len(pod['containers'])\
    \ == entry['count'] and not pod.get('initContainers')\n    c = pod['containers'][entry['index']]\n    assert c['name']\
    \ == entry['container'] and c['image'] == entry['image']\n    assert c.get('command', []) == entry['command'] and c.get('args',\
    \ []) == entry['args']\n    if entry['kind'] == 'DaemonSet':\n        for index in range(entry['count']):\n          \
    \  if index == entry['index']: continue\n            actual = pod['containers'][index]\n            expected = entry['fixture']['spec']['template']['spec']['containers'][index]\n\
    \            assert actual['name'] == expected['name'] and actual['image'] == expected['image']\n            assert actual['securityContext']['privileged']\
    \ is True\n        assert doc['spec']['updateStrategy'] == entry['fixture']['spec']['updateStrategy']\n\n\ndef expected_spec(doc,\
    \ entry):\n    spec = copy.deepcopy(doc['spec'])\n    c = spec['template']['spec']['containers'][entry['index']]\n   \
    \ c['securityContext'] = {**(c.get('securityContext') or {}), **security(entry)}\n    return spec\n\n\ndef ready(doc):\n\
    \    status = doc.get('status', {})\n    if status.get('observedGeneration', 0) < doc['metadata'].get('generation', 1):\
    \ return False\n    if doc['kind'] == 'Deployment':\n        count = doc['spec'].get('replicas', 1)\n        return (count\
    \ > 0 and status.get('updatedReplicas', 0) == count and status.get('replicas', 0) == count\n                and status.get('readyReplicas',\
    \ 0) == count and status.get('availableReplicas', 0) == count)\n    count = status.get('desiredNumberScheduled', 0)\n\
    \    return count > 0 and status.get('updatedNumberScheduled', 0) == count and status.get('numberReady', 0) == count and\
    \ status.get('numberAvailable', 0) == count\n\n\ndef annotation_patch(doc):\n    patch = [{'op': 'test', 'path': '/metadata/resourceVersion',\
    \ 'value': doc['metadata']['resourceVersion']}]\n    if doc['metadata'].get('annotations') is None: patch.append({'op':\
    \ 'add', 'path': '/metadata/annotations', 'value': {}})\n    patch.append({'op': 'add', 'path': '/metadata/annotations/'\
    \ + MARKER.replace('/', '~1'), 'value': 'v1'})\n    return patch\n\n\ndef storage_healthy(volumes, nodes):\n    \"\"\"\
    Reject active degradation; detached idle volumes may have unknown health.\"\"\"\n    assert volumes.get('items'), 'No\
    \ Longhorn volume status available'\n    assert nodes.get('items'), 'No Longhorn node status available'\n    for volume\
    \ in volumes['items']:\n        status = volume.get('status', {})\n        detached = status.get('state') == 'detached'\n\
    \        acceptable = (status.get('robustness') in ('healthy', 'unknown') if detached\n                      else status.get('state')\
    \ == 'attached' and status.get('robustness') == 'healthy')\n        assert acceptable and status.get('restoreRequired')\
    \ is False, 'Longhorn storage is not stable and healthy'\n    for node in nodes['items']:\n        status = node.get('status',\
    \ {})\n        conditions = {c['type']: c['status'] for c in status.get('conditions', [])}\n        assert conditions.get('Ready')\
    \ == 'True' and conditions.get('Schedulable') == 'True', 'Longhorn node is not ready/schedulable'\n        disks = status.get('diskStatus',\
    \ {})\n        assert disks, 'No Longhorn disk status available'\n        for disk in disks.values():\n            conditions\
    \ = {c['type']: c['status'] for c in disk.get('conditions', [])}\n            assert conditions.get('Ready') == 'True'\
    \ and conditions.get('Schedulable') == 'True', 'Longhorn disk is not ready/schedulable'\n\n\ndef main(config_dir=Path('/config'),\
    \ account=Path('/var/run/secrets/kubernetes.io/serviceaccount')):\n    entries = json.loads((config_dir/'catalog.json').read_text())['entries']\n\
    \    context = ssl.create_default_context(cafile=str(account/'ca.crt'))\n    token = (account/'token').read_text().strip()\n\
    \    base = 'https://' + os.environ['KUBERNETES_SERVICE_HOST'] + ':' + os.environ['KUBERNETES_SERVICE_PORT']\n    opener\
    \ = urllib.request.build_opener(urllib.request.ProxyHandler({}), urllib.request.HTTPSHandler(context=context))\n\n   \
    \ def request(entry, patch=None, dry=False):\n        resource = 'deployments' if entry['kind'] == 'Deployment' else 'daemonsets'\n\
    \        url = base+'/apis/apps/v1/namespaces/'+NAMESPACE+'/'+resource+'/'+entry['name']\n        if dry: url += '?dryRun=All'\n\
    \        headers = {'Authorization': 'Bearer '+token}\n        if patch is not None: headers['Content-Type'] = 'application/json-patch+json'\n\
    \        req = urllib.request.Request(url, headers=headers, method='PATCH' if patch is not None else 'GET',\n        \
    \                             data=json.dumps(patch).encode() if patch is not None else None)\n        try:\n        \
    \    with opener.open(req, timeout=15) as response: return json.load(response)\n        except urllib.error.HTTPError\
    \ as error:\n            raise RuntimeError(f'{entry[\"name\"]}: Kubernetes HTTP {error.code}') from None\n\n    check_storage\
    \ = any(e['name'] == 'longhorn-manager' for e in entries)\n\n    def storage_check():\n        if not check_storage: return\n\
    \        documents = []\n        for resource in ['volumes', 'nodes']:\n            url = base + '/apis/longhorn.io/v1beta2/namespaces/'\
    \ + NAMESPACE + '/' + resource\n            req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + token})\n\
    \            with opener.open(req, timeout=15) as response: documents.append(json.load(response))\n        storage_healthy(*documents)\n\
    \n    # Complete all safety checks before the first persistent write.\n    for attempt in range(30):\n        try:\n \
    \           storage_check()\n            for entry in entries:\n                original = request(entry); reviewed(original,\
    \ entry)\n                assert ready(original), f'{entry[\"name\"]}: workload is not fully healthy'\n              \
    \  preview = request(entry, annotation_patch(original), dry=True)\n                assert preview['spec'] == expected_spec(original,\
    \ entry), f'{entry[\"name\"]}: unexpected or absent admission mutation'\n            break\n        except AssertionError:\n\
    \            if attempt == 29: raise\n            time.sleep(3)\n    for entry in entries:\n        storage_check()\n\
    \        # Refetch to tolerate harmless controller resourceVersion updates during earlier rollouts.\n        original\
    \ = request(entry); reviewed(original, entry)\n        assert ready(original), f'{entry[\"name\"]}: became unhealthy before\
    \ mutation'\n        expected = expected_spec(original, entry)\n        if original['spec'] != expected:\n           \
    \ patch = annotation_patch(original)\n            assert request(entry, patch, dry=True)['spec'] == expected\n       \
    \     assert request(entry, patch)['spec'] == expected\n        deadline = time.monotonic()+300\n        while True:\n\
    \            current = request(entry)\n            assert current['spec'] == expected, f'{entry[\"name\"]}: spec changed\
    \ during rollout'\n            if ready(current): break\n            if time.monotonic() >= deadline: raise RuntimeError(f'{entry[\"\
    name\"]}: rollout timed out; later targets were not changed')\n            time.sleep(3)\n        storage_check()\n  \
    \      print(f'{entry[\"name\"]}: security context and completed rollout verified', flush=True)\n    for path in ['/',\
    \ '/v1']:\n        req = urllib.request.Request('http://longhorn-frontend'+path)\n        with opener.open(req, timeout=15)\
    \ as response:\n            assert response.status == 200, 'UI HTTP check failed'\n    print('Component backfill complete;\
    \ UI static and API proxy HTTP checks passed', flush=True)\n\n\nif __name__ == '__main__': main()\n"
---
apiVersion: batch/v1
kind: Job
metadata:
  generateName: reviewed-infrastructure-guards-
  namespace: kyverno
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 2100
  template:
    metadata:
      labels:
        app: reviewed-infrastructure-guards
    spec:
      serviceAccountName: reviewed-infrastructure-guards
      automountServiceAccountToken: true
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: backfill
        image: harbor.andreybondarenko.com/dockerhub/library/python:3.15-alpine
        command:
        - python3
        - /config/backfill.py
        env:
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: reviewed-infrastructure-guards
