apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traefik-private-allow-egress-ollama-http01
  namespace: traefik
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: traefik-private-traefik
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ollama
          podSelector:
            matchLabels:
              acme.cert-manager.io/http01-solver: "true"
      ports:
        - protocol: TCP
          port: 8089
