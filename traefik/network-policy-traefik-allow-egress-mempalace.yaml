apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traefik-allow-egress-mempalace
  namespace: traefik
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mempalace
      ports:
        - protocol: TCP
          port: 8765
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mempalace
          podSelector:
            matchLabels:
              acme.cert-manager.io/http01-solver: "true"
      ports:
        - protocol: TCP
          port: 8089
