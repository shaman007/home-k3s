---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bastioncam-letsencrypt
  namespace: bastioncam
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: traefik-internal-clients-only@kubernetescrd,traefik-robots-disallow-all@kubernetescrd
spec:
  ingressClassName: traefik-private
  tls:
  - hosts:
    - bastioncam.int.andreybondarenko.com
    secretName: bastioncam-letsencrypt-internal-tls
  rules:
  - host: bastioncam.int.andreybondarenko.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bastioncam
            port:
              name: http
