---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: bastioncam-default-deny, namespace: bastioncam}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: bastioncam-allow-ingress, namespace: bastioncam}
spec:
  podSelector: {matchLabels: {app: bastioncam}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: traefik}}
      ports: [{protocol: TCP, port: 8787}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: bastioncam-allow-dns-and-ollama, namespace: bastioncam}
spec:
  podSelector: {matchLabels: {app: bastioncam}}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ollama}}
      ports: [{protocol: TCP, port: 11434}]
