---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bastioncam
  namespace: bastioncam
  labels: &labels
    app: bastioncam
    app.kubernetes.io/name: bastioncam
    app.kubernetes.io/instance: bastioncam
    app.kubernetes.io/managed-by: argoCD
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bastioncam
  template:
    metadata:
      labels: *labels
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      priorityClassName: homelab-best-effort
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: server
          image: harbor.andreybondarenko.com/library/bastioncam:2026-08-31-093037
          imagePullPolicy: IfNotPresent
          args: ["--db", "/data/history.db", "serve", "--host", "0.0.0.0", "--port", "8787", "--ollama-url", "http://ollama.ollama.svc.cluster.local:11434", "--embed-model", "nomic-embed-text"]
          ports:
            - name: http
              containerPort: 8787
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 512Mi}
          securityContext: &containerSecurity
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
        - name: enricher
          image: harbor.andreybondarenko.com/library/bastioncam:2026-08-31-093037
          imagePullPolicy: IfNotPresent
          args: ["--db", "/data/history.db", "enrich-loop", "--url", "http://ollama.ollama.svc.cluster.local:11434", "--chat-model", "qwen3:4b", "--embed-model", "nomic-embed-text", "--batch", "4", "--interval", "60", "--settle", "45"]
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {memory: 512Mi}
          securityContext: *containerSecurity
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: bastioncam-data}
        - name: tmp
          emptyDir: {}
