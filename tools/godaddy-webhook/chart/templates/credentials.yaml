apiVersion: v1
kind: ServiceAccount
metadata:
  name: godaddy-vault-auth
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: godaddy-openbao
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 900
  provider:
    vault:
      {{- if and .Values.openbao.useSystemTrust (ne .Values.openbao.server "https://openbao-api.int.andreybondarenko.com:8200") }}
      {{- fail "system trust requires the verified public-domain OpenBao backend URL" }}
      {{- end }}
      server: {{ .Values.openbao.server | quote }}
      path: kv
      version: v2
      {{- if not .Values.openbao.useSystemTrust }}
      caBundle: {{ required "openbao.caBundle is required during bootstrap" .Values.openbao.caBundle | quote }}
      {{- end }}
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets-godaddy
          serviceAccountRef:
            name: godaddy-vault-auth
            audiences: [vault]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: godaddy-dns-token
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: SecretStore
    name: godaddy-openbao
  target:
    name: godaddy-dns-token
  data:
    - secretKey: token
      remoteRef:
        key: godaddy
        property: token
