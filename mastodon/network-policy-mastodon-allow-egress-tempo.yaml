apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mastodon-allow-egress-tempo
  namespace: mastodon
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mastodon
    matchExpressions:
    - key: app.kubernetes.io/component
      operator: In
      values:
      - web
      - sidekiq-all-queues
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app: tempo
    ports:
    - protocol: TCP
      port: 4318
