---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: mastodon
  name: data-mastodon-postgres-v2
  labels:
    storage.k8s.io/name: longhorn
    app.kubernetes.io/name: mastodon-postgres
    app.kubernetes.io/instance: mastodon-postgres
    app.kubernetes.io/part-of: mastodon
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: helm
    recurring-job.longhorn.io/source: enabled
    recurring-job.longhorn.io/backup-daily-retain1: enabled
    recurring-job.longhorn.io/trim-daily-b: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
