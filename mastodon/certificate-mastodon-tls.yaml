---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mastodon-tls
  namespace: mastodon
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: mastodon-tls
  dnsNames:
    - mastodon.andreybondarenko.com
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-prod
