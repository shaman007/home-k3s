apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-secret-store-mastodon
  namespace: mastodon
  annotations:
    vault.w386.k8s.my.lan/token-policies: mastodon
spec:
  refreshInterval: 900
  provider:
    vault:
      server: "https://openbao-api.int.andreybondarenko.com:8200"
      path: "kv"
      version: "v2"
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets-mastodon
          serviceAccountRef:
            name: vault-auth
            audiences:
              - vault
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: mastodon
automountServiceAccountToken: false
