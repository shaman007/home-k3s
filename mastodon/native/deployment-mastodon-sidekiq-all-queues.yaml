apiVersion: apps/v1
kind: Deployment
metadata:
  name: mastodon-sidekiq-all-queues
  labels:
    app.kubernetes.io/name: mastodon
    app.kubernetes.io/instance: mastodon
    app.kubernetes.io/version: 2026-11-09-022903
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: sidekiq-all-queues
    app.kubernetes.io/part-of: rails
  annotations:
    configmap.reloader.stakater.com/auto: 'true'
  namespace: mastodon
spec:
  strategy:
    type: Recreate
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mastodon
      app.kubernetes.io/instance: mastodon
      app.kubernetes.io/component: sidekiq-all-queues
      app.kubernetes.io/part-of: rails
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mastodon
        app.kubernetes.io/instance: mastodon
        app.kubernetes.io/component: sidekiq-all-queues
        app.kubernetes.io/part-of: rails
      annotations:
        rollme: '1'
        checksum/config-configmap: 078166d4ca0c98354f5687013569e5a1da02fa4e6bddcfdf13b8c451d0d4a661
        checksum/mastodon-startup: 9a8599a3ce18057b2f4c7af15f39f693cef862f375a3cf359fcb8dcb816646bc
    spec:
      serviceAccountName: mastodon
      hostAliases:
      - hostnames:
        - andreybondarenko.com
        ip: 192.168.30.210
      securityContext:
        fsGroup: 991
        runAsGroup: 991
        runAsNonRoot: true
        runAsUser: 991
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: mastodon
        envFrom:
        - configMapRef:
            name: mastodon-env
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        image: harbor.andreybondarenko.com/library/mastodon:2026-11-09-022903@sha256:ee235351bb9d0426060f01dbb3e0c2c4d9dd2a134f178b74e8bd5f108083693d
        imagePullPolicy: Always
        command:
        - bundle
        - exec
        - sidekiq
        - -c
        - '25'
        - -q
        - default,8
        - -q
        - push,6
        - -q
        - ingress,4
        - -q
        - mailers,2
        - -q
        - pull
        - -q
        - fasp
        - -q
        - scheduler
        env:
        - name: SECRET_KEY_BASE
          valueFrom:
            secretKeyRef:
              name: mastodon
              key: SECRET_KEY_BASE
        - name: VAPID_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: mastodon
              key: VAPID_PRIVATE_KEY
        - name: VAPID_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: mastodon
              key: VAPID_PUBLIC_KEY
        - name: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
          valueFrom:
            secretKeyRef:
              name: mastodon
              key: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
        - name: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
          valueFrom:
            secretKeyRef:
              name: mastodon
              key: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
        - name: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
          valueFrom:
            secretKeyRef:
              name: mastodon
              key: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: mastodon
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: mastodon
              key: AWS_SECRET_ACCESS_KEY
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: postgres-password
              key: password
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: postgres-password
              key: username
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mastodon-redis
              key: redis-password
        - name: SMTP_LOGIN
          valueFrom:
            secretKeyRef:
              name: mail
              key: login
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mail
              key: password
        - name: ES_USER
          valueFrom:
            secretKeyRef:
              name: elasticsearch-password
              key: username
        - name: ES_PASS
          valueFrom:
            secretKeyRef:
              name: elasticsearch-password
              key: password
        - name: ALLOW_UNSAFE_AUTH_PROVIDER_REATTACH
          value: 'true'
        - name: BIND
          value: '[::]'
        - name: MASTODON_PROMETHEUS_EXPORTER_ENABLED
          value: 'true'
        - name: MASTODON_PROMETHEUS_EXPORTER_HOST
          value: 0.0.0.0
        - name: MASTODON_PROMETHEUS_EXPORTER_LOCAL
          value: 'true'
        - name: MASTODON_PROMETHEUS_EXPORTER_PORT
          value: '9394'
        resources:
          limits:
            memory: 2052Mi
          requests:
            cpu: 75m
            memory: 1024Mi
        volumeMounts: null
      volumes:
      - name: startup-gate
        configMap:
          name: mastodon-startup-gate
      automountServiceAccountToken: false
      initContainers:
      - name: wait-for-data-services
        image: harbor.andreybondarenko.com/library/mastodon:2026-11-09-022903@sha256:ee235351bb9d0426060f01dbb3e0c2c4d9dd2a134f178b74e8bd5f108083693d
        imagePullPolicy: Always
        workingDir: /opt/mastodon
        command:
        - bundle
        - exec
        - ruby
        - /startup-gate/mastodon_startup.rb
        - dependencies
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        envFrom:
        - configMapRef:
            name: mastodon-env
        env:
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: postgres-password
              key: password
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: postgres-password
              key: username
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mastodon-redis
              key: redis-password
        volumeMounts:
        - name: startup-gate
          mountPath: /startup-gate
          readOnly: true
      - name: wait-for-schema
        image: harbor.andreybondarenko.com/library/mastodon:2026-11-09-022903@sha256:ee235351bb9d0426060f01dbb3e0c2c4d9dd2a134f178b74e8bd5f108083693d
        imagePullPolicy: Always
        workingDir: /opt/mastodon
        command:
        - bundle
        - exec
        - ruby
        - /startup-gate/mastodon_startup.rb
        - schema
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        envFrom:
        - configMapRef:
            name: mastodon-env
        env:
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: postgres-password
              key: password
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: postgres-password
              key: username
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mastodon-redis
              key: redis-password
        volumeMounts:
        - name: startup-gate
          mountPath: /startup-gate
          readOnly: true
