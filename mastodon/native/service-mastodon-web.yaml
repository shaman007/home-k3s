apiVersion: v1
kind: Service
metadata:
  name: mastodon-web
  labels:
    app.kubernetes.io/name: mastodon
    app.kubernetes.io/instance: mastodon
    app.kubernetes.io/version: 2026-11-09-022903
    app.kubernetes.io/managed-by: argocd
  namespace: mastodon
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: http
    protocol: TCP
    name: http
  ipFamilyPolicy: PreferDualStack
  selector:
    app.kubernetes.io/name: mastodon
    app.kubernetes.io/instance: mastodon
    app.kubernetes.io/component: web
