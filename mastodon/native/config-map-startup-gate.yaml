apiVersion: v1
kind: ConfigMap
metadata:
  name: mastodon-startup-gate
  namespace: mastodon
data:
  mastodon_startup.rb: "# frozen_string_literal: true\n\n# No Rails bootstrap for probes. Only the web init is permitted\
    \ to run migrations.\nrequire 'json'\nrequire 'timeout'\n\nmodule MastodonStartup\n  class NotReady < StandardError;\
    \ end\n  LOCK = 901_746_283\n  MIGRATION_COMMAND = %w[bundle exec rake db:migrate].freeze\n\n  def self.log(stage,\
    \ result, started, exit_code: nil)\n    puts JSON.generate(event: 'mastodon_startup', stage: stage, result:\
    \ result,\n                       duration_seconds: (now - started).round(6), exit_code: exit_code)\n  end\n\
    \n  def self.now\n    Process.clock_gettime(Process::CLOCK_MONOTONIC)\n  end\n\n  def self.postgres\n    require\
    \ 'pg'\n    PG.connect(host: ENV.fetch('DB_HOST'), port: ENV.fetch('DB_PORT', '5432'),\n               user:\
    \ ENV.fetch('DB_USER'), password: ENV.fetch('DB_PASS'),\n               dbname: ENV.fetch('DB_NAME'), connect_timeout:\
    \ 4,\n               options: '-c default_transaction_read_only=on -c statement_timeout=4000')\n  end\n\n  def\
    \ self.valkey\n    require 'redis'\n    client = Redis.new(host: ENV.fetch('REDIS_HOST'), port: ENV.fetch('REDIS_PORT',\
    \ '6379'),\n                       password: ENV.fetch('REDIS_PASSWORD'), connect_timeout: 4,\n            \
    \           read_timeout: 4, write_timeout: 4, reconnect_attempts: 0)\n    raise NotReady unless client.ping\
    \ == 'PONG'\n  ensure\n    client&.close\n  end\n\n  def self.dependencies\n    connection = postgres\n    raise\
    \ NotReady unless connection.exec('SELECT 1 AS ready').first.fetch('ready') == '1'\n    valkey\n  ensure\n \
    \   connection&.close\n  end\n\n  def self.expected_versions\n    files = Dir['db/migrate/[0-9]*.rb', 'db/post_migrate/[0-9]*.rb']\n\
    \    versions = files.map { |file| File.basename(file).split('_', 2).first }\n    raise NotReady if versions.empty?\
    \ || versions.any? { |v| !v.match?(/\\A[0-9]+\\z/) }\n    raise NotReady unless versions.uniq.length == versions.length\n\
    \n    versions\n  end\n\n  def self.schema_versions(connection)\n    # Missing/uninitialized production DB fails\
    \ closed; never db:prepare/create/seeds.\n    versions = Timeout.timeout(5) do\n      connection.exec('SELECT\
    \ version FROM schema_migrations').map { |row| row.fetch('version') }\n    end\n    raise NotReady if versions.empty?\n\
    \n    versions\n  end\n\n  def self.pending?(connection)\n    !(expected_versions - schema_versions(connection)).empty?\n\
    \  end\n\n  def self.schema\n    connection = postgres\n    acquired = connection.exec(\"SELECT pg_try_advisory_lock_shared(#{LOCK})\
    \ AS acquired\").first.fetch('acquired') == 't'\n    raise NotReady unless acquired\n    raise NotReady if pending?(connection)\n\
    \n    valkey\n  ensure\n    # Closing a session also releases its advisory locks, including error paths.\n \
    \   connection&.close\n  end\n\n  def self.wait(stage, budget: 300, interval: 5, attempt_timeout: 5)\n    raise\
    \ ArgumentError unless %w[dependencies schema].include?(stage)\n\n    started = now\n    deadline = started\
    \ + budget\n    loop do\n      remaining = deadline - now\n      break if remaining <= 0\n      begin\n    \
    \    Timeout.timeout([attempt_timeout, remaining].min) { public_send(stage) }\n        log(stage, 'ready', started)\n\
    \        return true\n      rescue StandardError, LoadError\n        log(stage, 'waiting', started) # Driver\
    \ exceptions may contain credentials.\n      end\n      sleep [interval, [deadline - now, 0].max].min\n    end\n\
    \    log(stage, 'timeout', started)\n    false\n  end\n\n  def self.stop_child(pid)\n    return unless pid\n\
    \n    Process.kill('TERM', -pid)\n    deadline = now + 5\n    loop do\n      return if Process.waitpid(pid,\
    \ Process::WNOHANG)\n      break if now >= deadline\n      sleep 0.1\n    end\n    Process.kill('KILL', -pid)\n\
    \    Process.waitpid(pid)\n  rescue Errno::ESRCH, Errno::ECHILD\n    nil\n  end\n\n  def self.run_migration(connection,\
    \ deadline)\n    # Fixed argv, no shell and no default raw migration/driver output.\n    started = now\n   \
    \ pid = Process.spawn({ 'SKIP_POST_DEPLOYMENT_MIGRATIONS' => nil }, *MIGRATION_COMMAND,\n                  \
    \      pgroup: true, out: File::NULL, err: File::NULL)\n    loop do\n      if Process.waitpid(pid, Process::WNOHANG)\n\
    \        status = $?\n        pid = nil\n        log('migration_process', status.success? ? 'complete' : 'failed',\
    \ started, exit_code: status.exitstatus)\n        raise NotReady unless status.success?\n        return\n  \
    \    end\n      raise NotReady if now >= deadline\n      # A lost coordinator lock/session must not leave an\
    \ unobserved writer running.\n      Timeout.timeout(5) { connection.exec('SELECT 1 AS ready') }\n      sleep\
    \ 1\n    end\n  ensure\n    stop_child(pid)\n  end\n\n  def self.migrate(budget: 1800, interval: 5)\n    raise\
    \ ArgumentError unless ENV['MASTODON_MIGRATION_OWNER'] == 'web-init'\n\n    started = now\n    deadline = started\
    \ + budget\n    connection = Timeout.timeout(5) { postgres }\n    loop do\n      acquired = Timeout.timeout(5)\
    \ do\n        connection.exec(\"SELECT pg_try_advisory_lock(#{LOCK}) AS acquired\").first.fetch('acquired')\
    \ == 't'\n      end\n      break if acquired\n      raise NotReady if now >= deadline\n      log('migration_lock',\
    \ 'waiting', started)\n      sleep [interval, [deadline - now, 0].max].min\n    end\n    schema_versions(connection)\
    \ # Refuse an empty or missing production schema.\n    if pending?(connection)\n      # Initial adoption must\
    \ be no-op; future writes need a reviewed maintenance commit.\n      raise NotReady unless ENV['MASTODON_ALLOW_PENDING_MIGRATIONS']\
    \ == 'true'\n      log('migrations', 'running', started)\n      run_migration(connection, deadline)\n      raise\
    \ NotReady if pending?(connection)\n      log('migrations', 'complete', started)\n    else\n      log('migrations',\
    \ 'already_applied', started)\n    end\n    true\n  ensure\n    connection&.close\n  end\n\n  def self.main(mode)\n\
    \    case mode\n    when 'dependencies' then wait('dependencies')\n    when 'schema' then wait('schema', budget:\
    \ 1800)\n    when 'migrate'\n      wait('dependencies') && migrate\n    else raise ArgumentError\n    end\n\
    \  end\nend\n\nif $PROGRAM_NAME == __FILE__\n  $stdout.sync = true\n  Signal.trap('TERM') { raise Interrupt\
    \ }\n  Signal.trap('INT') { raise Interrupt }\n  begin\n    success = MastodonStartup.main(ARGV.fetch(0))\n\
    \  rescue StandardError, LoadError, Interrupt\n    puts JSON.generate(event: 'mastodon_startup', result: 'blocked')\n\
    \    success = false\n  end\n  exit(success ? 0 : 1)\nend\n"
