apiVersion: apps/v1
kind: Deployment
metadata:
  name: mastodon-streaming
  labels:
    app.kubernetes.io/name: mastodon
    app.kubernetes.io/instance: mastodon
    app.kubernetes.io/version: 2026-11-09-022903
    app.kubernetes.io/managed-by: argocd
  annotations:
    configmap.reloader.stakater.com/auto: 'true'
  namespace: mastodon
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mastodon
      app.kubernetes.io/instance: mastodon
      app.kubernetes.io/component: streaming
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mastodon
        app.kubernetes.io/instance: mastodon
        app.kubernetes.io/component: streaming
      annotations:
        rollme: '1'
        checksum/config-configmap: 078166d4ca0c98354f5687013569e5a1da02fa4e6bddcfdf13b8c451d0d4a661
        checksum/mastodon-startup: 9a8599a3ce18057b2f4c7af15f39f693cef862f375a3cf359fcb8dcb816646bc
    spec:
      serviceAccountName: mastodon
      hostAliases:
      - hostnames:
        - andreybondarenko.com
        ip: 192.168.30.210
      securityContext:
        fsGroup: 991
        runAsGroup: 991
        runAsNonRoot: true
        runAsUser: 991
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: startup-gate
        configMap:
          name: mastodon-startup-gate
      containers:
      - name: mastodon-streaming
        envFrom:
        - configMapRef:
            name: mastodon-env
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        image: harbor.andreybondarenko.com/github/mastodon/mastodon-streaming:v4.7.5@sha256:3859d071e61a0ed2610a00e8048d89310235afb86e6923c0243bb4f9f4a31093
        imagePullPolicy: Always
        command:
        - node
        - ./streaming
        volumeMounts: null
        env:
        - name: PORT
          value: '4000'
        - name: SECRET_KEY_BASE
          valueFrom:
            secretKeyRef:
              name: mastodon
              key: SECRET_KEY_BASE
        - name: VAPID_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: mastodon
              key: VAPID_PRIVATE_KEY
        - name: VAPID_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: mastodon
              key: VAPID_PUBLIC_KEY
        - name: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
          valueFrom:
            secretKeyRef:
              name: mastodon
              key: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
        - name: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
          valueFrom:
            secretKeyRef:
              name: mastodon
              key: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
        - name: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
          valueFrom:
            secretKeyRef:
              name: mastodon
              key: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: postgres-password
              key: password
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: postgres-password
              key: username
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mastodon-redis
              key: redis-password
        - name: ALLOW_UNSAFE_AUTH_PROVIDER_REATTACH
          value: 'true'
        - name: BIND
          value: '[::]'
        ports:
        - name: streaming
          containerPort: 4000
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /api/v1/streaming/health
            port: streaming
        readinessProbe:
          httpGet:
            path: /api/v1/streaming/health
            port: streaming
        startupProbe:
          httpGet:
            path: /api/v1/streaming/health
            port: streaming
          initialDelaySeconds: 5
          failureThreshold: 15
          periodSeconds: 5
        resources:
          limits:
            memory: 110Mi
          requests:
            cpu: 37m
            memory: 110Mi
      automountServiceAccountToken: false
      initContainers:
      - name: wait-for-data-services
        image: harbor.andreybondarenko.com/library/mastodon:2026-11-09-022903@sha256:ee235351bb9d0426060f01dbb3e0c2c4d9dd2a134f178b74e8bd5f108083693d
        imagePullPolicy: Always
        workingDir: /opt/mastodon
        command:
        - bundle
        - exec
        - ruby
        - /startup-gate/mastodon_startup.rb
        - dependencies
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        envFrom:
        - configMapRef:
            name: mastodon-env
        env:
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: postgres-password
              key: password
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: postgres-password
              key: username
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mastodon-redis
              key: redis-password
        volumeMounts:
        - name: startup-gate
          mountPath: /startup-gate
          readOnly: true
      - name: wait-for-schema
        image: harbor.andreybondarenko.com/library/mastodon:2026-11-09-022903@sha256:ee235351bb9d0426060f01dbb3e0c2c4d9dd2a134f178b74e8bd5f108083693d
        imagePullPolicy: Always
        workingDir: /opt/mastodon
        command:
        - bundle
        - exec
        - ruby
        - /startup-gate/mastodon_startup.rb
        - schema
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        envFrom:
        - configMapRef:
            name: mastodon-env
        env:
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: postgres-password
              key: password
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: postgres-password
              key: username
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mastodon-redis
              key: redis-password
        volumeMounts:
        - name: startup-gate
          mountPath: /startup-gate
          readOnly: true
