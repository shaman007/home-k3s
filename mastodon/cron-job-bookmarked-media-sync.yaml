apiVersion: batch/v1
kind: CronJob
metadata:
  name: bookmarked-media-sync
  namespace: mastodon
  labels:
    app.kubernetes.io/name: bookmarked-media-sync
    app.kubernetes.io/instance: bookmarked-media-sync
    app.kubernetes.io/part-of: mastodon
    app.kubernetes.io/managed-by: argoCD
spec:
  schedule: 0 * * * *
  timeZone: Europe/Prague
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3300
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: bookmarked-media-sync
            app.kubernetes.io/instance: bookmarked-media-sync
            app.kubernetes.io/part-of: mastodon
        spec:
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          priorityClassName: homelab-batch
          enableServiceLinks: false
          serviceAccountName: bookmarked-media-sync
          restartPolicy: Never
          initContainers:
          - name: fetch-bookmarked-media
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            image: harbor.andreybondarenko.com/dockerhub/alpine:3.24
            imagePullPolicy: IfNotPresent
            command:
            - /bin/sh
            - -lc
            - 'set -eu

              apk add --no-cache ca-certificates coreutils curl jq kubectl

              /bin/sh /cron-gate/bookmarked_job_gate.sh

              '
            env:
            - name: BOOKMARKED_MEDIA_LOOKBACK_DAYS
              value: '30'
            - name: BOOKMARKED_MEDIA_DOWNLOAD_MAX_ATTEMPTS
              value: '3'
            - name: BOOKMARKED_MEDIA_DOWNLOAD_RETRY_DELAY_SECONDS
              value: '15'
            - name: IMMICH_INSTANCE_URL
              value: https://immich.andreybondarenko.com/api
            - name: IMMICH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bookmarked-media-sync
                  key: IMMICH_API_KEY
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 512Mi
            volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: work
              mountPath: /work
            - name: cron-gate
              mountPath: /cron-gate
              readOnly: true
          containers:
          - name: immich-upload
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            image: harbor.andreybondarenko.com/dockerhub/node:26-alpine
            imagePullPolicy: IfNotPresent
            command:
            - /bin/sh
            - -lc
            - "set -eu\n# BEGIN dependency gate\nif [ -f /work/.dependencies-skipped\
              \ ]; then\n  printf '{\"event\":\"cron_dependencies\",\"result\":\"\
              skipped\"}\\n'\n  exit 0\nfi\nstatus=0\nnode /cron-gate/bookmarked_upload_probe.cjs\
              \ || status=$?\ncase \"$status\" in 0) ;; 75) exit 0 ;; *) exit \"$status\"\
              \ ;; esac\n# END dependency gate\nif ! find /import -type f -print -quit\
              \ | grep -q .; then\n  echo \"No bookmarked media files to upload\"\n\
              \  exit 0\nfi\n\nnpm install -g @immich/cli@3.0.2\nimmich -d /config\
              \ login-key \"${IMMICH_INSTANCE_URL}\" \"${IMMICH_API_KEY}\"\nupload_args=\"\
              --recursive --no-progress\"\nif [ \"${BOOKMARKED_MEDIA_IMMICH_DRY_RUN:-false}\"\
              \ = \"true\" ]; then\n  upload_args=\"${upload_args} --dry-run --json-output\"\
              \nfi\n\n# Deliberately word-split the composed option list.\n# shellcheck\
              \ disable=SC2086\nimmich -d /config upload ${upload_args} /import\n\n\
              if [ \"${BOOKMARKED_MEDIA_IMMICH_DRY_RUN:-false}\" != \"true\" ]; then\n\
              \  apk add --no-cache ca-certificates coreutils curl jq\n  /scripts/apply-immich-descriptions.sh\n\
              \n  echo \"Queueing face detection for assets missing face processing\"\
              \n  if curl --fail --silent --show-error \\\n    --retry 5 \\\n    --connect-timeout\
              \ 15 \\\n    --max-time 60 \\\n    -o /dev/null \\\n    -X PUT \\\n\
              \    -H \"content-type: application/json\" \\\n    -H \"x-api-key: ${IMMICH_API_KEY}\"\
              \ \\\n    -d '{\"command\":\"start\",\"force\":false}' \\\n    \"${IMMICH_INSTANCE_URL}/jobs/faceDetection\"\
              ; then\n    echo \"Queued missing face detection jobs\"\n  else\n  \
              \  echo \"Warning: could not queue face detection; the endpoint requires\
              \ an Immich admin API key\" >&2\n  fi\nfi\n"
            env:
            - name: IMMICH_INSTANCE_URL
              value: https://immich.andreybondarenko.com/api
            - name: IMMICH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bookmarked-media-sync
                  key: IMMICH_API_KEY
            - name: BOOKMARKED_MEDIA_IMMICH_DRY_RUN
              value: 'false'
            - name: NO_COLOR
              value: '1'
            resources:
              requests:
                cpu: 10m
                memory: 512Mi
              limits:
                memory: 512Mi
            volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: work
              mountPath: /import
              subPath: import
            - name: work
              mountPath: /work
            - name: immich-config
              mountPath: /config
            - name: cron-gate
              mountPath: /cron-gate
              readOnly: true
          volumes:
          - name: scripts
            configMap:
              name: bookmarked-media-sync-scripts
              defaultMode: 365
          - name: work
            emptyDir: {}
          - name: immich-config
            emptyDir: {}
          - name: cron-gate
            configMap:
              name: bookmarked-media-sync-dependencies-8f14e44a2a69
