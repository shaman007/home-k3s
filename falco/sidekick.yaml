apiVersion: v1
kind: ConfigMap
metadata:
  name: falcosidekick
  namespace: kube-system
data:
  config.yaml: |
    debug: false
    customfields:
      job: falco
      category: security
      owner: homelab
    alertmanager:
      hostport: http://alertmanager.monitoring.svc.cluster.local:9093
      endpoint: /api/v2/alerts
      expiresafter: 900
      minimumpriority: warning
      # Keep per-event time in Loki/output annotations, not in alert identity.
      extralabels:
        evt_time: ""
        # Preserve redirect diagnostics in output/Loki without splitting identity.
        proc_pid: ""
        proc_ppid: ""
        proc_vpid: ""
        thread_vtid: ""
        proc_duration: ""
        evt_rawarg_oldfd: ""
        thread_tid: ""
        evt_type: ""
        evt_rawres: ""
        fd_num: ""
        fd_type: ""
        fd_name: ""
        container_image_tag: ""
        fd_is_server: ""
        fd_l4proto: ""
        fd_cip: ""
        fd_sport: ""
        job: falco
        category: security
        owner: homelab
        priority: warning
        severity: mail
        namespace: kube-system
    loki:
      hostport: http://loki-gateway.loki.svc.cluster.local
      format: json
      # Notice is reserved for the scoped repo-server lifecycle diagnostic.
      minimumpriority: notice
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: falcosidekick
  namespace: kube-system
  annotations:
    configmap.reloader.stakater.com/auto: 'true'
spec:
  replicas: 2
  selector:
    matchLabels:
      app: falcosidekick
  template:
    metadata:
      labels:
        app: falcosidekick
    spec:
      serviceAccountName: falcosidekick
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1234
        runAsGroup: 1234
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: falcosidekick
      containers:
      - name: falcosidekick
        image: harbor.andreybondarenko.com/dockerhub/falcosecurity/falcosidekick:2.35.1
        args:
        - -c
        - /etc/falcosidekick/config.yaml
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: 2801
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        volumeMounts:
        - name: config
          mountPath: /etc/falcosidekick
          readOnly: true
        readinessProbe:
          httpGet:
            path: /ping
            port: http
          initialDelaySeconds: 5
        livenessProbe:
          httpGet:
            path: /ping
            port: http
          initialDelaySeconds: 15
      volumes:
      - name: config
        configMap:
          name: falcosidekick
---
apiVersion: v1
kind: Service
metadata:
  name: falcosidekick
  namespace: kube-system
spec:
  selector:
    app: falcosidekick
  ports:
  - name: http
    port: 2801
    targetPort: http
