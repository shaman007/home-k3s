apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: bitwarden
  name: andreybondarenko-ingress
  annotations:
    # Traefik router on HTTPS entrypoint
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"

    # Apply HSTS middleware
    traefik.ingress.kubernetes.io/router.middlewares: traefik-geoip-country@kubernetescrd,bitwarden-hsts@kubernetescrd,traefik-robots-disallow-all@kubernetescrd
    # (optional) HTTP->HTTPS is handled globally on entryPoints (see above),
    # so no per-ingress redirect annotation is needed.
  labels:
    app: bitwarden
    app.kubernetes.io/name: bitwarden
    app.kubernetes.io/instance: bitwarden
    app.kubernetes.io/version: "beta"
    app.kubernetes.io/managed-by: argoCD
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - bitwarden.andreybondarenko.com
      secretName: bitwarden-tls

  rules:
    - host: bitwarden.andreybondarenko.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bitwarden
                port:
                  number: 80
