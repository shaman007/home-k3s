---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-secret-store
  namespace: bitwarden
  annotations:
      vault.w386.k8s.my.lan/token-policies: bitwarden
  labels:
      app.kubernetes.io/name: bitwarden
      app.kubernetes.io/instance: bitwarden
      app.kubernetes.io/part-of: bitwarden
      app.kubernetes.io/managed-by: argo-cd
spec:
  refreshInterval: 900
  provider:
    vault:
      server: "https://openbao-api.int.andreybondarenko.com:8200"
      path: "kv"
      version: "v2"
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets-bitwarden
          serviceAccountRef:
            name: vault-auth
            audiences:
              - vault
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: bitwarden
automountServiceAccountToken: false
