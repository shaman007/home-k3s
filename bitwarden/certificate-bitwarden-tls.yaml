---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bitwarden-tls
  namespace: bitwarden
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: bitwarden-tls
  dnsNames:
    - bitwarden.andreybondarenko.com
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-prod
