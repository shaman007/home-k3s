---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: bitwarden
  labels:
    app: bitwarden
    service: bitwarden
    app.kubernetes.io/name: bitwarden
    app.kubernetes.io/instance: bitwarden
    app.kubernetes.io/part-of: bitwarden
    app.kubernetes.io/managed-by: argo-cd
  annotations:
    configmap.reloader.stakater.com/auto: "true"
  name: bitwarden
spec:
  replicas: 1
  selector:
    matchLabels:
      service: bitwarden
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        service: bitwarden
        db-client: bitwarden-postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      priorityClassName: homelab-essential
      initContainers:
        - name: prepare-runtime
          image: harbor.andreybondarenko.com/library/bitwarden:2026-08-14-142026
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/prepare-runtime.sh
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /etc/bitwarden
              name: bitwarden-lh
            - mountPath: /runtime
              name: runtime
            - mountPath: /tmp
              name: tmp
            - mountPath: /var/lib/nginx
              name: nginx-cache
            - mountPath: /var/log
              name: logs-root
      containers:
        - env:
            - name: BW_DOMAIN
              value: "bitwarden.andreybondarenko.com"
            - name: DOTNET_DataProtection__PersistKeysToFileSystem
              value: "/etc/bitwarden/data-protection"
            - name: BW_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: id
                  key: id
            - name: BW_INSTALLATION_KEY
              valueFrom:
                secretKeyRef:
                  name: key
                  key: key
            - name: BW_DB_PROVIDER
              value: postgresql
            - name: BW_DB_SERVER
              value: "bitwarden-postgres.bitwarden.svc.cluster.local"
            - name: BW_DB_DATABASE
              value: "bw"
            - name: BW_DB_USERNAME
              value: "postgres"
            - name: BW_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-pass
                  key: password
            - name: globalSettings__mail__smtp__host
              value: "andreybondarenko.com"
            - name: globalSettings__mail__smtp__port
              value: "25"
            - name: globalSettings__mail__smtp__ssl
              value: "false"
            - name: globalsettings__yubico__clientId
              valueFrom:
                secretKeyRef:
                  name: yubico-client-id
                  key: client-id
            - name: globalsettings__yubico__key
              valueFrom:
                secretKeyRef:
                  name: yubico-secret-key
                  key: secret-key
          image: harbor.andreybondarenko.com/library/bitwarden:2026-08-14-142026
          imagePullPolicy: IfNotPresent
          name: bitwarden
          ports:
            - containerPort: 8080
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 1
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "100m"
              memory: "1728Mi"
            limits:
              memory: "2304Mi"
          volumeMounts:
            - mountPath: /etc/bitwarden
              name: bitwarden-lh
            - mountPath: /app/Notifications/.aspnet
              name: keys-lh
            - name: logs-root
              mountPath: /var/log
            - name: logs
              mountPath: /var/log/bitwarden
            - name: nginx-cache
              mountPath: /var/lib/nginx
            - name: nginx-run
              mountPath: /var/run/nginx
            - name: runtime
              mountPath: /etc/supervisor.d
              subPath: supervisor
            - name: runtime
              mountPath: /etc/nginx/http.d
              subPath: nginx
            - name: runtime
              mountPath: /app/Identity/identity.pfx
              subPath: identity/identity.pfx
            - name: runtime
              mountPath: /app/Sso/identity.pfx
              subPath: identity/sso-identity.pfx
            - name: runtime
              mountPath: /app/Web/app-id.json
              subPath: web/app-id.json
            - name: run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
        - name: alloy
          image: harbor.andreybondarenko.com/dockerhub/grafana/alloy:v1.18.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 473
            runAsNonRoot: true
            runAsUser: 473
            seccompProfile:
              type: RuntimeDefault
          args:
            - run
            - /etc/alloy/config.alloy
            - --server.http.listen-addr=0.0.0.0:12345
          resources:
            requests:
              cpu: "25m"
              memory: "96Mi"
            limits:
              memory: "144Mi"
          volumeMounts:
            - name: alloy-config
              mountPath: /etc/alloy
              readOnly: true
            - name: alloy-run
              mountPath: /run/alloy
            - name: alloy-data
              mountPath: /var/lib/alloy
            - name: alloy-component-data
              mountPath: /data-alloy
            - name: alloy-tmp
              mountPath: /tmp
            - mountPath: /etc/bitwarden
              name: bitwarden-lh
            - name: logs
              mountPath: /var/log/bitwarden
      volumes:
        - name: bitwarden-lh
          persistentVolumeClaim:
            claimName: data-lh
        - name: keys-lh
          persistentVolumeClaim:
            claimName: keys-lh
        - name: alloy-config
          configMap:
            name: alloy-bitwarden-config
        - name: alloy-run
          emptyDir: {}
        - name: alloy-data
          emptyDir: {}
        - name: alloy-component-data
          emptyDir: {}
        - name: alloy-tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: logs-root
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: runtime
          emptyDir: {}
        - name: tmp
          emptyDir: {}
