---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: harbor-tls
  namespace: harbor
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: harbor-tls
  dnsNames:
    - harbor.andreybondarenko.com
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-prod
