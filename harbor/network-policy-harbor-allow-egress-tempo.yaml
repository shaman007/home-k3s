apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: harbor-allow-egress-tempo
  namespace: harbor
spec:
  podSelector:
    matchLabels:
      app: harbor
    matchExpressions:
    - key: component
      operator: In
      values:
      - core
      - jobservice
      - registry
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app: tempo
    ports:
    - protocol: TCP
      port: 4318
