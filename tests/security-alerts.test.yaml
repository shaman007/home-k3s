    values: 300+0x20
  alert_rule_test:
  - eval_time: 10m
    alertname: KubernetesUnexpectedSecretRead
    exp_alerts:
    - exp_labels:
        severity: mail
        owner: homelab
        priority: warning
        category: security
        namespace: kube-system
        job: kubernetes-audit
        node: node-a
        outcome: allowed
      exp_annotations:
        summary: Secret access outside reviewed reader exceptions via API server node-a (allowed)
        description: One or more matching events occurred within 15 minutes; this alert groups events by API server and outcome, not by attacker. See the who/action/target table in Security Overview. Query Loki {job="kubernetes-audit",detection="secret_read",node="node-a"} for actor, target and response code. Allowed, denied, failed and dry-run events are separate; an attempt does not prove compromise.
