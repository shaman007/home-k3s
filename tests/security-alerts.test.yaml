    values: 1+0x20
  - series: kube_node_role{node="node-b",role="control-plane"}
    values: 1+0x20
  - series: up{job="kubernetes-audit",instance="a",node="node-a"}
    values: 1+0x20
  alert_rule_test:
  - eval_time: 10m
    alertname: KubernetesAuditNodeMissing
    exp_alerts:
    - exp_labels:
        severity: mail
        owner: homelab
        priority: warning
        category: security
        namespace: kube-system
        job: kubernetes-audit
        node: node-b
      exp_annotations:
        summary: No healthy audit collector for control-plane node-b
        description: Check the kubernetes-audit DaemonSet scheduling and scrape discovery.
          Another healthy node does not cover this node audit file.
        runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/kubernetes-audit.md
- name: reachable collector without audit file data
  interval: 1m
  input_series:
  - series: up{job="kubernetes-audit",instance="a",node="node-a"}
    values: 1+0x20
  alert_rule_test:
  - eval_time: 10m
    alertname: KubernetesAuditTelemetryStale
    exp_alerts:
    - exp_labels:
        severity: mail
        owner: homelab
        priority: warning
        category: security
        namespace: kube-system
        node: node-a
        instance: a
        job: kubernetes-audit
      exp_annotations:
        summary: Kubernetes audit collection is stale on node-a
        description: Audit events have stopped arriving or the source metric is absent
          despite a reachable collector. Inspect file permissions, file tailer and
          positions. Scrape health alone does not prove audit coverage.
        runbook_url: https://github.com/shaman007/home-k3s/blob/main/docs/kubernetes-audit.md
