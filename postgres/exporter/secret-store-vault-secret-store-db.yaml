---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-secret-store-db
  namespace: kube-system
  labels:
    app: postgres-exporter
    app.kubernetes.io/name: postgres-exporter
    app.kubernetes.io/instance: postgres-exporter
    app.kubernetes.io/version: "v0.19.1"
    app.kubernetes.io/managed-by: argoCD
spec:
  refreshInterval: 900
  provider:
    vault:
      server: "https://openbao-api.int.andreybondarenko.com:8200"
      path: "kv"
      version: "v2"
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets-db
          serviceAccountRef:
            name: vault-auth
            audiences:
              - vault
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: kube-system
automountServiceAccountToken: false
