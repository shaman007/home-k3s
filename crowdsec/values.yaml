image:
  repository: harbor.andreybondarenko.com/library/crowdsec-rootless
  tag: v1.8.1-rootless.2@sha256:2562c531bff29008d08aa56cc7043f8f4f42f71447e62ef6c5aa336f0a1dcc7d
container_runtime: containerd
secrets:
  externalSecret:
    name: crowdsec-bootstrap
config:
  simulation.yaml: |
    simulation: true
    exclusions:
    - crowdsecurity/http-backdoors-attempts
    - crowdsecurity/http-cve-probing
    - crowdsecurity/thinkphp-cve-2018-20062
    - crowdsecurity/CVE-2017-9841
    - crowdsecurity/CVE-2022-41082
    - crowdsecurity/jira_cve-2021-26086
  profiles.yaml: |
    name: explicit_exploit_short_ban
    filters:
    - Alert.Remediation == true && Alert.GetScope() == "Ip" && Alert.GetScenario() in ["crowdsecurity/http-backdoors-attempts", "crowdsecurity/http-cve-probing", "crowdsecurity/thinkphp-cve-2018-20062", "crowdsecurity/CVE-2017-9841", "crowdsecurity/CVE-2022-41082", "crowdsecurity/jira_cve-2021-26086"]
    decisions:
    - type: ban
      duration: 15m
    on_success: break
  config.yaml.local: |
    db_config:
      db_path: /var/lib/crowdsec/data/crowdsec-rootless.db
    api:
      server:
        auto_registration:
          enabled: true
          token: "${REGISTRATION_TOKEN}"
          allowed_ranges:
            - "10.42.0.0/16"
            - "fd74:67a:1fcf:4200::/56"
    prometheus:
      enabled: true
      level: full
      listen_addr: 0.0.0.0
      listen_port: 6060
  agent_config.yaml.local: |
    crowdsec_service:
      acquisition_path: /etc/crowdsec/kubernetes-acquisition.yaml
    prometheus:
      enabled: true
      level: full
      listen_addr: 0.0.0.0
      listen_port: 6060
lapi:
  # Stop the legacy SQLite writer before taking the rootless backup.
  strategy:
    type: Recreate
  extraInitContainers:
  - name: prepare-rootless-database
    image: harbor.andreybondarenko.com/library/crowdsec-rootless:v1.8.1-rootless.2@sha256:2562c531bff29008d08aa56cc7043f8f4f42f71447e62ef6c5aa336f0a1dcc7d
    imagePullPolicy: IfNotPresent
    command:
    - /usr/local/bin/crowdsec-rootless-prepare-database
    - /var/lib/crowdsec/data/crowdsec.db
    - /var/lib/crowdsec/data/crowdsec-rootless.db
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 256Mi
    volumeMounts:
    - name: crowdsec-db
      mountPath: /var/lib/crowdsec/data
      subPath: crowdsec
  # The rootless image and kubelet fsGroup handle startup without capabilities.
  securityContext:
    allowPrivilegeEscalation: false
    privileged: false
    capabilities:
      drop:
      - ALL
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  replicas: 1
  env:
  - name: DISABLE_ONLINE_API
    value: 'true'
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: null # Remove the chart's default CPU limit.
      memory: 512Mi
  persistentVolume:
    data:
      storageClassName: longhorn
      size: 1Gi
    config:
      storageClassName: longhorn
      size: 100Mi
agent:
  # The rootless image and kubelet fsGroup handle startup without capabilities.
  securityContext:
    allowPrivilegeEscalation: false
    privileged: false
    capabilities:
      drop:
      - ALL
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  wait_for_lapi:
    securityContext:
      allowPrivilegeEscalation: false
      privileged: false
      capabilities:
        drop:
        - ALL
  isDeployment: true
  replicas: 1
  serviceAccountName: crowdsec-agent
  hostVarLog: false
  acquisition: []
  additionalAcquisition:
  - source: file
    filenames:
    - /dev/null
    labels:
      type: traefik
  env:
  - name: COLLECTIONS
    value: crowdsecurity/traefik
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: null # Remove the chart's default CPU limit.
      memory: 512Mi
  extraVolumes:
  - name: agent-runtime-config
    emptyDir: {}
  - name: kubernetes-acquisition
    configMap:
      name: crowdsec-kubernetes-acquisition
  extraVolumeMounts:
  - name: agent-runtime-config
    mountPath: /etc/crowdsec
  - name: kubernetes-acquisition
    mountPath: /staging/etc/crowdsec/kubernetes-acquisition.yaml
    subPath: acquis.yaml
    readOnly: true
appsec:
  enabled: false
