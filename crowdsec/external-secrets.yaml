apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: crowdsec
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: crowdsec-store
  namespace: crowdsec
spec:
  refreshInterval: 900
  provider:
    vault:
      server: https://openbao-api.int.andreybondarenko.com:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets-crowdsec
          serviceAccountRef:
            name: vault-auth
            audiences:
            - vault
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-bootstrap
  namespace: crowdsec
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: crowdsec-store
    kind: SecretStore
  target:
    name: crowdsec-bootstrap
    creationPolicy: Owner
  data:
  - secretKey: csLapiSecret
    remoteRef:
      key: crowdsec
      property: csLapiSecret
  - secretKey: registrationToken
    remoteRef:
      key: crowdsec
      property: registrationToken
