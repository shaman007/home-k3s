apiVersion: v1
kind: ServiceAccount
metadata:
  name: crowdsec-agent
  namespace: crowdsec
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crowdsec-traefik-logs
  namespace: traefik
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - pods/log
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crowdsec-traefik-logs
  namespace: traefik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: crowdsec-traefik-logs
subjects:
- kind: ServiceAccount
  name: crowdsec-agent
  namespace: crowdsec
