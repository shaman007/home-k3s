apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: crowdsec-agent-kube-api
  namespace: crowdsec
spec:
  endpointSelector:
    matchLabels:
      k8s-app: crowdsec
      type: agent
  egress:
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: '6443'
        protocol: TCP
      - port: '443'
        protocol: TCP
