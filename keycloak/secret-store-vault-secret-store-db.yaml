apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-secret-store-db
  namespace: keycloak
  annotations:
    vault.w386.k8s.my.lan/token-policies: db
  labels:
    app: keycloak
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: keycloak
    app.kubernetes.io/version: "26.5.6"
    app.kubernetes.io/managed-by: argoCD
spec:
  refreshInterval: 900
  provider:
    vault:
      server: "https://openbao-api.int.andreybondarenko.com:8200"
      path: "kv"
      version: "v2"
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets-db
          serviceAccountRef:
            name: vault-auth
            audiences:
              - vault
