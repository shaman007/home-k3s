apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: talos-backup-config
  namespace: talos-backup
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-secret-store
    kind: SecretStore
  target:
    name: talos-backup-config
    creationPolicy: Owner
  data:
  - secretKey: AWS_ACCESS_KEY_ID
    remoteRef:
      key: talos-backup
      property: AWS_ACCESS_KEY_ID
  - secretKey: AWS_SECRET_ACCESS_KEY
    remoteRef:
      key: talos-backup
      property: AWS_SECRET_ACCESS_KEY
  - secretKey: AGE_RECIPIENT_PUBLIC_KEY
    remoteRef:
      key: talos-backup
      property: AGE_RECIPIENT_PUBLIC_KEY
