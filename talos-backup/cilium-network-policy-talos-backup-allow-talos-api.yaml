apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: talos-backup-allow-talos-api
  namespace: talos-backup
spec:
  endpointSelector:
    matchLabels:
      app: talos-backup
  egress:
    # default/talos is a selectorless Service backed by control-plane host IPs.
    # Cilium host/node identities require an entity rule, not only ipBlock CIDRs.
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "50000"
              protocol: TCP
