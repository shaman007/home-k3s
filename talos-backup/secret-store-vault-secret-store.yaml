apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-secret-store
  namespace: talos-backup
  annotations:
    vault.w386.k8s.my.lan/token-policies: talos-backup
spec:
  refreshInterval: 900
  provider:
    vault:
      server: https://openbao-api.int.andreybondarenko.com:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets-talos-backup
          serviceAccountRef:
            name: vault-auth
            audiences:
            - vault
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: talos-backup
automountServiceAccountToken: false
