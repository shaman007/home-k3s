---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bitwarden
  namespace: argocd
spec:
  project: applications
  source:
    repoURL: 'https://github.com/shaman007/home-k3s.git'
    path: bitwarden
    targetRevision: main
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: bitwarden
  syncPolicy:
    automated:
      selfHeal: true
