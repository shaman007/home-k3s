---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clamav
  namespace: argocd
spec:
  project: applications
  source:
    repoURL: 'https://github.com/shaman007/home-k3s.git'
    path: clamav
    targetRevision: HEAD
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: clamav
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
