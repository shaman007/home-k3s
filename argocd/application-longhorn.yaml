---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
  finalizers:
    - pre-delete-finalizer.argocd.argoproj.io
    - pre-delete-finalizer.argocd.argoproj.io/cleanup
spec:
  syncPolicy:
    automated:
      selfHeal: true
      enabled: true
    syncOptions:
      - CreateNamespace=true
  project: storage
  sources:
    - chart: longhorn
      repoURL: https://charts.longhorn.io/
      targetRevision: 1.12.1
      helm:
        values: |
          preUpgradeChecker:
            jobEnabled: false
          defaultSettings:
            createDefaultDiskLabeledNodes: true
            priorityClass: homelab-critical
            taintToleration: node-role.kubernetes.io/control-plane:NoSchedule
          longhornManager:
            priorityClass: homelab-critical
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
                effect: NoSchedule
          longhornDriver:
            priorityClass: homelab-critical
          longhornUI:
            priorityClass: homelab-critical
          persistence:
            defaultClassReplicaCount: 1
            defaultDataLocality: best-effort
            recurringJobSelector:
              enable: true
              jobList: '[{"name":"trim-daily-a","isGroup":false}]'
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
