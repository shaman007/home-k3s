---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
  finalizers:
    - pre-delete-finalizer.argocd.argoproj.io
    - pre-delete-finalizer.argocd.argoproj.io/cleanup
spec:
  syncPolicy:
    automated:
      selfHeal: true
      enabled: true
    syncOptions:
      - CreateNamespace=true
  project: storage
  sources:
    - chart: longhorn
      repoURL: https://charts.longhorn.io/
      targetRevision: 1.13.0
      helm:
        values: |
          preUpgradeChecker:
            jobEnabled: false
          defaultSettings:
            # Native setting covers CSI pods created by Longhorn after Helm renders.
            systemManagedCSIComponentsResourceLimits: |
              {
                "csi-attacher": {"requests": {"cpu": "10m","memory": "64Mi"},"limits": {"memory": "256Mi"}},
                "csi-provisioner": {"requests": {"cpu": "10m","memory": "128Mi"},"limits": {"memory": "512Mi"}},
                "csi-resizer": {"requests": {"cpu": "10m","memory": "64Mi"},"limits": {"memory": "256Mi"}},
                "csi-snapshotter": {"requests": {"cpu": "10m","memory": "64Mi"},"limits": {"memory": "256Mi"}},
                "longhorn-csi-plugin": {"requests": {"cpu": "10m","memory": "128Mi"},"limits": {"memory": "512Mi"}},
                "node-driver-registrar": {"requests": {"cpu": "10m","memory": "32Mi"},"limits": {"memory": "128Mi"}},
                "longhorn-liveness-probe": {"requests": {"cpu": "10m","memory": "32Mi"},"limits": {"memory": "128Mi"}}
              }
            # Limit recovery I/O contention on the shared node disks/network.
            concurrentReplicaRebuildPerNodeLimit: 1
            allowRecurringJobWhileVolumeDetached: true
            createDefaultDiskLabeledNodes: true
            priorityClass: homelab-critical
            taintToleration: node-role.kubernetes.io/control-plane:NoSchedule
          longhornManager:
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
            priorityClass: homelab-critical
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
                effect: NoSchedule
          longhornGlobalManager:
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
          longhornDriver:
            priorityClass: homelab-critical
          longhornUI:
            priorityClass: homelab-critical
          persistence:
            defaultClassReplicaCount: 2
            defaultDataLocality: best-effort
            recurringJobSelector:
              enable: true
              jobList: '[{"name":"trim-daily-a","isGroup":false}]'
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
