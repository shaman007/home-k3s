---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bastioncam
  namespace: argocd
spec:
  project: applications
  source:
    repoURL: "https://github.com/shaman007/home-k3s.git"
    path: bastioncam
    targetRevision: main
  destination:
    server: "https://kubernetes.default.svc"
    namespace: bastioncam
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
