apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crowdsec-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: crowdsec
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  source:
    repoURL: https://github.com/shaman007/home-k3s.git
    targetRevision: main
    path: crowdsec
    directory:
      include: '{network-policy-*.yaml,cilium-network-policy-*.yaml,rbac.yaml,external-secrets.yaml,config-map-*.yaml}'
