---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: applications
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: applications
    app.kubernetes.io/part-of: argocd
    app.kubernetes.io/managed-by: argoCD
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: User-facing applications and their supporting namespaced resources
  sourceRepos:
    - https://collaboraonline.github.io/online/
    - https://github.com/shaman007/home-k3s.git
    - https://helm.goharbor.io
    - https://mastodon.github.io/helm-charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: backup-rsync
    - server: https://kubernetes.default.svc
      namespace: bitwarden
    - server: https://kubernetes.default.svc
      namespace: ca-scanner
    - server: https://kubernetes.default.svc
      namespace: clamav
    - server: https://kubernetes.default.svc
      namespace: comfyui
    - server: https://kubernetes.default.svc
      namespace: convertx
    - server: https://kubernetes.default.svc
      namespace: dawarich
    - server: https://kubernetes.default.svc
      namespace: harbor
    - server: https://kubernetes.default.svc
      namespace: hister
    - server: https://kubernetes.default.svc
      namespace: homeassistant
    - server: https://kubernetes.default.svc
      namespace: image-builder
    - server: https://kubernetes.default.svc
      namespace: immich
    - server: https://kubernetes.default.svc
      namespace: karakeep
    - server: https://kubernetes.default.svc
      namespace: keycloak
    - server: https://kubernetes.default.svc
      namespace: mail
    - server: https://kubernetes.default.svc
      namespace: mastodon
    - server: https://kubernetes.default.svc
      namespace: matrix
    - server: https://kubernetes.default.svc
      namespace: mempalace
    - server: https://kubernetes.default.svc
      namespace: minecraft
    - server: https://kubernetes.default.svc
      namespace: nextcloud
    - server: https://kubernetes.default.svc
      namespace: ollama
    - server: https://kubernetes.default.svc
      namespace: open-terminal
    - server: https://kubernetes.default.svc
      namespace: open-webui
    - server: https://kubernetes.default.svc
      namespace: plex
    - server: https://kubernetes.default.svc
      namespace: spotify
    - server: https://kubernetes.default.svc
      namespace: stirling-pdf
    - server: https://kubernetes.default.svc
      namespace: wordpress
    - server: https://kubernetes.default.svc
      namespace: year
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: ""
      kind: PersistentVolume
    - group: external-secrets.io
      kind: ClusterSecretStore
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  orphanedResources:
    warn: true
    ignore:
      # Certificate controllers and Helm intentionally own these generated Secrets.
      - group: ""
        kind: Secret
        name: "*-tls"
      - group: ""
        kind: Secret
        name: "sh.helm.release.v1.*"
