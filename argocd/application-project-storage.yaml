---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: storage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: storage
    app.kubernetes.io/part-of: argocd
    app.kubernetes.io/managed-by: argoCD
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Persistent storage, snapshots, and shared data services
  sourceRepos:
    - https://charts.longhorn.io/
    - https://github.com/shaman007/home-k3s.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: longhorn-system
    - server: https://kubernetes.default.svc
      namespace: seaweedfs
  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: scheduling.k8s.io
      kind: PriorityClass
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  orphanedResources:
    warn: true
    ignore:
      # Longhorn controllers materialize runtime state as CRs and CSI workloads.
      - group: longhorn.io
        kind: "*"
        name: "*"
      - group: ""
        kind: Pod
        name: "csi-*"
      - group: ""
        kind: Pod
        name: "engine-image-*"
      - group: ""
        kind: Pod
        name: "instance-manager-*"
      - group: ""
        kind: Pod
        name: "longhorn-csi-plugin-*"
      - group: apps
        kind: ControllerRevision
        name: "engine-image-*"
      - group: apps
        kind: ControllerRevision
        name: "longhorn-csi-plugin-*"
      - group: apps
        kind: DaemonSet
        name: "engine-image-*"
      - group: apps
        kind: DaemonSet
        name: longhorn-csi-plugin
      - group: apps
        kind: Deployment
        name: "csi-*"
      - group: apps
        kind: ReplicaSet
        name: "csi-*"
      - group: policy
        kind: PodDisruptionBudget
        name: "csi-*"
      - group: policy
        kind: PodDisruptionBudget
        name: "instance-manager-*"
      - group: ""
        kind: Secret
        name: "*-tls"
      - group: ""
        kind: Secret
        name: "sh.helm.release.v1.*"
      # Kubernetes/Talos bootstrap inventory shared by applications in kube-system.
      - group: ""
        kind: ConfigMap
        name: "coredns"
      - group: ""
        kind: ConfigMap
        name: "extension-apiserver-authentication"
      - group: ""
        kind: ConfigMap
        name: "kube-apiserver-legacy-service-account-token-tracking"
      - group: ""
        kind: ConfigMap
        name: "kubeconfig-in-cluster"
      - group: ""
        kind: ConfigMap
        name: "talos-bootstrap-manifests-inventory"
      - group: ""
        kind: Service
        name: "kube-dns"
      - group: ""
        kind: ServiceAccount
        name: "attachdetach-controller"
      - group: ""
        kind: ServiceAccount
        name: "certificate-controller"
      - group: ""
        kind: ServiceAccount
        name: "clusterrole-aggregation-controller"
      - group: ""
        kind: ServiceAccount
        name: "coredns"
      - group: ""
        kind: ServiceAccount
        name: "cronjob-controller"
      - group: ""
        kind: ServiceAccount
        name: "daemon-set-controller"
      - group: ""
        kind: ServiceAccount
        name: "deployment-controller"
      - group: ""
        kind: ServiceAccount
        name: "device-taint-eviction-controller"
      - group: ""
        kind: ServiceAccount
        name: "disruption-controller"
      - group: ""
        kind: ServiceAccount
        name: "endpoint-controller"
      - group: ""
        kind: ServiceAccount
        name: "endpointslice-controller"
      - group: ""
        kind: ServiceAccount
        name: "endpointslicemirroring-controller"
      - group: ""
        kind: ServiceAccount
        name: "ephemeral-volume-controller"
      - group: ""
        kind: ServiceAccount
        name: "expand-controller"
      - group: ""
        kind: ServiceAccount
        name: "generic-garbage-collector"
      - group: ""
        kind: ServiceAccount
        name: "horizontal-pod-autoscaler"
      - group: ""
        kind: ServiceAccount
        name: "job-controller"
      - group: ""
        kind: ServiceAccount
        name: "kube-apiserver-serving-clustertrustbundle-publisher"
      - group: ""
        kind: ServiceAccount
        name: "legacy-service-account-token-cleaner"
      - group: ""
        kind: ServiceAccount
        name: "namespace-controller"
      - group: ""
        kind: ServiceAccount
        name: "node-controller"
      - group: ""
        kind: ServiceAccount
        name: "persistent-volume-binder"
      - group: ""
        kind: ServiceAccount
        name: "pod-garbage-collector"
      - group: ""
        kind: ServiceAccount
        name: "podcertificaterequestcleaner"
      - group: ""
        kind: ServiceAccount
        name: "pv-protection-controller"
      - group: ""
        kind: ServiceAccount
        name: "pvc-protection-controller"
      - group: ""
        kind: ServiceAccount
        name: "replicaset-controller"
      - group: ""
        kind: ServiceAccount
        name: "replication-controller"
      - group: ""
        kind: ServiceAccount
        name: "resource-claim-controller"
      - group: ""
        kind: ServiceAccount
        name: "resourcequota-controller"
      - group: ""
        kind: ServiceAccount
        name: "root-ca-cert-publisher"
      - group: ""
        kind: ServiceAccount
        name: "service-account-controller"
      - group: ""
        kind: ServiceAccount
        name: "service-cidrs-controller"
      - group: ""
        kind: ServiceAccount
        name: "statefulset-controller"
      - group: ""
        kind: ServiceAccount
        name: "storage-version-migrator-controller"
      - group: ""
        kind: ServiceAccount
        name: "token-cleaner"
      - group: ""
        kind: ServiceAccount
        name: "ttl-after-finished-controller"
      - group: ""
        kind: ServiceAccount
        name: "ttl-controller"
      - group: ""
        kind: ServiceAccount
        name: "validatingadmissionpolicy-status-controller"
      - group: ""
        kind: ServiceAccount
        name: "volumeattributesclass-protection-controller"
      - group: "apps"
        kind: Deployment
        name: "coredns"
      - group: "rbac.authorization.k8s.io"
        kind: Role
        name: "extension-apiserver-authentication-reader"
      - group: "rbac.authorization.k8s.io"
        kind: Role
        name: "system::leader-locking-kube-controller-manager"
      - group: "rbac.authorization.k8s.io"
        kind: Role
        name: "system::leader-locking-kube-scheduler"
      - group: "rbac.authorization.k8s.io"
        kind: Role
        name: "system:controller:bootstrap-signer"
      - group: "rbac.authorization.k8s.io"
        kind: Role
        name: "system:controller:cloud-provider"
      - group: "rbac.authorization.k8s.io"
        kind: Role
        name: "system:controller:token-cleaner"
      - group: "rbac.authorization.k8s.io"
        kind: RoleBinding
        name: "system::extension-apiserver-authentication-reader"
      - group: "rbac.authorization.k8s.io"
        kind: RoleBinding
        name: "system::leader-locking-kube-controller-manager"
      - group: "rbac.authorization.k8s.io"
        kind: RoleBinding
        name: "system::leader-locking-kube-scheduler"
      - group: "rbac.authorization.k8s.io"
        kind: RoleBinding
        name: "system:controller:bootstrap-signer"
      - group: "rbac.authorization.k8s.io"
        kind: RoleBinding
        name: "system:controller:cloud-provider"
      - group: "rbac.authorization.k8s.io"
        kind: RoleBinding
        name: "system:controller:token-cleaner"
      # Longhorn recovery state, webhook CA, and externally provisioned backup/S3 credentials.
      - group: ""
        kind: ConfigMap
        name: "recovery-backend-share-manager-*"
      - group: ""
        kind: Secret
        name: "longhorn-backup-s3"
      - group: ""
        kind: Secret
        name: "longhorn-webhook-ca"
      - group: ""
        kind: Secret
        name: "s3-admin"
      - group: ""
        kind: Pod
        name: "coredns-*"
      - group: "apps"
        kind: ReplicaSet
        name: "coredns-*"
      - group: ""
        kind: Secret
        name: "bootstrap-token-*"
