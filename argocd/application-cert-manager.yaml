---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: v1.21.1
      helm:
        releaseName: cert-manager
        values: |
          crds:
            enabled: true
          global:
            priorityClassName: homelab-critical
          replicaCount: 3
          strategy:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 0
              maxUnavailable: 1
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/instance: cert-manager
                      app.kubernetes.io/component: controller
                  topologyKey: kubernetes.io/hostname
          podDisruptionBudget:
            enabled: true
            minAvailable: 2
          prometheus:
            enabled: false
          extraArgs:
            - --acme-http01-solver-resource-limits-cpu=0
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
          networkPolicy:
            enabled: true
          webhook:
            replicaCount: 3
            strategy:
              type: RollingUpdate
              rollingUpdate:
                maxSurge: 0
                maxUnavailable: 1
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
                effect: NoSchedule
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        app.kubernetes.io/instance: cert-manager
                        app.kubernetes.io/component: webhook
                    topologyKey: kubernetes.io/hostname
            podDisruptionBudget:
              enabled: true
              minAvailable: 2
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
            networkPolicy:
              enabled: true
          cainjector:
            replicaCount: 3
            strategy:
              type: RollingUpdate
              rollingUpdate:
                maxSurge: 0
                maxUnavailable: 1
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
                effect: NoSchedule
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        app.kubernetes.io/instance: cert-manager
                        app.kubernetes.io/component: cainjector
                    topologyKey: kubernetes.io/hostname
            podDisruptionBudget:
              enabled: true
              minAvailable: 2
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
            networkPolicy:
              enabled: true
    - repoURL: https://github.com/shaman007/home-k3s.git
      path: cert-manager
      targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
