---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mail
  namespace: argocd
spec:
  project: applications
  source:
    repoURL: 'https://github.com/shaman007/home-k3s.git'
    path: mail
    targetRevision: main
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: mail
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: letsencrypt-prod
      namespace: mail
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - RespectIgnoreDifferences=true
