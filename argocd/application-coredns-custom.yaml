---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coredns-custom
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: 'https://github.com/shaman007/home-k3s.git'
    path: kube-system/coredns-custom
    targetRevision: main
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
