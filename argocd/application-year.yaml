---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: year
  namespace: argocd
spec:
  project: applications
  source:
    repoURL: 'https://github.com/shaman007/home-k3s.git'
    path: year
    targetRevision: main
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: year
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
