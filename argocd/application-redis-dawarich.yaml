---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-dawarich
  namespace: argocd
spec:
  project: storage
  source:
    repoURL: https://github.com/shaman007/home-k3s.git
    targetRevision: main
    path: redis/retired/dawarich
  destination:
    server: https://kubernetes.default.svc
    namespace: dawarich
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
