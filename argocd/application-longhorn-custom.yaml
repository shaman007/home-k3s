---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn-custom
  namespace: argocd
spec:
  project: storage
  source:
    repoURL: "https://github.com/shaman007/home-k3s.git"
    path: longhorn
    targetRevision: main
    directory:
      recurse: false
      include: "{ingress-*.yaml,network-policy-*.yaml,recurring-jobs-proposed.yaml,trim-coverage-guard.yaml,policy-recurring-job-security.yaml,recurring-job-security-backfill.yaml,policy-component-security.yaml,component-security-backfill.yaml,policy-argocd-resource-updates.yaml}"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: longhorn-system
  syncPolicy:
    automated:
      selfHeal: true
