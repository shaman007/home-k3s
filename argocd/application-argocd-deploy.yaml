---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-deploy
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: "https://github.com/shaman007/home-k3s.git"
    path: argocd-deploy
    targetRevision: main
  destination:
    server: "https://kubernetes.default.svc"
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
