apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mastodon
  namespace: argocd
spec:
  project: applications
  source:
    repoURL: https://github.com/shaman007/home-k3s.git
    targetRevision: main
    path: mastodon/native
  destination:
    server: https://kubernetes.default.svc
    namespace: mastodon
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    automated:
      selfHeal: true
