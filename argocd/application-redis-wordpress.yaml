---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-wordpress
  namespace: argocd
spec:
  project: storage
  source:
    repoURL: https://ot-container-kit.github.io/helm-charts/
    targetRevision: 0.16.9
    chart: redis
    helm:
      releaseName: redis
      values: |
        priorityClassName: homelab-essential
        redisStandalone:
          image: harbor.andreybondarenko.com/quay/opstree/redis
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          runAsNonRoot: true
        redisExporter:
          enabled: true
          image: harbor.andreybondarenko.com/quay/opstree/redis-exporter
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
      parameters:
      - name: redisExporter.enabled
        value: 'true'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: wordpress
  syncPolicy:
    automated:
      selfHeal: true
