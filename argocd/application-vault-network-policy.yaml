---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-network-policy
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: "https://github.com/shaman007/home-k3s.git"
    path: vault
    targetRevision: main
    directory:
      recurse: false
      include: "{network-policy-*.yaml,cilium-network-policy-*.yaml}"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
