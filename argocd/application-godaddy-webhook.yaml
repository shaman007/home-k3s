---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: godaddy-webhook
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/shaman007/home-k3s.git
    path: tools/godaddy-webhook/chart
    targetRevision: main
    helm:
      releaseName: godaddy-webhook
      values: |
        productionEnabled: true
        openbao:
          server: https://openbao-api.int.andreybondarenko.com:8200
          useSystemTrust: true
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  ignoreDifferences:
  - group: apiregistration.k8s.io
    kind: APIService
    name: v1alpha1.acme.int.andreybondarenko.com
    jsonPointers:
    - /spec/caBundle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - RespectIgnoreDifferences=true
