---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpu-operator
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://helm.ngc.nvidia.com/nvidia
    targetRevision: v26.7.2
    chart: gpu-operator
    helm:
      values: |
        operator:
          repository: nvcr.io/nvidia
          resources:
            limits:
              # Null removes the chart default CPU quota; keep its CPU request.
              cpu: null
              memory: 350Mi
            requests:
              cpu: 200m
              memory: 100Mi
        validator:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          repository: nvcr.io/nvidia
        driver:
          enabled: false
        toolkit:
          enabled: false
        hostPaths:
          driverInstallDir: /usr/local
        devicePlugin:
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          repository: nvcr.io/nvidia
          config:
            create: true
            name: nvidia-device-plugin-config
            default: default
            data:
              default: |-
                version: v1
                flags:
                  migStrategy: none
                  failOnInitError: true
                  nvidiaDriverRoot: /
                  plugin:
                    deviceListStrategy: envvar
                    deviceIDStrategy: uuid
                sharing:
                  timeSlicing:
                    resources:
                      - name: nvidia.com/gpu
                        replicas: 8
        dcgmExporter:
          resources:
            requests:
              cpu: 10m
              memory: 512Mi
            limits:
              memory: 1Gi
          repository: nvcr.io/nvidia/k8s
        gfd:
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          repository: nvcr.io/nvidia
        migManager:
          repository: nvcr.io/nvidia/cloud-native
        node-feature-discovery:
          image:
            repository: registry.k8s.io/nfd/node-feature-discovery
          # Explicitly retain the RuntimeDefault already supplied by the kubelets.
          master:
            podSecurityContext:
              seccompProfile:
                type: RuntimeDefault
          gc:
            podSecurityContext:
              seccompProfile:
                type: RuntimeDefault
          worker:
            # The only GPU is on this node; avoid discovery workers elsewhere.
            nodeSelector:
              kubernetes.io/hostname: talos-d4h-k5m
            podSecurityContext:
              seccompProfile:
                type: RuntimeDefault
  destination:
    server: https://kubernetes.default.svc
    namespace: gpu-operator
  syncPolicy:
    automated:
      selfHeal: true
      enabled: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
    syncOptions:
      - CreateNamespace=true
