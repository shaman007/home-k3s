apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-registry
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 42.3.2
    helm:
      releaseName: traefik-registry
      values: |
        image:
          registry: docker.io
          repository: traefik
          tag: v3.7.18
        deployment:
          replicas: 2
        ingressClass:
          enabled: true
          name: traefik-registry
          isDefaultClass: false
        providers:
          kubernetesIngress:
            enabled: true
            ingressClass: traefik-registry
            namespaces:
            - harbor
            publishedService:
              enabled: false
          kubernetesCRD:
            enabled: false
        service:
          annotations:
            metallb.io/loadBalancerIPs: 192.168.30.212
            metallb.io/address-pool: registry-bootstrap
          spec:
            type: LoadBalancer
            loadBalancerClass: metallb-l2
            externalTrafficPolicy: Local
            ipFamilyPolicy: SingleStack
            ipFamilies:
            - IPv4
            loadBalancerSourceRanges:
            - 192.168.30.0/24
            - 192.168.1.0/24
            - 192.168.4.0/24
            - 10.42.0.0/16
        ports:
          web:
            expose:
              default: false
          websecure:
            http:
              tls:
                enabled: true
        persistence:
          enabled: false
        priorityClassName: homelab-critical
        tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: traefik-registry-traefik
              topologyKey: kubernetes.io/hostname
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        additionalArguments:
        - --providers.kubernetesingress.ingressendpoint.ip=192.168.30.212
        - --entryPoints.websecure.http.aliasHeadersStrategy=reject
        extraObjects:
        - apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: traefik-registry-allow-https
            namespace: traefik
          spec:
            podSelector:
              matchLabels:
                app.kubernetes.io/instance: traefik-registry-traefik
            policyTypes:
            - Ingress
            ingress:
            - from:
              - ipBlock:
                  cidr: 192.168.30.0/24
              - ipBlock:
                  cidr: 192.168.1.0/24
              - ipBlock:
                  cidr: 192.168.4.0/24
              - ipBlock:
                  cidr: 10.42.0.0/16
              ports:
              - protocol: TCP
                port: 8443
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      enabled: true
      selfHeal: true
      prune: true
