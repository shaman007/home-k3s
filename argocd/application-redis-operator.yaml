---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-operator
  namespace: argocd
spec:
  project: storage
  source:
    repoURL: https://ot-container-kit.github.io/helm-charts/
    targetRevision: 0.25.0
    chart: redis-operator
    helm:
      releaseName: redis-operator
      values: |
        priorityClassName: homelab-critical
        redisOperator:
          imageName: harbor.andreybondarenko.com/quay/opstree/redis-operator
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          seccompProfile:
            type: RuntimeDefault
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        resources:
          requests:
            cpu: 50m
            memory: 500Mi
          limits:
            memory: 500Mi
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: ot-operators
  syncPolicy:
    automated:
      selfHeal: true
      enabled: true
    syncOptions:
      - ServerSideApply=true
