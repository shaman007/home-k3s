---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: elastic-stack-network-policy
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: observability
  source:
    repoURL: "https://github.com/shaman007/home-k3s.git"
    path: elastic
    targetRevision: main
    directory:
      recurse: false
      include: network-policy-*.yaml
  destination:
    server: "https://kubernetes.default.svc"
    namespace: elastic-stack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
