---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: open-terminal
  namespace: argocd
spec:
  project: applications
  source:
    repoURL: 'https://github.com/shaman007/home-k3s.git'
    path: open-terminal
    targetRevision: main
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: open-terminal
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
