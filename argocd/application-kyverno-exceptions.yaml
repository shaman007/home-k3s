apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-exceptions
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  project: kyverno
  source:
    repoURL: https://github.com/shaman007/home-k3s.git
    targetRevision: main
    path: kyverno
    directory:
      include: '{policy-exceptions-*.yaml,policy-require-*.yaml,policy-verify-*.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
    - ServerSideApply=true
