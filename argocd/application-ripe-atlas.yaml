apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ripe-atlas
  namespace: argocd
spec:
  project: applications
  source:
    repoURL: "https://github.com/shaman007/home-k3s.git"
    path: ripe-atlas
    targetRevision: main
  destination:
    server: "https://kubernetes.default.svc"
    namespace: ripe-atlas
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
