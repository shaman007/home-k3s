---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor-network-policy
  namespace: argocd
spec:
  project: applications
  source:
    repoURL: "https://github.com/shaman007/home-k3s.git"
    path: harbor
    targetRevision: main
    directory:
      recurse: false
      include: network-policy-*.yaml
  destination:
    server: "https://kubernetes.default.svc"
    namespace: harbor
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
