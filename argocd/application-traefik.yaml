---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: platform
  source:
    repoURL: https://traefik.github.io/charts
    targetRevision: 42.1.3
    chart: traefik
    helm:
      releaseName: traefik
      values: |
        deployment:
          annotations:
            argocd.argoproj.io/sync-options: ServerSideApply=true
          initContainers:
          - command:
            - sh
            - -ceu
            - "db_dir='/data/geoip'\ndb_file=\"$db_dir/dbip-country-lite.mmdb\"\ndb_archive='/tmp/dbip-country-lite.mmdb.gz'\n\
              db_url='https://download.db-ip.com/free/dbip-country-lite-latest.mmdb.gz'\nmkdir -p \"$db_dir\"\n# Publish\
              \ on the same filesystem using rename; readers never see a partial DB.\ndb_staged=\"$(mktemp \"$db_dir/.country.XXXXXX\"\
              )\"\ntrap 'rm -f \"$db_staged\" \"$db_archive\"' EXIT\npublish_db() {\n  gunzip -c \"$db_archive\" > \"$db_staged\"\
              \n  test -s \"$db_staged\"\n  chmod 0644 \"$db_staged\"\n  mv -f \"$db_staged\" \"$db_file\"\n}\nif wget -q\
              \ -O \"$db_archive\" \"$db_url\"; then\n  publish_db\n  rm -f \"$db_archive\"\n  chmod 0644 \"$db_file\"\n\
              \  exit 0\nfi\nif ! wget -q -O \"$db_archive\" \"$db_url\"; then\n  page=\"$(wget -qO- https://db-ip.com/db/download/ip-to-country-lite)\"\
              \n  db_url=\"$(printf '%s' \"$page\" | tr '\\n' ' ' | sed -n 's/.*\\(https:\\/\\/download\\.db-ip\\.com\\\
              /free\\/dbip-country-lite-[0-9][0-9][0-9][0-9]-[0-9][0-9]\\.mmdb\\.gz\\).*/\\1/p')\"\n  test -n \"$db_url\"\
              \n  if wget -q -O \"$db_archive\" \"$db_url\"; then\n    publish_db\n    rm -f \"$db_archive\"\n    chmod\
              \ 0644 \"$db_file\"\n    exit 0\n  fi\nfi\nrm -f \"$db_archive\"\ntest -s \"$db_file\"\n"
            image: docker.io/library/busybox:1.38.0
            name: download-geoip-country-db
            volumeMounts:
            - mountPath: /data
              name: data
          replicas: 2

        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: node.kubernetes.io/exclude-from-external-load-balancers
                  operator: DoesNotExist
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: traefik
                  app.kubernetes.io/instance: traefik-traefik
              topologyKey: kubernetes.io/hostname

        experimental:
          plugins:
            geoip2:
              moduleName: github.com/thiagotognoli/traefikgeoip
              version: v1.1.1
            robotstxt:
              moduleName: github.com/solution-libre/traefik-plugin-robots-txt
              version: v0.2.2
        ingressRoute:
          dashboard:
            annotations:
              kubernetes.io/ingress.class: traefik
            enabled: true
        additionalArguments:
        - --entryPoints.web.allowACMEByPass=true
        - --entryPoints.web.http.redirections.entryPoint.to=websecure
        - --entryPoints.web.http.redirections.entryPoint.scheme=https
        - --entryPoints.web.http.redirections.entryPoint.permanent=true
        - --entryPoints.websecure.http.encodedCharacters.allowEncodedPercent=true
        - --entryPoints.websecure.http.encodedCharacters.allowEncodedSlash=true
        - --log.level=INFO
        - --accesslog=true
        - --accesslog.format=json
        - --accesslog.fields.defaultmode=keep
        - --accesslog.fields.headers.defaultmode=drop
        - --accesslog.fields.headers.names.CF-IPCountry=keep
        - --accesslog.fields.headers.names.GeoIP-Country=keep
        - --accesslog.fields.headers.names.GeoIP-Country-Code=keep
        - --accesslog.fields.headers.names.X-Forwarded-For=keep
        persistence:
          enabled: true
          existingClaim: traefik-geoip-rwx
          path: /data
          accessMode: ReadWriteMany
          size: 1Gi
          storageClass: longhorn

        priorityClassName: homelab-critical
        podSecurityContext:
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
        updateStrategy:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 0
            maxSurge: 1

        ports:
          smtp:
            port: 25
            exposedPort: 25
            expose:
              default: true
            protocol: TCP
          imaps:
            expose:
              default: true
            exposedPort: 993
            port: 993
            protocol: TCP
          managesieve:
            expose:
              default: true
            exposedPort: 4190
            port: 4190
            protocol: TCP
          minecraft:
            expose:
              default: true
            exposedPort: 25565
            port: 25565
            protocol: TCP
          submission:
            expose:
              default: true
            exposedPort: 587
            port: 587
            protocol: TCP
          web:
            exposedPort: 80
            port: 80
          websecure:
            exposedPort: 443
            port: 443
            http3:
              enabled: true
              advertisedPort: 443
            http:
              tls:
                enabled: true
        providers:
          kubernetesCRD:
            ingressClass: traefik
            enabled: true
          kubernetesIngress:
            ingressClass: traefik
            enabled: true
        extraObjects:
        - apiVersion: traefik.io/v1alpha1
          kind: Middleware
          metadata:
            name: internal-clients-only
            namespace: traefik
          spec:
            ipAllowList:
              sourceRange:
              - 192.168.30.0/24
              - 2a02:e98:c0:181e::/64
              - 192.168.4.0/24
              - 10.42.0.0/16
              - fd74:67a:1fcf:4200::/56
        - apiVersion: traefik.io/v1alpha1
          kind: Middleware
          metadata:
            name: geoip-country
            namespace: traefik
          spec:
            plugin:
              geoip2:
                countryDbPath: /data/geoip/dbip-country-lite.mmdb
        - apiVersion: traefik.io/v1alpha1
          kind: Middleware
          metadata:
            name: robots-disallow-all
            namespace: traefik
          spec:
            plugin:
              robotstxt:
                overwrite: true
                enableComment: false
                customRules: 'User-agent: *

                  Disallow: /

                  '
        - apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: geoip-db-refresh
            namespace: traefik
        - apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          metadata:
            name: geoip-db-refresh
            namespace: traefik
          rules:
          - apiGroups:
            - apps
            resourceNames:
            - '{{ include "traefik.fullname" . }}'
            resources:
            - deployments
            verbs:
            - get
            - patch
        - apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata:
            name: geoip-db-refresh
            namespace: traefik
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: geoip-db-refresh
          subjects:
          - kind: ServiceAccount
            name: geoip-db-refresh
            namespace: traefik
        - apiVersion: batch/v1
          kind: CronJob
          metadata:
            name: geoip-db-refresh
            namespace: traefik
          spec:
            concurrencyPolicy: Forbid
            failedJobsHistoryLimit: 3
            schedule: 17 4 2 * *
            successfulJobsHistoryLimit: 1
            jobTemplate:
              spec:
                backoffLimit: 1
                template:
                  metadata:
                    labels:
                      app.kubernetes.io/name: traefik
                  spec:
                    serviceAccountName: geoip-db-refresh
                    restartPolicy: OnFailure
                    containers:
                    - command:
                      - sh
                      - -ceu
                      - "api='https://kubernetes.default.svc/apis/apps/v1/namespaces/traefik/deployments/{{ include \"traefik.fullname\"\
                        \ . }}'\ntoken=\"$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)\"\nca_cert='/var/run/secrets/kubernetes.io/serviceaccount/ca.crt'\n\
                        timestamp=\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"\npayload=\"$(printf '{\"spec\":{\"template\":{\"metadata\"\
                        :{\"annotations\":{\"geoip.db-ip.com/restarted-at\":\"%s\"}}}}}' \"$timestamp\")\"\ncurl --fail\
                        \ --silent --show-error \\\n  --cacert \"$ca_cert\" \\\n  -X PATCH \\\n  -H \"Authorization: Bearer\
                        \ $token\" \\\n  -H 'Content-Type: application/strategic-merge-patch+json' \\\n  --data \"$payload\"\
                        \ \\\n  \"$api\"\n"
                      image: docker.io/curlimages/curl:8.23.0
                      imagePullPolicy: IfNotPresent
                      name: restart-traefik
        - apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: traefik-geoip-rwx
            namespace: traefik
            annotations:
              argocd.argoproj.io/sync-wave: '-2'
          spec:
            accessModes:
            - ReadWriteMany
            storageClassName: longhorn
            resources:
              requests:
                storage: 1Gi
        - apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: traefik
            namespace: traefik
            annotations:
              argocd.argoproj.io/sync-options: Prune=false
          spec:
            accessModes:
            - ReadWriteOnce
            storageClassName: longhorn
            volumeName: pvc-0b8e1746-93a0-401c-a4ac-e2aac9c7ff2e
            resources:
              requests:
                storage: 1Gi

        - apiVersion: traefik.io/v1alpha1
          kind: Middleware
          metadata:
            name: internal-clients-only
            namespace: traefik
          spec:
            ipAllowList:
              sourceRange:
              - 192.168.30.0/24
              - 2a02:e98:c0:181e::/64
              - 192.168.4.0/24
              - 10.42.0.0/16
              - fd74:67a:1fcf:4200::/56
        - apiVersion: traefik.io/v1alpha1
          kind: Middleware
          metadata:
            name: geoip-country
            namespace: traefik
          spec:
            plugin:
              geoip2:
                countryDbPath: /data/geoip/dbip-country-lite.mmdb
        - apiVersion: traefik.io/v1alpha1
          kind: Middleware
          metadata:
            name: robots-disallow-all
            namespace: traefik
          spec:
            plugin:
              robotstxt:
                overwrite: true
                enableComment: false
                customRules: |
                  User-agent: *
                  Disallow: /
        - apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: geoip-db-refresh
            namespace: traefik
        - apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          metadata:
            name: geoip-db-refresh
            namespace: traefik
          rules:
          - apiGroups:
            - apps
            resourceNames:
            - '{{ include "traefik.fullname" . }}'
            resources:
            - deployments
            verbs:
            - get
            - patch
        - apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata:
            name: geoip-db-refresh
            namespace: traefik
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: geoip-db-refresh
          subjects:
          - kind: ServiceAccount
            name: geoip-db-refresh
            namespace: traefik
        - apiVersion: batch/v1
          kind: CronJob
          metadata:
            name: geoip-db-refresh
            namespace: traefik
          spec:
            concurrencyPolicy: Forbid
            failedJobsHistoryLimit: 3
            schedule: 17 4 2 * *
            successfulJobsHistoryLimit: 1
            jobTemplate:
              spec:
                backoffLimit: 1
                template:
                  metadata:
                    labels:
                      app.kubernetes.io/name: traefik
                  spec:
                    serviceAccountName: geoip-db-refresh
                    restartPolicy: OnFailure
                    containers:
                    - command:
                      - sh
                      - -ceu
                      - |
                        api='https://kubernetes.default.svc/apis/apps/v1/namespaces/traefik/deployments/{{ include "traefik.fullname" . }}'
                        token="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
                        ca_cert='/var/run/secrets/kubernetes.io/serviceaccount/ca.crt'
                        timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                        payload="$(printf '{"spec":{"template":{"metadata":{"annotations":{"geoip.db-ip.com/restarted-at":"%s"}}}}}' "$timestamp")"
                        curl --fail --silent --show-error \
                          --cacert "$ca_cert" \
                          -X PATCH \
                          -H "Authorization: Bearer $token" \
                          -H 'Content-Type: application/strategic-merge-patch+json' \
                          --data "$payload" \
                          "$api"
                      image: docker.io/curlimages/curl:8.23.0
                      imagePullPolicy: IfNotPresent
                      name: restart-traefik
        service:
          single: true
          annotations:
            argocd.argoproj.io/sync-options: ServerSideApply=true
            metallb.io/loadBalancerIPs: "192.168.30.210,2a02:e98:c0:181e::210"
          spec:
            externalTrafficPolicy: Local
            loadBalancerClass: metallb-l2
            ipFamilyPolicy: RequireDualStack
            ipFamilies:
              - IPv4
              - IPv6
          type: LoadBalancer
        resources:
          requests:
            cpu: 25m
            memory: 256Mi
          limits:
            memory: 2Gi

        ingressClass:
          enabled: true
          name: traefik
          isDefaultClass: false

        podDisruptionBudget:
          enabled: true
          minAvailable: 1

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: traefik
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
