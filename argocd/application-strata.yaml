apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strata
  namespace: argocd
spec:
  project: applications
  source:
    repoURL: https://github.com/shaman007/home-k3s.git
    path: strata
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: strata
  # Manual sync permits stopping this evaluation model between benchmark runs.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
