---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: observability
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: observability
    app.kubernetes.io/part-of: argocd
    app.kubernetes.io/managed-by: argoCD
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Metrics, logs, dashboards, health checks, and telemetry exporters
  sourceRepos:
    - https://github.com/shaman007/home-k3s.git
    - https://grafana.github.io/helm-charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: connectivity-exporter
    - server: https://kubernetes.default.svc
      namespace: opensearch
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: loki
    - server: https://kubernetes.default.svc
      namespace: monitoring
    - server: https://kubernetes.default.svc
      namespace: unifi
  clusterResourceWhitelist:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  orphanedResources:
    warn: true
    ignore:
      # Certificate Secrets and ad-hoc diagnostic Jobs are controller/user generated.
      - group: ""
        kind: Secret
        name: "*-tls"
      - group: ""
        kind: Pod
        name: "*-manual-*"
      - group: batch
        kind: Job
        name: "*-manual-*"
      # Kubernetes/Talos bootstrap inventory shared by applications in kube-system.
      - group: ""
        kind: ConfigMap
        name: "coredns"
      - group: ""
        kind: ConfigMap
        name: "extension-apiserver-authentication"
      - group: ""
        kind: ConfigMap
        name: "kube-apiserver-legacy-service-account-token-tracking"
      - group: ""
        kind: ConfigMap
        name: "kubeconfig-in-cluster"
      - group: ""
        kind: ConfigMap
        name: "talos-bootstrap-manifests-inventory"
      - group: ""
        kind: Service
        name: "kube-dns"
      - group: ""
        kind: ServiceAccount
        name: "attachdetach-controller"
      - group: ""
        kind: ServiceAccount
        name: "certificate-controller"
      - group: ""
        kind: ServiceAccount
        name: "clusterrole-aggregation-controller"
      - group: ""
        kind: ServiceAccount
        name: "coredns"
      - group: ""
        kind: ServiceAccount
        name: "cronjob-controller"
      - group: ""
        kind: ServiceAccount
        name: "daemon-set-controller"
      - group: ""
        kind: ServiceAccount
        name: "deployment-controller"
      - group: ""
        kind: ServiceAccount
        name: "device-taint-eviction-controller"
      - group: ""
        kind: ServiceAccount
        name: "disruption-controller"
      - group: ""
        kind: ServiceAccount
        name: "endpoint-controller"
      - group: ""
        kind: ServiceAccount
        name: "endpointslice-controller"
      - group: ""
        kind: ServiceAccount
        name: "endpointslicemirroring-controller"
      - group: ""
        kind: ServiceAccount
        name: "ephemeral-volume-controller"
      - group: ""
        kind: ServiceAccount
        name: "expand-controller"
      - group: ""
        kind: ServiceAccount
        name: "generic-garbage-collector"
      - group: ""
        kind: ServiceAccount
        name: "horizontal-pod-autoscaler"
      - group: ""
        kind: ServiceAccount
        name: "job-controller"
      - group: ""
        kind: ServiceAccount
        name: "kube-apiserver-serving-clustertrustbundle-publisher"
      - group: ""
        kind: ServiceAccount
        name: "legacy-service-account-token-cleaner"
      - group: ""
        kind: ServiceAccount
        name: "namespace-controller"
      - group: ""
        kind: ServiceAccount
        name: "node-controller"
      - group: ""
        kind: ServiceAccount
        name: "persistent-volume-binder"
      - group: ""
        kind: ServiceAccount
        name: "pod-garbage-collector"
      - group: ""
        kind: ServiceAccount
        name: "podcertificaterequestcleaner"
      - group: ""
        kind: ServiceAccount
        name: "pv-protection-controller"
      - group: ""
        kind: ServiceAccount
        name: "pvc-protection-controller"
      - group: ""
        kind: ServiceAccount
        name: "replicaset-controller"
      - group: ""
        kind: ServiceAccount
        name: "replication-controller"
      - group: ""
        kind: ServiceAccount
        name: "resource-claim-controller"
      - group: ""
        kind: ServiceAccount
        name: "resourcequota-controller"
      - group: ""
        kind: ServiceAccount
        name: "root-ca-cert-publisher"
      - group: ""
        kind: ServiceAccount
        name: "service-account-controller"
      - group: ""
        kind: ServiceAccount
        name: "service-cidrs-controller"
      - group: ""
        kind: ServiceAccount
        name: "statefulset-controller"
      - group: ""
        kind: ServiceAccount
        name: "storage-version-migrator-controller"
      - group: ""
        kind: ServiceAccount
        name: "token-cleaner"
      - group: ""
        kind: ServiceAccount
        name: "ttl-after-finished-controller"
      - group: ""
        kind: ServiceAccount
        name: "ttl-controller"
      - group: ""
        kind: ServiceAccount
        name: "validatingadmissionpolicy-status-controller"
      - group: ""
        kind: ServiceAccount
        name: "volumeattributesclass-protection-controller"
      - group: "apps"
        kind: Deployment
        name: "coredns"
      - group: "rbac.authorization.k8s.io"
        kind: Role
        name: "extension-apiserver-authentication-reader"
      - group: "rbac.authorization.k8s.io"
        kind: Role
        name: "system::leader-locking-kube-controller-manager"
      - group: "rbac.authorization.k8s.io"
        kind: Role
        name: "system::leader-locking-kube-scheduler"
      - group: "rbac.authorization.k8s.io"
        kind: Role
        name: "system:controller:bootstrap-signer"
      - group: "rbac.authorization.k8s.io"
        kind: Role
        name: "system:controller:cloud-provider"
      - group: "rbac.authorization.k8s.io"
        kind: Role
        name: "system:controller:token-cleaner"
      - group: "rbac.authorization.k8s.io"
        kind: RoleBinding
        name: "system::extension-apiserver-authentication-reader"
      - group: "rbac.authorization.k8s.io"
        kind: RoleBinding
        name: "system::leader-locking-kube-controller-manager"
      - group: "rbac.authorization.k8s.io"
        kind: RoleBinding
        name: "system::leader-locking-kube-scheduler"
      - group: "rbac.authorization.k8s.io"
        kind: RoleBinding
        name: "system:controller:bootstrap-signer"
      - group: "rbac.authorization.k8s.io"
        kind: RoleBinding
        name: "system:controller:cloud-provider"
      - group: "rbac.authorization.k8s.io"
        kind: RoleBinding
        name: "system:controller:token-cleaner"
      # Bootstrap Helm release history is managed outside Argo CD.
      - group: ""
        kind: Secret
        name: "sh.helm.release.v1.*"
      - group: ""
        kind: Pod
        name: "coredns-*"
      - group: "apps"
        kind: ReplicaSet
        name: "coredns-*"
      - group: ""
        kind: Secret
        name: "bootstrap-token-*"
