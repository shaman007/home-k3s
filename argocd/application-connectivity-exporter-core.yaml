---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: connectivity-exporter-core
  namespace: argocd
spec:
  project: observability
  source:
    repoURL: "https://github.com/shaman007/home-k3s.git"
    path: connectivity-exporter
    targetRevision: main
    directory:
      recurse: false
      include: "*-*.yaml"
      exclude: "{network-policy-*.yaml,network-policies-generated.yaml}"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: connectivity-exporter
  syncPolicy:
    automated:
      selfHeal: true
