---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: convertx
  namespace: argocd
spec:
  project: applications
  source:
    repoURL: 'https://github.com/shaman007/home-k3s.git'
    path: convertx
    targetRevision: main
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: convertx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
