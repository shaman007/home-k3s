---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
spec:
  project: platform
  source:
    repoURL: "https://metallb.github.io/metallb"
    targetRevision: 0.16.1
    chart: metallb
    helm:
      values: |
        loadBalancerClass: metallb-l2
        # All current Services use L2; no BGP peers or advertisements exist.
        # Keep automatic pruning off during the staged FRR retirement.
        frrk8s:
          enabled: false
          external: false
        controller:
          priorityClassName: homelab-critical
          securityContext:
            seccompProfile:
              type: RuntimeDefault
        speaker:
          frr:
            enabled: false
          priorityClassName: homelab-critical
          securityContext:
            seccompProfile:
              type: RuntimeDefault
        frr-k8s:
          prometheus:
            serviceMonitor:
              enabled: false
  destination:
    server: "https://kubernetes.default.svc"
    namespace: metallb-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
      enabled: true
