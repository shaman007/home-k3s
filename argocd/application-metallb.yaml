---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
spec:
  project: platform
  source:
    repoURL: "https://metallb.github.io/metallb"
    targetRevision: 0.16.2
    chart: metallb
    helm:
      values: |
        loadBalancerClass: metallb-l2
        # FRR-K8s permits IPv4 BGP advertisements from the dual-stack pool.
        # L2 stays enabled for same-VLAN clients and the existing IPv6 VIP.
        # Keep automatic pruning off during the backend migration.
        frrk8s:
          enabled: true
          external: false
        controller:
          priorityClassName: homelab-critical
          securityContext:
            seccompProfile:
              type: RuntimeDefault
        speaker:
          frr:
            enabled: false
          updateStrategy:
            type: RollingUpdate
            rollingUpdate:
              maxUnavailable: 1
          priorityClassName: homelab-critical
          securityContext:
            # Production raw L2 sockets require the reviewed root identity.
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            seccompProfile:
              type: RuntimeDefault
        frr-k8s:
          prometheus:
            serviceMonitor:
              enabled: false
  destination:
    server: "https://kubernetes.default.svc"
    namespace: metallb-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
      enabled: true
