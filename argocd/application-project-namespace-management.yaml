---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: namespace-management
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/name: namespace-management
    app.kubernetes.io/part-of: argocd
    app.kubernetes.io/managed-by: argoCD
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Namespace lifecycle, quotas, limits, and shared priority classes
  sourceRepos:
    - https://github.com/shaman007/home-k3s.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: backup-rsync
    - server: https://kubernetes.default.svc
      namespace: bitwarden
    - server: https://kubernetes.default.svc
      namespace: ca-scanner
    - server: https://kubernetes.default.svc
      namespace: clamav
    - server: https://kubernetes.default.svc
      namespace: connectivity-exporter
    - server: https://kubernetes.default.svc
      namespace: convertx
    - server: https://kubernetes.default.svc
      namespace: dawarich
    - server: https://kubernetes.default.svc
      namespace: default
    - server: https://kubernetes.default.svc
      namespace: opensearch
    - server: https://kubernetes.default.svc
      namespace: external-secrets
    - server: https://kubernetes.default.svc
      namespace: harbor
    - server: https://kubernetes.default.svc
      namespace: hister
    - server: https://kubernetes.default.svc
      namespace: homeassistant
    - server: https://kubernetes.default.svc
      namespace: hypermind
    - server: https://kubernetes.default.svc
      namespace: image-builder
    - server: https://kubernetes.default.svc
      namespace: immich
    - server: https://kubernetes.default.svc
      namespace: karakeep
    - server: https://kubernetes.default.svc
      namespace: keycloak
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: loki
    - server: https://kubernetes.default.svc
      namespace: longhorn-system
    - server: https://kubernetes.default.svc
      namespace: mail
    - server: https://kubernetes.default.svc
      namespace: mastodon
    - server: https://kubernetes.default.svc
      namespace: matrix
    - server: https://kubernetes.default.svc
      namespace: mempalace
    - server: https://kubernetes.default.svc
      namespace: metallb-system
    - server: https://kubernetes.default.svc
      namespace: minecraft
    - server: https://kubernetes.default.svc
      namespace: monitoring
    - server: https://kubernetes.default.svc
      namespace: nextcloud
    - server: https://kubernetes.default.svc
      namespace: openbao
    - server: https://kubernetes.default.svc
      namespace: ooni
    - server: https://kubernetes.default.svc
      namespace: ripe-atlas
    - server: https://kubernetes.default.svc
      namespace: plex
    - server: https://kubernetes.default.svc
      namespace: seaweedfs
    - server: https://kubernetes.default.svc
      namespace: spotify
    - server: https://kubernetes.default.svc
      namespace: stirling-pdf
    - server: https://kubernetes.default.svc
      namespace: traefik
    - server: https://kubernetes.default.svc
      namespace: unifi
    - server: https://kubernetes.default.svc
      namespace: wordpress
    - server: https://kubernetes.default.svc
      namespace: year
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: scheduling.k8s.io
      kind: PriorityClass
  namespaceResourceWhitelist:
    - group: ""
      kind: LimitRange
    - group: ""
      kind: ResourceQuota
  orphanedResources:
    warn: true
