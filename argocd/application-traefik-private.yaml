apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-private
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
spec:
  project: platform
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 42.1.3
    helm:
      skipCrds: true
      releaseName: traefik-private
      values: |
        image:
          registry: docker.io
          repository: traefik
          tag: v3.7.17
        deployment:
          replicas: 2
          annotations:
            secret.reloader.stakater.com/reload: traefik-oidc
        ingressClass:
          enabled: true
          isDefaultClass: false
          name: traefik-private
        providers:
          kubernetesIngress:
            enabled: true
            ingressClass: traefik-private
            publishedService:
              enabled: true
              pathOverride: traefik/traefik-private
          kubernetesCRD:
            enabled: true
            ingressClass: traefik-private
        service:
          type: LoadBalancer
          single: true
          annotations:
            metallb.io/loadBalancerIPs: 192.168.30.211
            metallb.io/address-pool: private-ingress
          spec:
            externalTrafficPolicy: Local
            loadBalancerClass: metallb-l2
            ipFamilyPolicy: SingleStack
            ipFamilies:
            - IPv4
            loadBalancerSourceRanges:
            - 192.168.30.0/24
            - 192.168.4.0/24
            - 10.42.0.0/16
        ports:
          web:
            port: 80
            exposedPort: 80
          websecure:
            port: 443
            exposedPort: 443
            http3:
              enabled: true
              advertisedPort: 443
            http:
              tls:
                enabled: true
        additionalArguments:
        - --entryPoints.web.allowACMEByPass=true
        - --entryPoints.web.http.redirections.entryPoint.to=websecure
        - --entryPoints.web.http.redirections.entryPoint.scheme=https
        - --entryPoints.web.http.redirections.entryPoint.permanent=true
        - --accesslog=true
        - --accesslog.format=json
        - --accesslog.fields.headers.defaultmode=drop
        - --entryPoints.websecure.http.encodedCharacters.allowEncodedPercent=true
        - --entryPoints.websecure.http.encodedCharacters.allowEncodedSlash=true
        experimental:
          plugins:
            oidc:
              moduleName: github.com/sevensolutions/traefik-oidc-auth
              version: v0.21.0
            robotstxt:
              moduleName: github.com/solution-libre/traefik-plugin-robots-txt
              version: v0.2.2
        volumes:
        - name: traefik-oidc
          mountPath: /secrets/oidc
          type: secret
        ingressRoute:
          dashboard:
            enabled: false
        persistence:
          enabled: false
        priorityClassName: homelab-critical
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 1Gi
        extraObjects:
        - apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: oidc-vault-auth
            namespace: traefik
            annotations:
              argocd.argoproj.io/sync-wave: '-3'
          automountServiceAccountToken: false
        - apiVersion: external-secrets.io/v1
          kind: SecretStore
          metadata:
            name: traefik-oidc-store
            namespace: traefik
            annotations:
              argocd.argoproj.io/sync-wave: '-3'
          spec:
            refreshInterval: 900
            provider:
              vault:
                server: https://openbao.openbao.svc:8200
                path: kv
                version: v2
                caBundle: 
                auth:
                  kubernetes:
                    mountPath: kubernetes
                    role: external-secrets-traefik-oidc
                    serviceAccountRef:
                      name: oidc-vault-auth
                      audiences:
                      - vault
        - apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: traefik-oidc
            namespace: traefik
            annotations:
              argocd.argoproj.io/sync-wave: '-2'
          spec:
            refreshInterval: 15m
            secretStoreRef:
              name: traefik-oidc-store
              kind: SecretStore
            target:
              name: traefik-oidc
              creationPolicy: Owner
            data:
            - secretKey: clientSecret
              remoteRef:
                key: traefik-oidc
                property: clientSecret
            - secretKey: sessionSecret
              remoteRef:
                key: traefik-oidc
                property: sessionSecret
        - apiVersion: traefik.io/v1alpha1
          kind: Middleware
          metadata:
            name: admin-oidc
            namespace: traefik
            annotations:
              kubernetes.io/ingress.class: traefik-private
          spec:
            plugin:
              oidc:
                Secret: ${file:/secrets/oidc/sessionSecret}
                Provider:
                  Url: https://sso.andreybondarenko.com/realms/master
                  ClientId: traefik-admin
                  ClientSecret: ${file:/secrets/oidc/clientSecret}
                  UsePkce: "true"
                  ValidateAudience: "true"
                  ValidateIssuer: "true"
                  TokenValidation: IdToken
                Scopes:
                - openid
                - profile
                - email
                CallbackUri: /oidc/callback
                SessionCookie:
                  Secure: true
                  HttpOnly: true
                  SameSite: lax
                  MaxAge: 3600
                Authorization:
                  AssertClaims:
                  - Name: realm_roles
                    AnyOf:
                    - admin
                  CheckOnEveryRequest: true
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
