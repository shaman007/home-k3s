apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-private
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
spec:
  project: platform
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 42.1.3
    helm:
      skipCrds: true
      releaseName: traefik-private
      values: |
        image:
          registry: docker.io
          repository: traefik
          tag: v3.7.16
        deployment:
          replicas: 2
        ingressClass:
          enabled: true
          isDefaultClass: false
          name: traefik-private
        providers:
          kubernetesIngress:
            enabled: true
            ingressClass: traefik-private
            publishedService:
              enabled: true
              pathOverride: traefik/traefik-private
          kubernetesCRD:
            enabled: true
            ingressClass: traefik-private
        service:
          type: LoadBalancer
          single: true
          annotations:
            metallb.io/loadBalancerIPs: 192.168.30.211
            metallb.io/address-pool: private-ingress
          spec:
            externalTrafficPolicy: Local
            loadBalancerClass: metallb-l2
            ipFamilyPolicy: SingleStack
            ipFamilies:
            - IPv4
            loadBalancerSourceRanges:
            - 192.168.30.0/24
            - 192.168.4.0/24
            - 10.42.0.0/16
        ports:
          web:
            port: 80
            exposedPort: 80
          websecure:
            port: 443
            exposedPort: 443
            http3:
              enabled: true
              advertisedPort: 443
            http:
              tls:
                enabled: true
        additionalArguments:
        - --entryPoints.web.allowACMEByPass=true
        - --entryPoints.web.http.redirections.entryPoint.to=websecure
        - --entryPoints.web.http.redirections.entryPoint.scheme=https
        - --entryPoints.web.http.redirections.entryPoint.permanent=true
        - --accesslog=true
        - --accesslog.format=json
        - --accesslog.fields.headers.defaultmode=drop
        - --entryPoints.websecure.http.encodedCharacters.allowEncodedPercent=true
        - --entryPoints.websecure.http.encodedCharacters.allowEncodedSlash=true
        experimental:
          plugins:
            robotstxt:
              moduleName: github.com/solution-libre/traefik-plugin-robots-txt
              version: v0.2.2
        ingressRoute:
          dashboard:
            enabled: false
        persistence:
          enabled: false
        priorityClassName: homelab-critical
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 1Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
