---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: unifi-exporter
  namespace: argocd
spec:
  project: observability
  source:
    repoURL: 'https://github.com/shaman007/home-k3s.git'
    path: unifi/poller
    targetRevision: main
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: unifi
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: vault-token
      namespace: unifi
      jsonPointers:
        - /data
  syncPolicy:
    automated: {}
    syncOptions:
      - RespectIgnoreDifferences=true
