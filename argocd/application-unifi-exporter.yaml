---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: unifi-exporter
  namespace: argocd
spec:
  project: observability
  source:
    repoURL: 'https://github.com/shaman007/home-k3s.git'
    path: unifi/poller
    targetRevision: main
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: unifi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
