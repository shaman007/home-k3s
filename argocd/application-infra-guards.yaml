apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-guards
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '3'
spec:
  project: infra-guards
  source:
    repoURL: https://github.com/shaman007/home-k3s.git
    targetRevision: main
    path: infra-guards
    directory:
      include: resources.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
