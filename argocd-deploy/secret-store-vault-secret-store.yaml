apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-secret-store
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd
    app.kubernetes.io/instance: argocd
    app.kubernetes.io/part-of: argocd
    app.kubernetes.io/managed-by: argo-cd
spec:
  refreshInterval: 900
  provider:
    vault:
      server: "https://openbao-api.int.andreybondarenko.com:8200"
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets-argocd
          serviceAccountRef:
            name: vault-auth
            audiences:
              - vault
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: argocd
automountServiceAccountToken: false
