---
apiVersion: v1
kind: Service
metadata:
  name: backup-rsync
  namespace: backup-rsync
  annotations:
    metallb.io/loadBalancerIPs: 192.168.30.213
  labels:
    app: backup-rsync
spec:
  type: LoadBalancer
  loadBalancerClass: metallb-l2
  externalTrafficPolicy: Local
  selector:
    app: backup-rsync
  ports:
    - name: ssh
      port: 22
      targetPort: ssh
      protocol: TCP
