apiVersion: apps/v1
kind: Deployment
metadata:
  name: comfyui
  namespace: comfyui
  labels:
    app: comfyui
    app.kubernetes.io/name: comfyui
    app.kubernetes.io/instance: comfyui
    app.kubernetes.io/managed-by: argoCD
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: comfyui
  template:
    metadata:
      labels:
        app: comfyui
        app.kubernetes.io/name: comfyui
        app.kubernetes.io/instance: comfyui
    spec:
      automountServiceAccountToken: false
      priorityClassName: homelab-best-effort
      runtimeClassName: nvidia
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: talos-d4h-k5m
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: prepare-runtime-directories
          image: harbor.andreybondarenko.com/dockerhub/busybox:1.38
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
            readOnlyRootFilesystem: true
            runAsUser: 0
            runAsGroup: 0
            seccompProfile:
              type: RuntimeDefault
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /data/models /data/output /data/input /data/user /data/custom_nodes /data/home
              if [ ! -e /data/custom_nodes/ComfyUI-Manager ] && [ ! -L /data/custom_nodes/ComfyUI-Manager ]; then
                ln -s /opt/comfyui-manager /data/custom_nodes/ComfyUI-Manager
              fi
              chown 1000:1000 /data/models /data/output /data/input /data/user /data/custom_nodes /data/home /opt/comfyui/temp
              chmod 1777 /tmp
          volumeMounts:
            - name: comfyui-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: comfyui-temp
              mountPath: /opt/comfyui/temp
        - name: model-downloader
          image: harbor.andreybondarenko.com/dockerhub/alpine:3.24
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mkdir -p /models/checkpoints
              if [ ! -s /models/checkpoints/sdxl_lightning_4step.safetensors ]; then
                wget -O /models/checkpoints/sdxl_lightning_4step.safetensors.tmp https://huggingface.co/ByteDance/SDXL-Lightning/resolve/main/sdxl_lightning_4step.safetensors
                mv /models/checkpoints/sdxl_lightning_4step.safetensors.tmp /models/checkpoints/sdxl_lightning_4step.safetensors
              fi
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: comfyui-data
              mountPath: /models
      containers:
        - name: comfyui
          image: harbor.andreybondarenko.com/github/lecode-official/comfyui-docker:0.6.3-comfyui-0.8.2-pytorch-2.9.1-cuda-12.8-cudnn-9
          imagePullPolicy: IfNotPresent
          command:
            - /opt/conda/bin/python
            - main.py
            - --port
            - "8188"
            - --listen
            - 0.0.0.0
            - --disable-auto-launch
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: HOME
              value: /home/comfyui-user
            - name: XDG_CACHE_HOME
              value: /home/comfyui-user/.cache
            - name: TMPDIR
              value: /tmp
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
            - name: TZ
              value: Europe/Prague
          args:
            - --enable-cors-header
            - '*'
            - --disable-smart-memory
            - --cache-none
          ports:
            - name: http
              containerPort: 8188
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 10Gi
            limits:
              memory: 16Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - name: comfyui-data
              mountPath: /opt/comfyui/models
              subPath: models
            - name: comfyui-data
              mountPath: /opt/comfyui/output
              subPath: output
            - name: comfyui-data
              mountPath: /opt/comfyui/input
              subPath: input
            - name: comfyui-data
              mountPath: /opt/comfyui/user
              subPath: user
            - name: comfyui-data
              mountPath: /opt/comfyui/custom_nodes
              subPath: custom_nodes
            - name: comfyui-data
              mountPath: /home/comfyui-user
              subPath: home
            - name: tmp
              mountPath: /tmp
            - name: comfyui-temp
              mountPath: /opt/comfyui/temp
      volumes:
        - name: comfyui-data
          persistentVolumeClaim:
            claimName: comfyui-data
        - name: tmp
          emptyDir: {}
        - name: comfyui-temp
          emptyDir: {}
