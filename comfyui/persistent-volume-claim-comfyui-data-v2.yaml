apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: comfyui-data-v2
  namespace: comfyui
  labels:
    app: comfyui
    app.kubernetes.io/name: comfyui
    app.kubernetes.io/instance: comfyui
    app.kubernetes.io/managed-by: argoCD
    recurring-job.longhorn.io/trim-daily-a: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
