  annotations:
    argocd.argoproj.io/sync-wave: '-1'
  name: comfyui-letsencrypt-internal-tls
  namespace: comfyui
spec:
  dnsNames:
  - comfyui.int.andreybondarenko.com
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-internal-prod
  renewBefore: 720h
  secretName: comfyui-letsencrypt-internal-tls
